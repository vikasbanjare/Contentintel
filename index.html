            </div>
            <input className="ci-input" style={{ marginTop: 18 }} type="email" placeholder="you@email.com" value={email} onChange={e => setEmail(e.target.value)} />
            <input className="ci-input" style={{ marginTop: 10 }} type="password" placeholder="Password (8+ characters)" value={pass} onChange={e => setPass(e.target.value)} onKeyDown={e => e.key === 'Enter' && submit()} />
            {msg && <div style={{ fontSize: 12.5, marginTop: 12, lineHeight: 1.5, color: msg.startsWith('✓') ? '#8FD86A' : '#f5788c' }}>{msg}</div>}
            <div style={{ marginTop: 16 }}>
              <GlowButton mood="burgundy" size="lg" style={{ width: '100%', justifyContent: 'center' }} onClick={submit}>
                {busy ? 'One moment…' : mode === 'signup' ? 'Create account →' : 'Sign in →'}
              </GlowButton>
            </div>
            <div style={{ fontSize: 12.5, color: 'var(--text-4)', marginTop: 14, textAlign: 'center' }}>
              {mode === 'signup'
                ? <span>Already have an account? <a onClick={() => { setMode('signin'); setMsg(''); }} style={{ color: 'var(--text-2)', cursor: 'pointer', textDecoration: 'underline' }}>Sign in</a></span>
                : <span>New here? <a onClick={() => { setMode('signup'); setMsg(''); }} style={{ color: 'var(--text-2)', cursor: 'pointer', textDecoration: 'underline' }}>Create an account — 5 free checks</a></span>}
            </div>
          </>
        ) : (
          <>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
              <div style={{ width: 42, height: 42, borderRadius: '50%', background: 'linear-gradient(135deg, #6A1F35, #FF4D8D)', display: 'grid', placeItems: 'center', fontWeight: 700, color: '#fff', fontSize: 16 }}>
                {(profile?.email || 'U')[0].toUpperCase()}
              </div>
              <div>
                <div style={{ fontWeight: 700, fontSize: 15 }}>{profile?.email || '…'}</div>
                <div style={{ fontSize: 12, color: 'var(--text-3)' }}>{PLAN_LABEL[profile?.plan] || PLAN_LABEL.free}</div>
              </div>
            </div>
            <div style={{ marginTop: 20 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12.5, color: 'var(--text-3)', marginBottom: 7 }}>
                <span>Credits used this month</span><b style={{ color: 'var(--text-1)' }}>{used} / {limit}</b>
              </div>
              <div style={{ height: 8, borderRadius: 5, background: 'var(--stroke-1)', overflow: 'hidden' }}>
                <div style={{ height: '100%', width: pct + '%', borderRadius: 5, background: pct > 85 ? '#F06A7E' : pct > 60 ? '#F0C85A' : '#8FD86A', transition: 'width 0.8s cubic-bezier(0.2,0.7,0.3,1)' }} />
              </div>
            </div>
            <div style={{ marginTop: 18 }}>
              <div style={{ fontSize: 12, letterSpacing: '0.06em', textTransform: 'uppercase', color: 'var(--text-4)', marginBottom: 8, fontFamily: 'var(--font-mono)' }}>Engine — power vs credits</div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8 }}>
                {ENGINES_UI.map(en => {
                  const planOk = (PLAN_RANK[profile?.plan || 'free'] ?? 0) >= PLAN_RANK[en.minPlan];
                  const active = getEngine() === en.tier;
                  return (
                    <button key={en.tier} disabled={!planOk}
                      onClick={() => { setEngine(en.tier); setProfile(p2 => ({ ...p2 })); }}
                      style={{ textAlign: 'left', padding: '10px 11px', borderRadius: 11, cursor: planOk ? 'pointer' : 'not-allowed',
                        border: active ? '1.5px solid #FF4D8D' : '1px solid var(--stroke-2)',
                        background: active ? 'rgba(255,77,141,0.08)' : 'var(--surface-2)', opacity: planOk ? 1 : 0.45 }}>
                      <div style={{ fontSize: 13, fontWeight: 700, color: 'var(--text-1)' }}>{en.label} <span style={{ fontSize: 10.5, color: 'var(--text-4)', fontWeight: 500 }}>{en.model}</span></div>
                      <div style={{ fontSize: 10.5, color: 'var(--text-4)', marginTop: 3, lineHeight: 1.4 }}>{en.desc}</div>
                      <div style={{ fontSize: 11, color: active ? '#FF9CC2' : 'var(--text-3)', marginTop: 5, fontWeight: 700 }}>{en.credits} credit{en.credits > 1 ? 's' : ''}/check{!planOk ? ' · ' + (en.minPlan === 'pro' ? 'Pro+' : 'Starter+') : ''}</div>
                    </button>
                  );
                })}
              </div>
            </div>
            {(profile?.plan || 'free') !== 'agency' && (
              <div style={{ marginTop: 18 }}>
                <GlowButton mood="burgundy" style={{ width: '100%', justifyContent: 'center' }} onClick={() => { onClose(); onNav && onNav('pricing'); }}>
                  {profile?.plan === 'free' ? 'Upgrade — from ₹499/mo →' : 'Upgrade your plan →'}
                </GlowButton>
              </div>
            )}
            <div style={{ marginTop: 12, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <span style={{ fontSize: 11.5, color: 'var(--text-5)' }}>Your content is never stored — only this counter.</span>
              <button className="ci-copybtn" style={{ height: 32 }} onClick={signOut}>Sign out</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}
window.AccountModal = AccountModal;
window.CI_SAAS_ON = saasOn;
</script>
<script type="text/babel" data-presets="react">
/* ===== ci-gate.jsx ===== */
// ContentIntel -- onboarding gate. First-time visitors land here:
//   welcome / sign-in  ->  pricing (skippable)  ->  the app.
// Works TODAY in "early access" mode (email capture, no backend) and upgrades
// to real Supabase accounts + email confirmation the moment CI_SAAS is set.

const GATE_KEY = 'ci_onboarded';
const EMAIL_KEY = 'ci_user_email';
function gateDone()  { try { return localStorage.getItem(GATE_KEY) === '1'; } catch (e) { return false; } }
function markOnboarded(email) {
  try { localStorage.setItem(GATE_KEY, '1'); if (email) localStorage.setItem(EMAIL_KEY, email); } catch (e) {}
}
function gateReset() { try { localStorage.removeItem(GATE_KEY); } catch (e) {} }
window.ciGateDone = gateDone;
window.ciGateReset = gateReset;
window.ciMarkOnboarded = markOnboarded;

function AuthGate({ onAuthed }) {
  const m = MOODS.burgundy;
  const saasOn = !!window.CI_SAAS_ON;
  const [mode, setMode] = React.useState('signup'); // signup | signin
  const [name, setName] = React.useState('');
  const [email, setEmail] = React.useState('');
  const [pass, setPass] = React.useState('');
  const [phone, setPhone] = React.useState('');
  const [persona, setPersona] = React.useState('');
  const [platform, setPlatform] = React.useState('');
  const [invite, setInvite] = React.useState('');
  const [msg, setMsg] = React.useState('');
  const [busy, setBusy] = React.useState(false);

  React.useEffect(() => {
    const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && e.target.classList.add('in')), { threshold: 0.1 });
    document.querySelectorAll('.ci-gate .ci-rise').forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);

  async function google() {
    try {
      const sb = await window.ciGetSupabase();
      if (invite.trim()) { try { localStorage.setItem('ci_pending_invite', invite.trim()); } catch (e) {} }
      await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin } });
    } catch (e) { setMsg('Could not start Google sign-in — try email instead.'); }
  }

  async function submit() {
    const em = email.trim();
    if (mode === 'signup' && !name.trim()) { setMsg('Please enter your name.'); return; }
    if (!em || !/.+@.+\..+/.test(em)) { setMsg('Enter a valid email address.'); return; }
    if (saasOn && pass.length < 8) { setMsg('Password must be at least 8 characters.'); return; }
    const meta = { full_name: name.trim(), phone: phone.trim(), persona, platform, invite_code: invite.trim() };
    setBusy(true); setMsg('');
    try {
      if (saasOn && window.ciGetSupabase) {
        const sb = await window.ciGetSupabase();
        if (mode === 'signup') {
          const { error } = await sb.auth.signUp({ email: em, password: pass, options: { data: meta } });
          if (error) throw error;
          setMsg('✓ Account created — check your inbox, click the confirmation link, then sign in.');
          setMode('signin'); setBusy(false); return;
        }
        const { error } = await sb.auth.signInWithPassword({ email: em, password: pass });
        if (error) throw error;
        await window.refreshSession();
      }
      markOnboarded(em); try { localStorage.setItem('ci_user_name', name.trim()); } catch(e){}
      onAuthed();
    } catch (e) {
      setMsg(e.message === 'Email not confirmed' ? 'Confirm your email first — check your inbox (and spam).' : (e.message || 'Something went wrong.'));
      setBusy(false);
    }
  }

  const bullets = [
    ['Script', 'Hook, retention & a stronger rewrite — line by line'],
    ['Thumbnail', 'Will it earn the click? A/B/C compare + redesign prompts'],
    ['Title · Ads · Ask', 'Angles, limits, and straight answers on growth'],
  ];

  return (
    <div className="ci-gate ci-hero-aurora" style={{ minHeight: '100vh', display: 'grid', gridTemplateColumns: '1.05fr 0.95fr', position: 'relative', overflow: 'hidden' }}>

          <div style={{ width: 34, height: 34, borderRadius: 10, background: `linear-gradient(135deg, ${m.accentFrom}, ${m.accentTo})`, display: 'grid', placeItems: 'center', color: '#fff', fontWeight: 800 }}>◈</div>
          <span style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 18 }}>ContentIntel</span>
        </div>
        <h1 className="ci-rise" style={{ fontFamily: "'Instrument Serif', Georgia, serif", fontWeight: 400, fontSize: 62, lineHeight: 1.05, letterSpacing: '-0.02em', margin: 0, color: 'var(--text-1)' }}>
          Know it&rsquo;ll work<br/><span className="ci-grad-text" style={{ fontStyle: 'italic' }}>before you post.</span>
        </h1>
        <p className="ci-rise" style={{ fontSize: 16.5, color: 'var(--text-2)', marginTop: 20, maxWidth: 440, lineHeight: 1.6 }}>
          The pre-publish checker for creators. Grade your script, thumbnail, title and ads the way the algorithm does — fixed before they go live.
        </p>
        <div className="ci-rise" style={{ marginTop: 30, display: 'flex', flexDirection: 'column', gap: 14 }}>
          {bullets.map(([h, d]) => (
            <div key={h} style={{ display: 'flex', gap: 12, alignItems: 'flex-start' }}>
              <span style={{ color: '#8FD86A', fontWeight: 800, marginTop: 1 }}>✓</span>
              <span style={{ fontSize: 14.5, color: 'var(--text-2)' }}><b style={{ color: 'var(--text-1)' }}>{h}</b> — {d}</span>
            </div>
          ))}
        </div>
      </div>

      {/* Right: the auth card */}
      <div style={{ position: 'relative', zIndex: 2, display: 'grid', placeItems: 'center', padding: '40px 48px' }}>
        <div className="ci-block ci-rise" style={{ width: '100%', maxWidth: 380, padding: 30 }}>
          <div style={{ fontFamily: "'Instrument Serif', Georgia, serif", fontSize: 29 }}>{mode === 'signup' ? 'Get started free' : 'Welcome back'}</div>
          <div style={{ fontSize: 13, color: 'var(--text-3)', marginTop: 6, lineHeight: 1.55 }}>
            {mode === 'signup'
              ? (saasOn ? 'Sign up in one click. You\'ll enter your invite code next.' : 'Enter your email to get early access. No card needed.')
              : 'Sign in to pick up where you left off.'}
          </div>
          {saasOn && (
            <>
              <button type="button" onClick={google} style={{ width: '100%', height: 46, marginTop: 18, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10, borderRadius: 12, border: '1px solid var(--stroke-2)', background: 'var(--surface-2)', color: 'var(--text-1)', fontSize: 14.5, fontWeight: 600, cursor: 'pointer' }}>
                <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.6 9.2c0-.6-.05-1.18-.16-1.74H9v3.34h4.84a4.14 4.14 0 01-1.8 2.72v2.26h2.9c1.7-1.57 2.68-3.88 2.68-6.58z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.93v2.33A9 9 0 009 18z"/><path fill="#FBBC05" d="M3.95 10.7a5.4 5.4 0 010-3.4V4.97H.93a9 9 0 000 8.06l3.02-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A9 9 0 00.93 4.97L3.95 7.3C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
                Continue with Google
              </button>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, margin: '14px 0 2px', color: 'var(--text-5)', fontSize: 11.5 }}>
                <span style={{ flex: 1, height: 1, background: 'var(--stroke-1)' }} /> or use email <span style={{ flex: 1, height: 1, background: 'var(--stroke-1)' }} />
              </div>
            </>
          )}
          {mode === 'signup' && (
            <input className="ci-input" style={{ marginTop: 12 }} type="text" placeholder="Your name" value={name}
              onChange={e => setName(e.target.value)} onKeyDown={e => e.key === 'Enter' && submit()} />
          )}
          <input className="ci-input" style={{ marginTop: mode === 'signup' ? 10 : 18 }} type="email" placeholder="you@email.com" value={email}
            onChange={e => setEmail(e.target.value)} onKeyDown={e => e.key === 'Enter' && submit()} />
          {saasOn && (
            <input className="ci-input" style={{ marginTop: 10 }} type="password" placeholder="Password (8+ characters)" value={pass}
              onChange={e => setPass(e.target.value)} onKeyDown={e => e.key === 'Enter' && submit()} />
          )}
          {mode === 'signup' && (
            <>
              <input className="ci-input" style={{ marginTop: 10 }} type="tel" placeholder="Phone / WhatsApp (optional)" value={phone}
                onChange={e => setPhone(e.target.value)} />
              <select className="ci-input" style={{ marginTop: 10, appearance: 'auto' }} value={persona} onChange={e => setPersona(e.target.value)}>
                <option value="">What best describes you?</option>
                <option>Creator / Influencer</option>
                <option>Agency</option>
                <option>Business / Brand</option>
                <option>Marketer</option>
                <option>Just exploring</option>
              </select>
              <select className="ci-input" style={{ marginTop: 10, appearance: 'auto' }} value={platform} onChange={e => setPlatform(e.target.value)}>
                <option value="">Main platform</option>
                <option>Instagram</option>
                <option>YouTube</option>
                <option>Instagram + YouTube</option>
                <option>TikTok</option>
                <option>Other</option>
              </select>
            </>
          )}
          {msg && <div style={{ fontSize: 12.5, marginTop: 12, lineHeight: 1.5, color: msg.startsWith('✓') ? '#8FD86A' : '#f5788c' }}>{msg}</div>}
          <div style={{ marginTop: 16 }}>
            <GlowButton mood="burgundy" size="lg" style={{ width: '100%', justifyContent: 'center' }} onClick={submit}>
              {busy ? 'One moment…' : mode === 'signup' ? (saasOn ? 'Create account →' : 'Get started →') : 'Sign in →'}
            </GlowButton>
          </div>
          <div style={{ fontSize: 12.5, color: 'var(--text-4)', marginTop: 14, textAlign: 'center' }}>
            {mode === 'signup'
              ? <span>Already with us? <a onClick={() => { setMode('signin'); setMsg(''); }} style={{ color: 'var(--text-2)', cursor: 'pointer', textDecoration: 'underline' }}>Sign in</a></span>
              : <span>New here? <a onClick={() => { setMode('signup'); setMsg(''); }} style={{ color: 'var(--text-2)', cursor: 'pointer', textDecoration: 'underline' }}>Create an account</a></span>}
          </div>
          {!saasOn && (
            <div style={{ fontSize: 11, color: 'var(--text-5)', marginTop: 14, textAlign: 'center', lineHeight: 1.5 }}>
              Early access — your email is stored only on this device for now.
            </div>
          )}
          <div style={{ fontSize: 11, color: 'var(--text-5)', marginTop: 14, textAlign: 'center', lineHeight: 1.5 }}>
            By continuing you agree to our <a href="/terms.html" target="_blank" style={{ color: 'var(--text-4)', textDecoration: 'underline' }}>Terms</a> & <a href="/privacy.html" target="_blank" style={{ color: 'var(--text-4)', textDecoration: 'underline' }}>Privacy Policy</a>.
          </div>
        </div>
      </div>
    </div>
  );
}
window.AuthGate = AuthGate;

// Shown AFTER login when the account isn't approved yet: enter an invite code.
function InviteGate({ onApproved }) {
  const m = MOODS.burgundy;
  const [code, setCode] = React.useState('');
  const [msg, setMsg] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const email = (window.CI_USER && window.CI_USER.email) || '';

  async function submit() {
    if (!code.trim()) { setMsg('Enter your invite code.'); return; }
    setBusy(true); setMsg('');
    try {
      await window.ciRedeemInvite(code.trim());
      try { window.ciMarkOnboarded && window.ciMarkOnboarded(email); } catch (e) {}
      onApproved();
    } catch (e) { setMsg(e.message || 'That code is not valid.'); setBusy(false); }
  }
  async function logout() { try { await window.ciSignOut(); } catch (e) {} }

  return (

<script type="text/babel" data-presets="react">

// ContentIntel -- floating feedback widget. Saves to the Supabase `feedback`
// table (see SQL in chat). Shows inside the app for signed-in users.

function FeedbackWidget() {

  const [rating, setRating] = React.useState('');

  async function send() {

        const sb = await window.ciGetSupabase();
        const u = window.CI_USER || {};
        await sb.from('feedback').insert({ user_id: u.id || null, email: u.email || null, rating, message: msg.trim() });
      } else {
        // fallback: open an email draft
        window.open('mailto:vikasbanjare94@gmail.com?subject=ContentIntel%20feedback&body=' + encodeURIComponent((rating ? '['+rating+'] ' : '') + msg.trim()), '_blank');
      }
      setDone(true);
      setTimeout(() => { setOpen(false); setDone(false); setMsg(''); setRating(''); }, 1600);
    } catch (e) {
      setMsg(m => m); // keep text
      alert('Could not send feedback right now — please try again.');

  const RATINGS = [['love', '😍 Love it'], ['ok', '🙂 It’s ok'], ['meh', '😕 Frustrating']];

  return (

          <div className="ci-block" style={{ width: 420, maxWidth: '92vw', padding: 26 }} onClick={e => e.stopPropagation()}>
            {done ? (
              <div style={{ textAlign: 'center', padding: '20px 0' }}>
                <div style={{ fontSize: 34 }}>🙏</div>
                <div style={{ fontSize: 17, fontWeight: 700, marginTop: 8 }}>Thank you!</div>
                <div style={{ fontSize: 13, color: 'var(--text-3)', marginTop: 4 }}>Your feedback shapes what we build next.</div>
              </div>
            ) : (
              <>
                <div style={{ fontFamily: "'Instrument Serif', Georgia, serif", fontSize: 26 }}>Tell us what you think</div>
                <div style={{ fontSize: 13, color: 'var(--text-3)', marginTop: 6, lineHeight: 1.55 }}>What's working? What's missing? What should we build next?</div>
                <div style={{ display: 'flex', gap: 8, marginTop: 16 }}>
                  {RATINGS.map(([k, label]) => (
                    <button key={k} onClick={() => setRating(k)} className="pill"
                      style={{ flex: 1, height: 38, fontSize: 13, border: rating === k ? '1.5px solid var(--ci-accent, #FF4D8D)' : '1px solid var(--stroke-2)',
                        background: rating === k ? 'rgba(255,77,141,0.1)' : 'transparent' }}>{label}</button>
                  ))}
                </div>
                <textarea className="ci-textarea" style={{ minHeight: 110, marginTop: 12 }} value={msg} onChange={e => setMsg(e.target.value)}
                  placeholder="Type your feedback here…" />

}

</script>
<script type="text/babel" data-presets="react">
/* ===== ci-create.jsx ===== */
// ContentIntel -- CREATE: topic in -> scored hooks, a draft script, titles, and
// thumbnail concepts (using your uploaded photo). The "blank page" painkiller.

const { MOODS: CM, Block: CB, RunButton: CRB, WorkHead: CWH, LoadingResults: CLR, ChipGroup: CCG, CopyBlock: CCB } = window;

function buildCreateSystem(hasPhoto) {
  const core = (window.liveResearch && window.liveResearch().core) || '';
  const sc = (window.getResearch && window.getResearch('script')) || {};
  const th = (window.getResearch && window.getResearch('thumbnail')) || {};
  const swipe = (sc.hookSwipeFile || '').split('\n').filter(l => /^\d+\./.test(l.trim())).slice(0, 40).join('\n');
  return [
    "You are ContentIntel's idea engine. Given a TOPIC, generate ready-to-use, research-grounded content ideas for a short-form video. Everything must be specific to the topic -- never generic filler.",
    "LANGUAGE LAW: write everything in the language the user asks for (Hindi -> Hindi, Hinglish -> Hinglish, Spanish -> Spanish, etc.).",
    core ? 'VIRALITY SCIENCE:\n"""\n' + core + '\n"""' : '',
    sc.systemGuidance ? 'HOOK & SCRIPT METHODOLOGY:\n"""\n' + sc.systemGuidance.slice(0, 3200) + '\n"""' : '',
    swipe ? 'PROVEN HOOK FORMULAS (adapt to the topic; fill the blanks with real specifics, never leave placeholders):\n' + swipe : '',
    th.systemGuidance ? 'THUMBNAIL AESTHETIC RULES (the thumbnail prompts MUST follow these -- realistic faces, pro typography, 60-30-10 colour):\n"""\n' + th.systemGuidance.slice(0, 2600) + '\n"""' : '',
    hasPhoto
      ? "A reference PHOTO of the creator is attached. Look at it and DESCRIBE that real person (look, hair, vibe) inside each thumbnail prompt, and add the note: 'attach this same photo when generating so it stays the real person.' Never invent a different face."
      : "No photo is attached. Write thumbnail prompts that work as a complete description, and remind the user they can upload their photo for an accurate likeness.",
    'Return ONLY one valid JSON object (no markdown, no text around it) in EXACTLY this shape:\n'
      + '{ "hooks": [ { "text": "the spoken first line", "type": "Curiosity|Contrarian|Emotional|Specific|Authority|Story", "score": 0-100, "why": "one short reason" } x5 ],'
      + ' "titles": [ "5 title options" ],'
      + ' "script": "a complete ~110-140 word short-form script using the STRONGEST hook, ready to record",'
      + ' "thumbnails": [ { "concept": "1-line idea", "prompt": "full image prompt following the aesthetic rules" } x3 ] }\n'
      + 'Each hook uses a different force and a realistic predicted score. Keep every string tight.',
  ].filter(Boolean).join('\n\n');
}

function readPhoto(file, cb) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const url = reader.result;
    const img = new Image();
    img.onload = () => {
      const MAX = 1024, scale = Math.min(1, MAX / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const out = c.toDataURL('image/jpeg', 0.85);
      cb({ mime: 'image/jpeg', data: out.split(',')[1] || '', preview: out });
    };
    img.onerror = () => cb({ mime: file.type || 'image/png', data: String(url).split(',')[1] || '', preview: url });
    img.src = url;
  };
  reader.readAsDataURL(file);
}

function openHandoff(where, prompt) {
  const text = prompt + '\n\n(Attach your photo here so the thumbnail uses your real face, then press enter.)';
  try { window.copyText && window.copyText(text); } catch (e) {}
  if (where === 'gemini') { window.open('https://gemini.google.com/app', '_blank', 'noopener'); }
  else { window.open('https://chatgpt.com/?q=' + encodeURIComponent(text.slice(0, 6000)), '_blank', 'noopener'); }
}

function CreateTab({ onNav }) {
  const mood = 'burgundy';
  const m = CM[mood];
  const [topic, setTopic] = React.useState('');
  const [niche, setNiche] = React.useState('Education');
  const [platform, setPlatform] = React.useState('Reels');
  const [lang, setLang] = React.useState('Auto');
  const [photo, setPhoto] = React.useState(null);
  const [state, setState] = React.useState('idle');
  const [out, setOut] = React.useState(null);
  const [err, setErr] = React.useState('');
  const fileRef = React.useRef(null);

  async function generate() {
    if (topic.trim().length < 3) return;
    setState('loading'); setErr(''); setOut(null);
    const userText = `Topic: ${topic.trim()}\nNiche: ${niche}\nPlatform: ${platform}\nLanguage: ${lang === 'Auto' ? '(match the topic\'s language)' : lang}\n\nGenerate the ideas now.`;
    try {
      const { text } = await window.callClaude({
        system: buildCreateSystem(!!photo),
        userText,
        images: photo ? [photo] : [],
        maxTokens: 3600,
      });
      const json = window.parseReport(text);
      if (!json || (!json.hooks && !json.script)) throw new Error('Could not parse ideas — try again.');
      // Carry topic + best title to the thumbnail builder ("suggest text" prefills from it).
      try { localStorage.setItem('ci_last_create', JSON.stringify({ topic: topic.trim(), title: (json.titles && json.titles[0]) || '', ts: Date.now() })); } catch (e) {}
      setOut(json); setState('done');
      document.querySelector('.ci-scroll')?.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) {
      setErr(String(e.message) === 'NO_KEY' ? 'Sign in to generate ideas.' : (e.message || 'Something went wrong.'));
      setState('error');
    }
  }

  function refineScript(s) {
    window.__ciPrefillScript = s;
    onNav && onNav('script');
  }
  const scoreColor = v => v >= 75 ? '#8FD86A' : v >= 55 ? '#F0C85A' : '#F06A7E';

  return (
    <div className="ci-work" style={{ '--ci-accent': m.accentFrom, '--ci-glow': m.accentGlow }}>
      <CWH mood={mood} eyebrow="Create" title="Start from just a topic"
        sub="Give us a topic — get scroll-stopping hooks (scored), a ready-to-record script, titles, and thumbnail concepts. Then refine them in one click." />

      <CB mood={mood} style={{ padding: 22 }}>
        <label className="ci-label">What's your video about?</label>
        <textarea className="ci-textarea" style={{ minHeight: 70 }} value={topic} onChange={e => setTopic(e.target.value)}
          placeholder="e.g. How beginners should start investing in SIPs · A day in my life as a baker · Why most reels flop" />
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginTop: 14 }}>
          <CCG label="Niche" options={['Education', 'Entertainment', 'Finance', 'Tech', 'Fitness', 'Food', 'Lifestyle', 'Comedy', 'Other']} value={niche} onChange={setNiche} />
          <CCG label="Platform" options={['Reels', 'TikTok', 'Shorts', 'YouTube']} value={platform} onChange={setPlatform} />
          <CCG label="Language" options={['Auto', 'English', 'Hindi', 'Hinglish', 'Spanish']} value={lang} onChange={setLang} />
        </div>

        <div style={{ marginTop: 16 }}>
          <label className="ci-label">Your photo <span style={{ fontWeight: 400, color: 'var(--text-4)' }}>— optional, but makes the thumbnail use your real face</span></label>
          <input ref={fileRef} type="file" accept="image/*" style={{ display: 'none' }} onChange={e => readPhoto(e.target.files[0], setPhoto)} />
          {photo
            ? <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginTop: 6 }}>
                <img src={photo.preview} alt="you" style={{ width: 56, height: 56, borderRadius: 10, objectFit: 'cover', border: '1px solid var(--stroke-2)' }} />
                <button className="ci-copybtn" style={{ height: 32 }} onClick={() => setPhoto(null)}>Remove</button>
              </div>
            : <button type="button" className="ci-drop" style={{ minHeight: 40, padding: '8px 14px', width: 'auto', border: '1px solid var(--stroke-1)', marginTop: 6 }} onClick={() => fileRef.current && fileRef.current.click()}>
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M8 10.5V3M5 6l3-3 3 3M3 11.5v1a1 1 0 001 1h8a1 1 0 001-1v-1"/></svg>
                Upload your photo
              </button>}
        </div>

        <div style={{ marginTop: 18 }}>
          <CRB mood={mood} onClick={generate} loading={state === 'loading'}>✦ Generate ideas</CRB>
          {topic.trim().length < 3 && <span style={{ fontSize: 12, color: 'var(--text-4)', marginLeft: 12 }}>Enter a topic first.</span>}
        </div>
      </CB>

      {state === 'loading' && <div style={{ marginTop: 14 }}><CLR rows={4} /></div>}
      {state === 'error' && <div className="ci-block" style={{ marginTop: 14, color: 'var(--text-2)' }}>{err}</div>}

      {state === 'done' && out && (
        <div className="ci-results" style={{ marginTop: 16, display: 'flex', flexDirection: 'column', gap: 14 }}>
          {Array.isArray(out.hooks) && out.hooks.length > 0 && (
            <CB title="Hook ideas" desc="Each scored by our virality engine — pick your favourite" mood={mood}>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                {out.hooks.map((h, i) => (
                  <div key={i} style={{ display: 'flex', gap: 12, alignItems: 'flex-start', padding: '12px 0', borderTop: i ? '1px solid var(--stroke-1)' : 'none' }}>
                    <div style={{ textAlign: 'center', flexShrink: 0, width: 40 }}>
                      <div style={{ fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 18, color: scoreColor(h.score || 0) }}>{h.score != null ? Math.round(h.score) : '–'}</div>
                      <div style={{ fontSize: 9, color: 'var(--text-5)', textTransform: 'uppercase', letterSpacing: '.05em' }}>{h.type || ''}</div>
                    </div>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 14.5, color: 'var(--text-1)', lineHeight: 1.5 }}>{h.text}</div>
                      {h.why && <div style={{ fontSize: 12, color: 'var(--text-4)', marginTop: 4 }}>{h.why}</div>}
                    </div>
                    <button className="ci-copybtn" style={{ height: 30, flexShrink: 0 }} onClick={() => window.copyText(h.text)}>⧉</button>
                  </div>
                ))}
              </div>
            </CB>
          )}

          {out.script && (
            <CB title="Draft script" desc="Built from the strongest hook — refine it in the Script checker" mood={mood}>
              <div style={{ fontSize: 14.5, color: 'var(--text-1)', lineHeight: 1.7, whiteSpace: 'pre-wrap' }}>{out.script}</div>
              <div style={{ display: 'flex', gap: 8, marginTop: 14 }}>
                <CRB mood={mood} onClick={() => refineScript(out.script)}>Refine in Script checker →</CRB>
                <button className="ci-copybtn" style={{ height: 44, padding: '0 16px' }} onClick={() => window.copyText(out.script)}>⧉ Copy script</button>
              </div>
            </CB>
          )}

          {Array.isArray(out.titles) && out.titles.length > 0 && (
            <CB title="Title options" mood={mood}>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                {out.titles.map((t, i) => <CCB key={i} text={t} label="Copy" />)}
              </div>
            </CB>
          )}

          {Array.isArray(out.thumbnails) && out.thumbnails.length > 0 && (
            <CB title="Thumbnail concepts" desc={photo ? 'Built around your photo — attach it again when generating' : 'Upload your photo above for an accurate likeness'} mood={mood}>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
                {out.thumbnails.map((t, i) => (
                  <div key={i} style={{ padding: 14, borderRadius: 12, border: '1px solid var(--stroke-1)', background: 'var(--surface-1)' }}>
                    <div style={{ fontSize: 13.5, fontWeight: 600, color: 'var(--text-1)' }}>{t.concept}</div>
                    <div style={{ fontSize: 12.5, color: 'var(--text-3)', marginTop: 6, lineHeight: 1.55 }}>{t.prompt}</div>
                    <div style={{ display: 'flex', gap: 8, marginTop: 10, flexWrap: 'wrap' }}>
                      <button className="ci-copybtn" style={{ height: 32 }} onClick={() => window.copyText(t.prompt)}>⧉ Copy prompt</button>
                      <button className="ci-copybtn" style={{ height: 32 }} onClick={() => openHandoff('chatgpt', t.prompt)}>🎨 ChatGPT</button>
                      <button className="ci-copybtn" style={{ height: 32 }} onClick={() => openHandoff('gemini', t.prompt)}>✨ Gemini</button>
                    </div>
                  </div>
                ))}
              </div>
            </CB>
          )}
        </div>
      )}
    </div>
  );
}
window.CreateTab = CreateTab;
</script>
<script type="text/babel" data-presets="react">
/* ===== ci-profile.jsx ===== */
// ContentIntel — Creator Profile: channel memory & context injection

const CI_PROFILE_KEY = 'ci_creator_profile';

function loadProfile() {
  try {
    const raw = localStorage.getItem(CI_PROFILE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}

function saveProfile(p) {
  try { localStorage.setItem(CI_PROFILE_KEY, JSON.stringify(p)); } catch(e) {}
}

function getProfileContext() {
  const p = loadProfile();
  const parts = [];
  if (p.channel)  parts.push(`creator: ${p.channel}`);
  if (p.niche)    parts.push(`niche: ${p.niche}`);
  if (p.audience) parts.push(`audience: ${p.audience}`);
  if (p.platform) parts.push(`platform: ${p.platform}`);
  if (p.tone)     parts.push(`tone: ${p.tone}`);
  if (!parts.length) return '';
  return `Creator context — ${parts.join(' | ')}. Tailor all analysis, rewrites, and suggestions to this creator's specific niche, audience, and platform.`;
}
window.getProfileContext = getProfileContext;

function ProfileModal({ open, onClose }) {
  const [p, setP] = React.useState(loadProfile);
  const [saved, setSaved] = React.useState(false);

  if (!open) return null;

  function set(k, v) { setP(prev => ({ ...prev, [k]: v })); setSaved(false); }
  function save() { saveProfile(p); setSaved(true); setTimeout(() => onClose(true), 650); }
  function clear() { setP({}); saveProfile({}); setSaved(false); }

  const ctx = (() => {
    const parts = [];
    if (p.channel)  parts.push(`creator: ${p.channel}`);
    if (p.niche)    parts.push(`niche: ${p.niche}`);
    if (p.audience) parts.push(`audience: ${p.audience}`);
    if (p.platform) parts.push(`platform: ${p.platform}`);
    if (p.tone)     parts.push(`tone: ${p.tone}`);
    return parts.length ? parts.join(' · ') : '';
  })();

    <div style={{ position: 'fixed', inset: 0, background: 'rgba(7,9,14,0.82)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 2000, padding: 16 }}

          <div>
            <Eyebrow mood="burgundy" glow>Channel Memory</Eyebrow>
            <h3 style={{ fontFamily: "'Instrument Serif', Georgia, serif", fontWeight: 400, fontSize: 30, margin: '6px 0 0' }}>Creator Profile</h3>
          </div>
          <button className="ci-iconbtn" onClick={() => onClose()} title="Close" style={{ marginTop: 4 }}>
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 3l10 10M13 3L3 13"/></svg>
          </button>
        </div>
        <p style={{ fontSize: 13.5, color: 'var(--text-3)', margin: '10px 0 24px', lineHeight: 1.65 }}>
          Tell ContentIntel about your channel once — every check, rewrite, and caption will automatically tailor its feedback to your niche, audience, and style.
        </p>

        <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          <label style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            <span style={{ fontSize: 11.5, fontWeight: 700, color: 'var(--text-4)', textTransform: 'uppercase', letterSpacing: '.07em' }}>Channel / Creator name</span>
            <input className="ci-input" placeholder="e.g. TechWithVikas" value={p.channel || ''} onChange={e => set('channel', e.target.value)} />

          <label style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            <span style={{ fontSize: 11.5, fontWeight: 700, color: 'var(--text-4)', textTransform: 'uppercase', letterSpacing: '.07em' }}>Niche / Topic</span>
            <input className="ci-input" placeholder="e.g. Personal finance for Indians, AI tutorials, Street food vlogging" value={p.niche || ''} onChange={e => set('niche', e.target.value)} />

          <label style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            <span style={{ fontSize: 11.5, fontWeight: 700, color: 'var(--text-4)', textTransform: 'uppercase', letterSpacing: '.07em' }}>Target audience</span>
            <input className="ci-input" placeholder="e.g. Beginners aged 20–35, Working professionals in India" value={p.audience || ''} onChange={e => set('audience', e.target.value)} />
          </label>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
            <label style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
              <span style={{ fontSize: 11.5, fontWeight: 700, color: 'var(--text-4)', textTransform: 'uppercase', letterSpacing: '.07em' }}>Primary platform</span>
              <select className="ci-input" value={p.platform || ''} onChange={e => set('platform', e.target.value)} style={{ cursor: 'pointer' }}>

// Real-time title CTR score (no CDN needed — pure heuristic scoring)
function scoreTitleCTR(title) {
  const t = (title || '').trim();
  if (t.length < 5) return null;
  let score = 45;
  const factors = [];

  // Character length — ideal 50-70
  const len = t.length;
  if (len >= 50 && len <= 70) { score += 10; factors.push({ key: 'len', label: 'Ideal length', col: '#8FD86A' }); }
  else if (len < 25) { score -= 12; factors.push({ key: 'len', label: 'Too short', col: '#F06A7E' }); }
  else if (len > 100) { score -= 8; factors.push({ key: 'len', label: 'Very long', col: '#F06A7E' }); }

  // Number (numbers boost CTR ~36%)
  if (/\d/.test(t)) { score += 9; factors.push({ key: 'num', label: 'Has number', col: '#8FD86A' }); }

  // Question
  if (/\?/.test(t)) { score += 7; factors.push({ key: 'q', label: 'Question', col: '#8FD86A' }); }

  // Bracket/parens qualifier
  if (/[\[(].{2,}[\])]/.test(t)) { score += 5; factors.push({ key: 'br', label: 'Qualifier []', col: '#8FD86A' }); }

  // Power words
  if (/\b(secret|never|always|stop|best|worst|mistake|truth|real|only|revealed|shocking|surprising|proven|ultimate|simple|instant|free)\b/i.test(t)) {
    score += 8; factors.push({ key: 'pw', label: 'Power word', col: '#F0C85A' });
  }

  // How/Why/What hooks
  if (/^(how|why|what|when)\b/i.test(t)) { score += 6; factors.push({ key: 'hw', label: 'How/Why/What', col: '#8FD86A' }); }

  // Negative framing
  if (/\b(mistake|wrong|fail|worst|stop|never|avoid|don.t)\b/i.test(t)) { score += 5; factors.push({ key: 'neg', label: 'Negative hook', col: '#F0C85A' }); }

  // Year signal
  if (/20\d\d/.test(t)) { score += 3; factors.push({ key: 'yr', label: 'Year', col: '#8FD86A' }); }

  // Weak openers (penalty)
  if (/^(hi |hey |hello |welcome |so |today |in this video |this is )/i.test(t)) {
    score -= 14; factors.push({ key: 'wo', label: 'Weak opener', col: '#F06A7E' });
  }

  // Excessive ALL CAPS (trust penalty)
  const capsCount = t.split(/\s+/).filter(w => w.length > 3 && w === w.toUpperCase() && /[A-Z]/.test(w)).length;
  if (capsCount >= 3) { score -= 8; factors.push({ key: 'caps', label: 'Too many CAPS', col: '#F06A7E' }); }

  // Curiosity / gap framing
  if (/\b(this is why|the reason|nobody|everyone|truth about|don.t know|hidden|before you)\b/i.test(t)) {
    score += 6; factors.push({ key: 'cg', label: 'Curiosity gap', col: '#8FD86A' });
  }

  const final = Math.max(12, Math.min(98, score));
  return { score: final, factors };
}

function TitleCTRBadge({ title }) {
  const result = React.useMemo(() => scoreTitleCTR(title), [title]);
  if (!result) return null;
  const { score, factors } = result;
  const col = score >= 72 ? '#8FD86A' : score >= 50 ? '#F0C85A' : '#F06A7E';
  const label = score >= 72 ? 'Strong CTR' : score >= 50 ? 'Average CTR' : 'Weak CTR';
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 8, flexWrap: 'wrap' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '4px 10px', borderRadius: 999, background: col + '18', border: `1px solid ${col}44` }}>

      </div>
      {factors.map(f => (
        <span key={f.key} style={{ fontSize: 10.5, padding: '3px 7px', borderRadius: 999, background: f.col + '18', color: f.col, fontWeight: 600, border: `1px solid ${f.col}33` }}>{f.label}</span>

}

// Parse SRT string → array of { index, start, end, text }
function parseSRT(srt) {
  const segs = [];
  const blocks = (srt || '').trim().split(/\n\n+/);
  for (const block of blocks) {
    const lines = block.trim().split('\n');
    if (lines.length < 2) continue;
    const tLine = lines.find(l => /\d{2}:\d{2}:\d{2}[,\.]\d{3}\s*-->\s*\d{2}:\d{2}:\d{2}[,\.]\d{3}/.test(l));
    if (!tLine) continue;
    const tm = tLine.match(/(\d{2}:\d{2}:\d{2})[,\.](\d{3})\s*-->\s*(\d{2}:\d{2}:\d{2})[,\.](\d{3})/);
    if (!tm) continue;
    const text = lines.slice(lines.indexOf(tLine) + 1).join(' ').trim();
    if (text) segs.push({ index: segs.length + 1, start: tm[1], end: tm[3], ms_start: tm[2], ms_end: tm[4], text });
  }
  return segs;
}

// Compact "00:00:04" → "0:04", strip leading zeros for readability
function fmtTime(t) {
  const p = (t || '').split(':');
  if (p.length < 3) return t;
  const h = parseInt(p[0], 10), m = parseInt(p[1], 10), s = parseInt(p[2], 10);
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${m}:${String(s).padStart(2,'0')}`;
}

// Lazy-load compromise.js and extract SEO keywords from text
async function loadCompromise() {
  if (window.nlp) return window.nlp;
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/compromise@14.15.1/builds/compromise.js';
    s.onload = () => resolve(window.nlp);
    s.onerror = () => reject(new Error('Could not load NLP library'));
    document.head.appendChild(s);
  });
}

// Optional stopword-filtered single-word tags via keyword-extractor (esm.sh).
let _kwExtractor = null;
async function keywordExtractorTags(text) {
  try {
    if (!_kwExtractor) { const mod = await import('https://esm.sh/keyword-extractor@0.0.28'); _kwExtractor = mod.default || mod; }
    return _kwExtractor.extract(text, { language: 'english', remove_digits: false, return_changed_case: false, remove_duplicates: true }) || [];
  } catch (e) { return []; }
}

async function extractSEOKeywords(text) {
  try {
    const nlp = await loadCompromise();
    const doc = nlp(text);
    // Multi-word noun phrases first — these make the strongest YouTube tags
    // (e.g. "index funds", "compound interest"). Then named topics, then nouns.
    const phrases = doc.match('#Adjective? #Noun+').json().map(p => p.text.trim()).filter(p => p.split(/\s+/).length >= 2 && p.length > 6);
    const topics  = doc.topics().json().map(t => t.text.trim()).filter(Boolean);
    const nouns   = doc.nouns().json().map(n => n.text.trim()).filter(n => n.length > 3);
    let extras = [];
    try { extras = await keywordExtractorTags(text); } catch (e) {}
    const seen = new Set();
    const result = [];
    for (const kw of [...phrases, ...topics, ...nouns, ...extras]) {
      const k = kw.toLowerCase().replace(/[^a-z0-9 ]/g, '').trim();
      if (k.length < 3 || seen.has(k)) continue;
      seen.add(k); result.push(kw.trim());
      if (result.length >= 14) break;
    }
    return result;
  } catch (e) { return []; }
}

// Language detection via franc-min (ESM, lazy import). Returns a friendly name.
const ISO6393_NAMES = {
  eng: 'English', spa: 'Spanish', fra: 'French', deu: 'German', ita: 'Italian',
  por: 'Portuguese', nld: 'Dutch', rus: 'Russian', jpn: 'Japanese', kor: 'Korean',
  cmn: 'Chinese', arb: 'Arabic', hin: 'Hindi', ben: 'Bengali', urd: 'Urdu',
  pan: 'Punjabi', tam: 'Tamil', tel: 'Telugu', mar: 'Marathi', guj: 'Gujarati',
  tur: 'Turkish', vie: 'Vietnamese', ind: 'Indonesian', tha: 'Thai', pol: 'Polish',
  ukr: 'Ukrainian', ron: 'Romanian', ell: 'Greek', heb: 'Hebrew', fas: 'Persian',
  swe: 'Swedish', ces: 'Czech', hun: 'Hungarian', fin: 'Finnish', dan: 'Danish',
};
let _francMod = null;
async function detectLanguage(text) {
  const t = (text || '').trim();
  if (t.length < 20) return null;
  try {
    if (!_francMod) _francMod = await import('https://esm.sh/franc-min@6?bundle');
    const code = _francMod.franc(t, { minLength: 18 });
    if (!code || code === 'und') return null;
    return { code, name: ISO6393_NAMES[code] || code.toUpperCase() };
  } catch (e) { return null; }
}

// Flesch readability — pure JS, no CDN (counts syllables/words/sentences).
function countSyllables(word) {
  word = word.toLowerCase().replace(/[^a-z]/g, '');
  if (word.length <= 3) return word ? 1 : 0;
  word = word.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/, '').replace(/^y/, '');
  const m = word.match(/[aeiouy]{1,2}/g);
  return m ? m.length : 1;
}
function fleschReadability(text) {
  const t = (text || '').trim();
  if (t.length < 30) return null;
  const sentences = (t.match(/[.!?]+(?:\s|$)/g) || []).length || 1;
  const words = t.split(/\s+/).filter(Boolean);
  if (words.length < 8) return null;
  const syllables = words.reduce((a, w) => a + countSyllables(w), 0);
  const wps = words.length / sentences, spw = syllables / words.length;
  const ease = Math.max(0, Math.min(100, Math.round(206.835 - 1.015 * wps - 84.6 * spw)));
  const grade = Math.max(1, Math.round(0.39 * wps + 11.8 * spw - 15.59));
  let band, col;
  if (ease >= 70) { band = 'Easy to read'; col = '#8FD86A'; }
  else if (ease >= 50) { band = 'Fairly readable'; col = '#F0C85A'; }
  else { band = 'Hard to read'; col = '#F06A7E'; }
  return { ease, grade, band, col };
}

// Extract YouTube video ID from URLs or bare IDs
function extractYTVideoId(s) {
  s = (s || '').trim();
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  const m = s.match(/(?:[?&]v=|youtu\.be\/|shorts\/|embed\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}

// Parse YouTube timedtext XML (auto-generated or manual CC) into SRT string
function parseYTTimedText(xml) {
  const re = /<text[^>]*start="([\d.]+)"[^>]*dur="([\d.]+)"[^>]*>([\s\S]*?)<\/text>/g;
  const segs = [];
  let m;
  while ((m = re.exec(xml)) !== null) {
    const start = parseFloat(m[1]);
    const end   = start + parseFloat(m[2]);
    const text  = m[3].replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
                       .replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/<[^>]+>/g,'').trim();
    if (text) segs.push({ i: segs.length + 1, start, end, text });
  }
  if (!segs.length) return '';
  function ts(s) {
    const h=Math.floor(s/3600), mm=Math.floor((s%3600)/60), ss=Math.floor(s%60), ms=Math.round((s%1)*1000);
    return `${String(h).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')},${String(ms).padStart(3,'0')}`;
  }
  return segs.map(s => `${s.i}\n${ts(s.start)} --> ${ts(s.end)}\n${s.text}`).join('\n\n');
}

// Fetch YouTube captions via allorigins.win CORS proxy (no API key).
// Tries 'en', then 'en-US', then auto-generated 'a.en'.
async function fetchYTCaptions(videoId) {
  for (const lang of ['en', 'en-US', 'a.en']) {
    const ytUrl = `https://www.youtube.com/api/timedtext?lang=${lang}&v=${videoId}`;
    try {
      const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(ytUrl)}`, { signal: AbortSignal.timeout ? AbortSignal.timeout(9000) : undefined });
      if (!res.ok) continue;
      const xml = await res.text();
      if (!xml || !xml.includes('<text')) continue;
      const srt = parseYTTimedText(xml);
      if (srt && srt.length > 50) return srt;
    } catch (e) { continue; }
  }
  throw new Error('No English captions found for this video. It may not have subtitles, or they may be disabled.');
}

function CaptionTab({ onOpenKey }) {

      setYtFetchErr(e.message || 'Could not fetch captions.');
      setYtFetchState('error');
    }
  }

  function generate() {
    if (!title.trim()) return;
    const profileCtx = typeof window.getProfileContext === 'function' ? window.getProfileContext() : '';
    const system = CAPTION_SYSTEM + (profileCtx ? '\n\nCreator context (personalise accordingly):\n' + profileCtx : '');
    const platList = plats.length ? plats.map(id => PLATFORMS.find(p => p.id === id)?.label).filter(Boolean).join(', ') : 'YouTube, Instagram, TikTok';
    run({
      system,
      userText: [
        `Video title: ${title.trim()}`,
        desc.trim() ? `Content summary / key points: ${desc.trim()}` : '',
        transcript.trim() ? `Video transcript / script:\n\n${transcript.trim()}` : '',
        `Generate captions for: ${platList}`,
        'Add a Hashtags section with platform-specific tag sets.',
      ].filter(Boolean).join('\n\n'),
      maxTokens: 2800,
    });
  }

  const transcriptWords = transcript.trim() ? transcript.trim().split(/\s+/).length : 0;

  return (
    <div className="ci-work" style={{ '--ci-accent': m.accentFrom, '--ci-glow': m.accentGlow }}>

            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <span style={{ fontSize: 11.5, fontWeight: 700, color: 'var(--text-4)', textTransform: 'uppercase', letterSpacing: '.07em' }}>Video title *</span>
              {title.trim() && (
                <span style={{ fontSize: 11, padding: '2px 7px', borderRadius: 999, background: 'var(--surface-2)',
                  color: title.length > 100 ? '#F06A7E' : title.length > 70 ? '#F0C85A' : '#8FD86A',
                  fontFamily: 'var(--font-mono)', fontWeight: 600 }}>{title.length}/100 chars</span>
              )}
            </div>
            <input className="ci-input" style={{ fontSize: 15 }}
              placeholder="e.g. I invested ₹50,000 in index funds for 1 year — here's what happened"

              style={{ resize: 'vertical', lineHeight: 1.55 }} />

              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 2 }}>

              </div>

          </label>

          {/* Transcript toggle */}

                {showTranscript ? '▲' : '▼'}

                disabled={ytFetchState === 'fetching' || !ytUrl.trim()}
                style={{ height: 40, padding: '0 14px', borderRadius: 8, border: `1.5px solid ${m.accentFrom}`,
                  background: m.accentFrom + '18', color: m.accentFrom, fontSize: 13, fontWeight: 700,
                  cursor: (ytFetchState === 'fetching' || !ytUrl.trim()) ? 'not-allowed' : 'pointer',
                  opacity: (ytFetchState === 'fetching' || !ytUrl.trim()) ? 0.65 : 1 }}>
                {ytFetchState === 'fetching' ? (
                  <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                    <span style={{ display: 'inline-block', width: 11, height: 11, border: '2px solid currentColor', borderRightColor: 'transparent', borderRadius: '50%', animation: 'spin 0.8s linear infinite' }} />
                    Fetching…
                  </span>
                ) : 'Fetch captions →'}
              </button>
              {ytFetchState === 'done' && <span style={{ fontSize: 12, color: '#8FD86A', fontWeight: 600 }}>✓ Captions loaded</span>}
            </div>
            {ytFetchState === 'error' && ytFetchErr && (
              <div style={{ marginTop: 8, fontSize: 12.5, color: '#F06A7E', lineHeight: 1.5 }}>{ytFetchErr}</div>
            )}
          </div>

          <div>
            <span style={{ fontSize: 11.5, fontWeight: 700, color: 'var(--text-4)', textTransform: 'uppercase', letterSpacing: '.07em' }}>Platforms</span>
            <div style={{ display: 'flex', gap: 8, marginTop: 9, flexWrap: 'wrap' }}>
              {PLATFORMS.map(pl => {
                const on = plats.includes(pl.id);
                return (
                  <button key={pl.id} onClick={() => toggle(pl.id)}
                    style={{ height: 32, padding: '0 14px', borderRadius: 999,
                      border: `1.5px solid ${on ? pl.col : 'var(--stroke-2)'}`,
                      background: on ? pl.col + '18' : 'transparent',
                      color: on ? pl.col : 'var(--text-3)',
                      fontSize: 12.5, fontWeight: 600, cursor: 'pointer', transition: 'all 0.15s' }}>
                    {pl.label}
                  </button>
                );
              })}
            </div>
          </div>
        </div>

        {(keywords.length > 0 || kwLoading) && (
          <div style={{ marginTop: 18, paddingTop: 16, borderTop: '1px solid var(--stroke-1)' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8, flexWrap: 'wrap' }}>
              <span style={{ fontSize: 11, fontWeight: 700, color: 'var(--text-4)', textTransform: 'uppercase', letterSpacing: '.07em' }}>SEO Keywords</span>
              {kwLoading && <span style={{ display: 'inline-block', width: 10, height: 10, border: '1.5px solid var(--text-4)', borderRightColor: 'transparent', borderRadius: '50%', animation: 'spin 0.8s linear infinite' }} />}
              {lang && <span style={{ fontSize: 10.5, padding: '3px 8px', borderRadius: 999, background: 'var(--surface-2)', color: 'var(--text-3)', fontWeight: 600 }}>🌐 {lang.name}</span>}
            </div>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
              {keywords.map((kw, i) => (
                <button key={i} onClick={() => {
                  window.copyText ? window.copyText(kw) : navigator.clipboard.writeText(kw).catch(() => {});
                  setKwCopied(i); setTimeout(() => setKwCopied(c => c === i ? null : c), 1200);
                }}
                  style={{ height: 28, padding: '0 10px', borderRadius: 999,
                    border: `1px solid ${m.accentFrom}33`, background: kwCopied === i ? m.accentFrom + '25' : m.accentFrom + '10',
                    color: kwCopied === i ? m.accentFrom : 'var(--text-2)',
                    fontSize: 12, fontWeight: 600, cursor: 'pointer', transition: 'all 0.15s' }}>
                  {kwCopied === i ? '✓ ' : ''}{kw}
                </button>
              ))}
            </div>
            <div style={{ marginTop: 6, fontSize: 11, color: 'var(--text-5)' }}>Click any keyword to copy • Use these in your tags and description</div>
          </div>
        )}

        <div style={{ marginTop: 20 }}>
          <AnalyzeButton mood={mood} label="Generate captions" loading={loading}
            estIn={estIn} estOut={2200} onClick={generate}
            disabled={!title.trim()} disabledHint="Enter a video title first" />
          {title.trim() && <div style={{ marginTop: 6, fontSize: 11, color: 'var(--text-5)', textAlign: 'center' }}>Ctrl+Enter to generate</div>}
        </div>
      </div>

      {state === 'error' && <window.ErrorCard msg={err} onOpenKey={onOpenKey} />}

      {state === 'done' && report && (
        <div style={{ marginTop: 24 }}>
          <ReportView report={report} mood={mood} />
          {usage && <UsageBadge usage={usage} />}
        </div>
      )}
    </div>
  );
}
window.CaptionTab = CaptionTab;
</script>

<script type="text/babel" data-presets="react">

// ContentIntel — Content Repurposer

const REPURPOSE_SYSTEM = [
  "You are ContentIntel's content strategist. Repurpose video content into platform-optimised written formats without losing the creator's voice, facts, or personality.",
  "LANGUAGE LAW: match the language of the submitted content.",
  "Format rules:",
  "• Blog post: 400–600 words, SEO H2 headers, conversational but authoritative, ends with a CTA to watch the video.",
  "• Twitter/X thread: 8–10 tweets, each under 280 chars, numbered 1/N, scroll-stopping hook in tweet 1, value bomb or CTA in the last tweet.",
  "• Email newsletter: subject line + preview text on the first line, then 300-word body split into 2–3 short paragraphs, end with one CTA button text in [brackets].",
  "• LinkedIn article: insight-led opening (no 'I'm excited to share'), 3 short punchy paragraphs, concrete takeaway, 3–5 hashtags at the end.",
  "• YouTube Community post: 2–3 sentences, casual, ends with a question to spark replies.",
  "Rules: preserve the creator's specific examples and numbers. No filler or padding. Each format must stand alone.",
  "Output only the submit_report tool. Use sections of type 'copy' — one per requested format.",
  "Set verdict.level='green', verdict.title='Content Repurposed', verdict.text=one sentence on the formats generated.",
  "Add 3 scores: Voice Consistency (how well it matches the original) / Platform Optimisation / Engagement Potential — each 0-100.",
  "Set bottomLine to the single format most likely to bring new viewers to the original video.",
].join("\n");

function RepurposeTab({ onOpenKey }) {
  const mood = 'ember';
  const m = MOODS[mood] || MOODS.burgundy;
  const [content, setContent] = React.useState('');
  const [formats, setFormats] = React.useState(['blog', 'twitter', 'email']);

  const { state, report, usage, err, run, reset } = useAnalysis('repurpose');
  const loading = state === 'loading';
  const estIn = estTokens(REPURPOSE_SYSTEM, content);

  const FORMATS = [
    { id: 'blog',      label: 'Blog post',            col: '#F0C85A' },
    { id: 'twitter',   label: 'Twitter/X thread',     col: '#1D9BF0' },
    { id: 'email',     label: 'Email newsletter',      col: '#8FD86A' },
    { id: 'linkedin',  label: 'LinkedIn article',      col: '#0A66C2' },
    { id: 'community', label: 'Community post',        col: '#FF0000' },
  ];

  function toggle(id) {
    setFormats(prev => prev.includes(id) ? prev.filter(f => f !== id) : [...prev, id]);
    reset();
  }

  function generate() {
    if (!content.trim() || !formats.length) return;
    const profileCtx = typeof window.getProfileContext === 'function' ? window.getProfileContext() : '';
    const fmtLabels = formats.map(id => FORMATS.find(f => f.id === id)?.label).filter(Boolean).join(', ');
    run({

        <div style={{ marginTop: 20 }}>
          <AnalyzeButton mood={mood} label="Repurpose content" loading={loading}
            estIn={estIn} estOut={2800} onClick={generate}
            disabled={!content.trim() || !formats.length}
            disabledHint={!content.trim() ? 'Paste your content first' : 'Select at least one format'} />
        </div>
      </div>

      {state === 'error' && <window.ErrorCard msg={err} onOpenKey={onOpenKey} />}

        <div style={{ marginTop: 24 }}>
          <ReportView report={report} mood={mood} />

  "Comment types and approach:",

  "Output only the submit_report tool. Use sections of type 'copy' — one per comment. Title each section with a truncated version of the comment. One block per section with label 'Reply'.",
  "Set verdict.level='green', verdict.title='Replies Ready', verdict.text=one sentence summary (e.g. 'X replies generated, Y skipped').",

].join("\n");

// Browser sentiment via wink-sentiment (AFINN + emoji + negation), lazy ESM import.
let _winkSent = null;
async function scoreSentimentBatch(texts) {
  if (!texts.length) return null;
  try {
    if (!_winkSent) {
      const mod = await import('https://esm.sh/wink-sentiment@5.0.2');
      _winkSent = mod.default || mod;
    }
    let pos = 0, neu = 0, neg = 0, sum = 0;
    for (const t of texts) {
      const r = _winkSent(t || '');
      const n = typeof r.normalizedScore === 'number' ? r.normalizedScore : 0;
      sum += n;
      if (n > 0.6) pos++; else if (n < -0.6) neg++; else neu++;
    }
    const total = texts.length;
    return {
      total, pos, neu, neg,
      posPct: Math.round((pos / total) * 100),
      neuPct: Math.round((neu / total) * 100),
      negPct: Math.round((neg / total) * 100),
      avg: sum / total,
    };
  } catch (e) { return null; }
}

        {data.posPct > 0 && <div style={{ width: data.posPct + '%', background: '#8FD86A' }} />}
        {data.neuPct > 0 && <div style={{ width: data.neuPct + '%', background: '#F0C85A' }} />}

}

// GitHub-style posting calendar heatmap (ECharts, lazy CDN). Colors each day by
// total views of videos published that day — reveals cadence and best days.
function PostingCalendar({ videos, mood }) {
  const ref = React.useRef(null);
  const chartRef = React.useRef(null);
  const m = MOODS[mood] || MOODS.lime;
  React.useEffect(() => {
    if (!videos || videos.length < 2) return;
    let disposed = false;
    (async () => {
      try {
        await window.loadScriptOnce('https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js', 'echarts');
        if (disposed || !ref.current || !window.echarts) return;
        const byDay = {}; let maxV = 1;
        for (const v of videos) {
          const d = new Date(v.published);
          if (isNaN(d.getTime())) continue;
          const ymd = d.toISOString().slice(0, 10);
          byDay[ymd] = (byDay[ymd] || 0) + (parseInt(v.viewCount || '0', 10) || 0);
          if (byDay[ymd] > maxV) maxV = byDay[ymd];
        }
        const data = Object.entries(byDay).map(([d, val]) => [d, val]);
        if (data.length < 2) return;
        const dates = data.map(d => d[0]).sort();
        const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
        const chart = window.echarts.init(ref.current, null, { renderer: 'canvas' });
        chartRef.current = chart;
        chart.setOption({
          tooltip: { formatter: p => `${p.value[0]}<br/>${Number(p.value[1]).toLocaleString()} views` },
          visualMap: { min: 0, max: maxV, type: 'continuous', orient: 'horizontal', left: 'center', bottom: 0,
            inRange: { color: [isDark ? '#1c2a1c' : '#e8f5e0', m.accentFrom] }, textStyle: { color: isDark ? '#888' : '#555', fontSize: 10 } },
          calendar: { top: 24, left: 32, right: 12, cellSize: ['auto', 15], range: [dates[0], dates[dates.length - 1]],
            itemStyle: { color: isDark ? '#15151a' : '#fafafa', borderColor: isDark ? '#26262e' : '#eee', borderWidth: 1 },
            splitLine: { lineStyle: { color: isDark ? '#333' : '#ddd' } },
            dayLabel: { color: isDark ? '#888' : '#666', fontSize: 10 }, monthLabel: { color: isDark ? '#aaa' : '#444', fontSize: 10 }, yearLabel: { show: false } },
          series: { type: 'heatmap', coordinateSystem: 'calendar', data },
        });
        const onResize = () => chart.resize();
        window.addEventListener('resize', onResize);
        chart._onResize = onResize;
      } catch (e) {}
    })();
    return () => {
      disposed = true;
      if (chartRef.current) { if (chartRef.current._onResize) window.removeEventListener('resize', chartRef.current._onResize); try { chartRef.current.dispose(); } catch (e) {} chartRef.current = null; }
    };
  }, [videos]);
  if (!videos || videos.length < 2) return null;
  return (
    <div style={{ marginTop: 14 }}>
      <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--text-4)', textTransform: 'uppercase', letterSpacing: '.06em', marginBottom: 6 }}>Posting Calendar — views by day</div>
      <div ref={ref} style={{ width: '100%', height: 170 }} />
    </div>
  );
}

function AuditTab({ onOpenKey }) {
  const mood = 'lime';

  const ytKey = window.getYouTubeKey ? window.getYouTubeKey() : '';

  async function fetchChannel() {
    if (!handle.trim()) return;

      setFetchErr(e.message || 'Could not fetch channel data.');

  const titleCount = titles.trim() ? titles.trim().split('\n').filter(l => l.trim()).length : 0;

  function generate() {
    if (!titles.trim() && !videoData.length) return;
    const profileCtx = typeof window.getProfileContext === 'function' ? window.getProfileContext() : '';

    run({
      system: AUDIT_SYSTEM + (profileCtx ? '\n\nCreator context:\n' + profileCtx : ''),

          : (handle.trim() ? `Channel: ${handle.trim()}` : ''),
        about.trim() ? `Niche / About: ${about.trim()}` : '',
        videoText,
      ].filter(Boolean).join('\n\n'),
      maxTokens: 5500,
    });
  }

  function fmt(n) { const v = parseInt(n || 0); return v >= 1e6 ? (v/1e6).toFixed(1)+'M' : v >= 1000 ? (v/1000).toFixed(0)+'K' : String(v); }

  return (

        <h2 className="ci-h2">Full Channel Health Check</h2>
        <p className="ci-sub" style={{ marginTop: 6 }}>

      </div>

      <div className="ci-block" style={{ padding: 24, marginTop: 24 }}>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>

              <button className="ci-copybtn" style={{ height: 28, padding: '0 10px', fontSize: 12, marginLeft: 8 }} onClick={onOpenKey}>Open Settings</button>
            </div>
          )}
          <label style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            <span style={{ fontSize: 11.5, fontWeight: 700, color: 'var(--text-4)', textTransform: 'uppercase', letterSpacing: '.07em' }}>YouTube channel handle *</span>
            <div style={{ display: 'flex', gap: 8 }}>
              <input className="ci-input" placeholder="@YourChannel or youtube.com/@YourChannel"
                value={handle} onChange={e => { setHandle(e.target.value); setFetchState('idle'); setChannelInfo(null); setTitles(''); reset(); }}
                onKeyDown={e => { if (e.key === 'Enter' && ytKey) fetchChannel(); }}
                style={{ flex: 1 }} />
              <GlowButton mood={mood} onClick={fetchChannel}
                style={{ whiteSpace: 'nowrap', opacity: (!handle.trim() || !ytKey || fetchState === 'fetching') ? 0.5 : 1 }}>
                {fetchState === 'fetching' ? (
                  <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                    <span style={{ display: 'inline-block', width: 12, height: 12, border: '2px solid currentColor', borderRightColor: 'transparent', borderRadius: '50%', animation: 'spin 0.8s linear infinite' }} />

                  </span>
                ) : 'Fetch channel →'}
              </GlowButton>
            </div>
          </label>
          {fetchState === 'error' && (
            <div style={{ padding: '10px 14px', borderRadius: 8, background: 'rgba(240,90,110,0.08)', border: '1px solid rgba(240,90,110,0.25)', fontSize: 13, color: '#F06A7E' }}>{fetchErr}</div>
          )}
          {fetchState === 'fetched' && channelInfo && (
            <div style={{ borderRadius: 12, background: 'rgba(143,216,106,0.06)', border: '1px solid rgba(143,216,106,0.2)', padding: '14px 16px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: metrics ? 12 : 0 }}>
                <span style={{ fontSize: 22 }}>✓</span>
                <div>
                  <div style={{ fontSize: 15, fontWeight: 700, color: 'var(--text-1)' }}>{channelInfo.name}</div>
                  <div style={{ fontSize: 12.5, color: 'var(--text-3)', marginTop: 2 }}>
                    {fmt(channelInfo.subs)} subscribers · {fmt(channelInfo.views)} total views · {fmt(channelInfo.videoCount)} videos

                </div>
              </div>
              {metrics && (
                <>
                  <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 10 }}>
                    {[
                      { label: 'Avg views', val: fmt(metrics.avgViews) },
                      { label: 'Engagement', val: metrics.avgEngRate + '%' },
                      { label: 'Posts/month', val: metrics.postsPerMonth !== null ? `~${metrics.postsPerMonth}` : 'N/A' },
                      { label: 'Avg length', val: metrics.avgDurSecs ? `${Math.floor(metrics.avgDurSecs/60)}m` : 'N/A' },
                    ].map(s => (
                      <div key={s.label} style={{ flex: '1 0 70px', padding: '7px 10px', borderRadius: 8, background: 'var(--surface-2)', textAlign: 'center' }}>
                        <div style={{ fontSize: 15, fontWeight: 800, color: '#8FD86A' }}>{s.val}</div>
                        <div style={{ fontSize: 10, color: 'var(--text-4)', textTransform: 'uppercase', letterSpacing: '.05em', marginTop: 1 }}>{s.label}</div>
                      </div>
                    ))}
                  </div>
                  <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                    {metrics.postsPerWeek !== null && <span style={{ fontSize: 12, color: 'var(--text-3)', padding: '3px 8px', borderRadius: 999, background: 'var(--surface-2)' }}>~{metrics.postsPerWeek}/week · top day: {metrics.topDay}</span>}
                    {metrics.shorts > 0 && <span style={{ fontSize: 12, color: '#5CD9A0', padding: '3px 8px', borderRadius: 999, background: 'var(--surface-2)' }}>Shorts: {metrics.shorts}</span>}
                    {metrics.longs > 0 && <span style={{ fontSize: 12, color: '#F0C85A', padding: '3px 8px', borderRadius: 999, background: 'var(--surface-2)' }}>Long-form: {metrics.longs}</span>}
                  </div>
                  <PostingCalendar videos={videoData} mood={mood} />
                </>
              )}
            </div>
          )}
        </div>

        <div style={{ marginTop: 20 }}>
          <AnalyzeButton mood={mood} label="Audit channel" loading={loading}
            estIn={estTokens(AUDIT_SYSTEM, titles, about)} estOut={2200} onClick={generate}
            disabled={fetchState !== 'fetched'}
            disabledHint="Fetch a channel first" />
        </div>
      </div>

      {state === 'error' && <window.ErrorCard msg={err} onOpenKey={onOpenKey} />}
      {state === 'done' && report && (
        <div style={{ marginTop: 24 }}>
          <ReportView report={report} mood={mood} />
          {usage && <UsageBadge usage={usage} />}
          <div style={{ marginTop: 20, display: 'flex', justifyContent: 'center' }}>
            <button
              onClick={() => {
                const tip = report?.bottomLine || '';
                const channel = channelInfo?.name || handle.trim();
                // Seed the Script tab's create mode with the audit's recommended video.
                // ScriptTab reads window.__ciScriptTopic on mount (same pattern as Builder→Script).
                if (tip) window.__ciScriptTopic = channel ? `${tip}\n\n(From audit of ${channel})` : tip;
                if (window.__CI_NAV__) window.__CI_NAV__('script');
              }}
              style={{ height: 44, padding: '0 24px', borderRadius: 10, border: `1.5px solid ${m.accentFrom}`,
                background: m.accentFrom + '15', color: m.accentFrom, fontSize: 13.5, fontWeight: 700,
                cursor: 'pointer', letterSpacing: '.01em', transition: 'all 0.15s' }}
              onMouseEnter={e => { e.currentTarget.style.background = m.accentFrom + '25'; }}
              onMouseLeave={e => { e.currentTarget.style.background = m.accentFrom + '15'; }}>
              → Plan Scripts from This Audit
            </button>
          </div>
        </div>
      )}
    </div>
  );
}
window.AuditTab = AuditTab;

<script type="text/babel" data-presets="react">

const COMPETITOR_SYSTEM = `You are ContentIntel's competitive intelligence analyst. Use ONLY real numbers from the data — never invent metrics.
LANGUAGE LAW: reply in the same language as the channel titles.

Each competitor block includes: Subscribers, Avg views, Engagement rate, Posts/month, Top day, Format split, and per-video data: Title | Views | Likes | Comments | Engagement% | Duration | Age.

Call submit_report with these 5 sections. Field names are EXACT — do not rename them.

── SECTION 1 ── type "kv" title "Channel Stats at a Glance"
