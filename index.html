// Opt-in local AI CTR predictor (WebLLM / MLC AI). Runs a small model fully in
// the browser via WebGPU. Heavy (~400MB) so it is strictly gated behind an
// explicit "Load model" click — it never downloads on its own.
function LocalCTRPredictor({ title, mood }) {
  const m = TM[mood] || TM.cyan;
  const [open, setOpen] = React.useState(false);
  const [status, setStatus] = React.useState('idle'); // idle|loading|ready|predicting|error
  const [progress, setProgress] = React.useState('');
  const [result, setResult] = React.useState(null);
  const [err, setErr] = React.useState('');
  const engineRef = React.useRef(null);
  const MODEL = 'Qwen2.5-0.5B-Instruct-q4f32_1-MLC';
  const hasGPU = typeof navigator !== 'undefined' && !!navigator.gpu;

  async function loadModel() {
    if (!hasGPU) { setErr('This needs WebGPU — use desktop Chrome or Edge.'); setStatus('error'); return; }
    setStatus('loading'); setErr(''); setProgress('Starting…');
    try {
      const webllm = await import('https://esm.run/@mlc-ai/web-llm');
      engineRef.current = await webllm.CreateMLCEngine(MODEL, { initProgressCallback: p => setProgress(p.text || '') });
      setStatus('ready');
    } catch (e) { setErr(e.message || 'Could not load the local model.'); setStatus('error'); }
  }

  async function predict() {
    if (!engineRef.current || !title.trim()) return;
    setStatus('predicting'); setResult(null); setErr('');
    try {
      const reply = await engineRef.current.chat.completions.create({
        messages: [
          { role: 'system', content: 'You are a YouTube CTR expert. Given a video title, output ONLY a JSON object {"score": <integer 0-100>, "reason": "<max 12 words>"}. Score = predicted click-through appeal.' },
          { role: 'user', content: 'Title: ' + title.trim() },
        ],
        temperature: 0.3, max_tokens: 80,
      });
      const txt = (reply.choices && reply.choices[0] && reply.choices[0].message.content) || '';
      const mj = txt.match(/\{[\s\S]*\}/);
      let parsed = null; if (mj) { try { parsed = JSON.parse(mj[0]); } catch (e) {} }
      if (parsed && parsed.score != null) setResult({ score: Math.max(0, Math.min(100, Math.round(parsed.score))), reason: parsed.reason || '' });
      else setResult({ score: null, reason: txt.slice(0, 120) });
      setStatus('ready');
    } catch (e) { setErr(e.message || 'Prediction failed.'); setStatus('error'); }
  }

  return (
    <div style={{ marginTop: 14, border: '1px solid var(--stroke-1)', borderRadius: 12, overflow: 'hidden' }}>
      <button onClick={() => setOpen(o => !o)}
        style={{ width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8, padding: '12px 14px', background: 'var(--surface-2)', border: 'none', cursor: 'pointer', color: 'var(--text-2)', fontSize: 13, fontWeight: 600 }}>
        <span>🧠 Local AI CTR Predictor <span style={{ fontWeight: 400, color: 'var(--text-5)' }}>· runs offline in your browser, no API key</span></span>
        <span style={{ color: 'var(--text-5)' }}>{open ? '▲' : '▼'}</span>
      </button>
      {open && (
        <div style={{ padding: 14 }}>
          {status === 'idle' && (
            <div>
              <p style={{ fontSize: 12.5, color: 'var(--text-3)', lineHeight: 1.5, margin: '0 0 10px' }}>
                Downloads a small AI model (~400&nbsp;MB) <b>once</b> into your browser, then scores titles fully offline — nothing leaves your device. Needs desktop Chrome/Edge (WebGPU).
              </p>
              <button onClick={loadModel} disabled={!hasGPU}
                style={{ height: 38, padding: '0 16px', borderRadius: 8, border: `1.5px solid ${m.accentFrom}`, background: m.accentFrom + '18', color: m.accentFrom, fontSize: 13, fontWeight: 700, cursor: hasGPU ? 'pointer' : 'not-allowed', opacity: hasGPU ? 1 : 0.5 }}>
                {hasGPU ? 'Load model (~400 MB, one time)' : 'WebGPU not available in this browser'}
              </button>
            </div>
          )}
          {status === 'loading' && (
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, fontSize: 12.5, color: 'var(--text-3)' }}>
              <span style={{ display: 'inline-block', width: 13, height: 13, border: '2px solid currentColor', borderRightColor: 'transparent', borderRadius: '50%', animation: 'spin 0.8s linear infinite' }} />
              <span style={{ flex: 1 }}>{progress || 'Loading model…'}</span>
            </div>
          )}
          {(status === 'ready' || status === 'predicting') && (
            <div>
              <button onClick={predict} disabled={status === 'predicting' || !title.trim()}
                style={{ height: 38, padding: '0 16px', borderRadius: 8, border: `1.5px solid ${m.accentFrom}`, background: m.accentFrom + '18', color: m.accentFrom, fontSize: 13, fontWeight: 700, cursor: (status === 'predicting' || !title.trim()) ? 'not-allowed' : 'pointer', opacity: (status === 'predicting' || !title.trim()) ? 0.6 : 1 }}>
                {status === 'predicting' ? 'Predicting…' : '⚡ Predict CTR for this title'}
              </button>
              {result && (
                <div style={{ marginTop: 12, display: 'flex', alignItems: 'center', gap: 12 }}>
                  {result.score != null && (
                    <div style={{ fontFamily: 'var(--font-mono)', fontWeight: 800, fontSize: 26, color: result.score >= 70 ? '#8FD86A' : result.score >= 45 ? '#F0C85A' : '#F06A7E' }}>{result.score}</div>
                  )}
                  <div style={{ fontSize: 12.5, color: 'var(--text-2)', lineHeight: 1.45 }}>{result.reason}</div>
                </div>
              )}
            </div>
          )}
          {status === 'error' && <div style={{ fontSize: 12.5, color: '#F06A7E', lineHeight: 1.5 }}>{err} <button className="ci-copybtn" style={{ height: 24, padding: '0 8px', fontSize: 11, marginLeft: 6 }} onClick={() => { setStatus('idle'); setErr(''); }}>Retry</button></div>}
        </div>
      )}
    </div>
  );
}

function timeAgo(t) {
  const s = Math.max(1, Math.floor((Date.now() - t) / 1000));
  if (s < 60) return s + 's ago';
  const mn = Math.floor(s / 60); if (mn < 60) return mn + 'm ago';
  const h = Math.floor(mn / 60); if (h < 24) return h + 'h ago';
  const d = Math.floor(h / 24); return d === 1 ? 'Yesterday' : d + 'd ago';
}

function analyzeImageQuality(previewUrl) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        const scale = Math.min(1, 200 / Math.max(img.width, img.height));
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const { data } = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const pixels = data.length / 4;
        let sumL = 0, sumS = 0, minL = 255, maxL = 0;
        const lumas = [];
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i + 1], b = data[i + 2];
          const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
          const l = (mx + mn) / 2;
          const s = mx === mn ? 0 : (l < 128 ? (mx - mn) / (mx + mn) : (mx - mn) / (510 - mx - mn));
          lumas.push(l);
          sumL += l; sumS += s;
          if (l < minL) minL = l;
          if (l > maxL) maxL = l;
        }
        const avgL = sumL / pixels;
        const avgS = sumS / pixels;
        const variance = lumas.reduce((acc, l) => acc + (l - avgL) ** 2, 0) / pixels;
        const stdDev = Math.sqrt(variance);
        const brightness = Math.round(avgL / 255 * 100);
        const contrast = Math.round(Math.min(stdDev / 80, 1) * 100);
        const saturation = Math.round(Math.min(avgS * 2, 1) * 100);
        const range = Math.round((maxL - minL) / 255 * 100);
        const brightScore = brightness >= 30 && brightness <= 80 ? 'green' : brightness < 20 || brightness > 90 ? 'red' : 'yellow';
        const contrastScore = contrast >= 45 ? 'green' : contrast >= 25 ? 'yellow' : 'red';
        const satScore = saturation >= 30 ? 'green' : saturation >= 15 ? 'yellow' : 'red';
        res({ brightness, contrast, saturation, range, brightScore, contrastScore, satScore });
      } catch (e) { rej(e); }
    };
    img.onerror = rej;
    img.src = previewUrl;
  });
}

// Face detection via @vladmandic/face-api (TinyFaceDetector). Faces are a major
// thumbnail-CTR lever, so we count them and measure how much frame the biggest fills.
let _faceModelReady = false;
async function detectThumbnailFaces(previewUrl) {
  const FACEAPI = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js';
  const MODELS  = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model';
  if (window.loadScriptOnce) await window.loadScriptOnce(FACEAPI, 'faceapi');
  if (!window.faceapi) throw new Error('face engine unavailable');
  if (!_faceModelReady) {
    await window.faceapi.nets.tinyFaceDetector.loadFromUri(MODELS);
    _faceModelReady = true;
  }
  const img = await new Promise((res, rej) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => res(i); i.onerror = rej; i.src = previewUrl; });
  const dets = await window.faceapi.detectAllFaces(img, new window.faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.4 }));
  const frame = img.width * img.height || 1;
  let largestPct = 0;
  for (const d of dets) {
    const b = d.box; const pct = (b.width * b.height) / frame * 100;
    if (pct > largestPct) largestPct = pct;
  }
  largestPct = Math.round(largestPct);
  const count = dets.length;
  let score, advice;
  if (count === 0) { score = 'yellow'; advice = 'No face detected — thumbnails with a clear, emotive face usually lift CTR. Consider adding one.'; }
  else if (count === 1 && largestPct >= 12) { score = 'green'; advice = `One strong face filling ~${largestPct}% of the frame — ideal for CTR.`; }
  else if (count === 1) { score = 'yellow'; advice = `Face is small (~${largestPct}% of frame) — crop tighter so the expression reads on mobile.`; }
  else { score = largestPct >= 12 ? 'green' : 'yellow'; advice = `${count} faces detected — make sure one is the clear focal point so it isn't cluttered.`; }
  return { count, largestPct, score, advice };
}

async function extractColorPalette(previewUrl) {
  if (!window.ColorThief) {
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.2/color-thief.umd.js';
      s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
  }
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      try {
        const ct = new window.ColorThief();
        const palette = ct.getPalette(img, 8);
        res(palette.map(([r, g, b]) => ({
          rgb: `rgb(${r},${g},${b})`,
          hex: '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join(''),
        })));
      } catch (e) { rej(e); }
    };
    img.onerror = rej;
    img.src = previewUrl;
  });
}

    analyzeImageQuality(analyseImg.preview).then(setImageQuality).catch(() => setImageQuality(null));
    setFaceState('detecting'); setFaceInfo(null);
    detectThumbnailFaces(analyseImg.preview)
      .then(r => { setFaceInfo(r); setFaceState('done'); })
      .catch(() => setFaceState('error'));
  }, [analyseImg]);

  const [extraNote, setExtraNote] = React.useState(bootFresh && bootCreate.brief ? ('Scene context from the script: ' + bootCreate.brief) : '');
  const [brand] = React.useState(bLoadBrand);
  const brandColors = (brand.colors || []).filter(Boolean);
  const hasBrand = brandColors.length > 0 || !!brand.note;

  const [prompt, setPrompt] = React.useState('');
  const [built, setBuilt] = React.useState(false);
  const [building, setBuilding] = React.useState(false);
  const [groundingFailed, setGroundingFailed] = React.useState(false);
  const [copyFeedback, setCopyFeedback] = React.useState('');
  const [autoDescState, setAutoDescState] = React.useState({});

  // AI thumbnail-text suggestions. Prefills the topic from the last Create result
  // (the "carry the script's topic into the thumbnail" thread) -- but the field is
  // free-type too, so it works whether or not you came from a generated script.
  const lastCreate = bootCreate; // same object, aliased for clarity
  const [txtTopic, setTxtTopic] = React.useState(bootFresh ? (bootCreate.title || bootCreate.topic || '') : '');
  const [txtState, setTxtState] = React.useState('idle');
  const [txtOpts, setTxtOpts] = React.useState([]);
  const [txtErr, setTxtErr] = React.useState('');

  async function suggestText() {
    const t = txtTopic.trim();
    if (t.length < 3) { setTxtState('needinput'); return; }
    setTxtState('loading'); setTxtErr(''); setTxtOpts([]);
    try {
      const sys = [
        'You suggest the TEXT that goes ON a video thumbnail -- the big overlay words -- for a given video topic or title.',
        'RULES: the "headline" is 2-5 BIG words max, legible at 120px; optionally a 2-4 word "sub". Make each punchy and click-earning via curiosity, a number, contrast, or stakes. NEVER a full sentence, never generic. Each of the 5 options must take a DIFFERENT angle. Write in the SAME language as the topic.',
        'Return ONLY one JSON object: { "options": [ { "headline": "BIG WORDS", "sub": "optional short sub or empty", "why": "one short reason it earns the click" } x5 ] }',
      ].join('\n\n');
      const { text } = await window.callClaude({ system: sys, userText: `Video topic/title: ${t}\n\nSuggest the thumbnail text now.`, maxTokens: 900 });
      const j = window.parseReport(text);
      const opts = (j && Array.isArray(j.options) ? j.options : []).filter(o => o && o.headline).slice(0, 5);
      if (!opts.length) throw new Error('no options');
      setTxtOpts(opts); setTxtState('done');
    } catch (e) {
      setTxtErr(String(e.message) === 'NO_KEY' ? 'Sign in (or add an API key) to suggest text.' : 'Could not suggest text -- try again.');
      setTxtState('error');
    }
  }
  function useSuggestion(o) { setHeadline((o.headline || '').trim()); setSubline((o.sub || '').trim()); }

  const hasKey = !!(window.getKey && window.getKey());
  const canCloud = !!(window.canRun && window.canRun()); // own key OR free Claude cloud

  // Research-grounded system prompt for the cloud check (NOT the report shape).
  function thumbSystem() {
    const r = (window.getResearch && window.getResearch('thumbnail')) || {};
    const st = (window.getResearch && window.getResearch('studio')) || {};
    const core = (window.liveResearch && window.liveResearch().core) || '';
    return [
      'You are a world-class YouTube thumbnail strategist. You judge thumbnails purely by what earns the click, grounded in the research below. Be specific and blunt -- no generic advice.',
      core ? 'RESEARCH PRINCIPLES:\n' + core : '',
      r.systemGuidance ? 'THUMBNAIL METHODOLOGY:\n' + r.systemGuidance : '',
      st.systemGuidance ? 'IMAGE-PROMPT QUALITY SCIENCE (every upgrade prompt MUST follow these rules):\n' + st.systemGuidance : '',
      'You will get a thumbnail as an image if one is attached, otherwise as a text description. Analyse it and return ONLY a single valid JSON object (no markdown, no text around it) in EXACTLY this shape:',
      '{ "whatsWrong": ["specific problem tied to a real click-through principle", "... up to 6"], "upgrades": [ { "tier": "Basic polish (keep the photo)", "prompt": "..." }, { "tier": "Mild redesign (same person & text, new design)", "prompt": "..." }, { "tier": "Full reimagining (change everything)", "prompt": "..." } ], "headline": "exact main text or empty", "subline": "secondary text or empty", "people": [{ "desc": "appearance", "expression": "excited|shocked|serious|pointing|laughing|love|none" }], "elements": ["only from: ' + BUILDER_ELEMENTS.join(', ') + '"] }',
      TIER_SPEC,
      'Every prompt must be concrete and DETAILED about composition, subject, colour, contrast and text size/placement. Never invent text, people or brands not present. Write in the same language as the thumbnail content.',
    ].filter(Boolean).join('\n\n');
  }

  // Wipe everything from a previous analysis so a new upload starts clean.
  function clearForm() {
    setHeadline(''); setSubline(''); setPeople([]); setElements([]);
    setFeedback([]); setUpgrades([]); setPrompt(''); setBuilt(false);
    setAnalyseSummary(''); setAnalyseDesc(''); setColorPalette([]); setImageQuality(null);
  }

  // Cloud check: works free inside Claude (text description) OR with an API key
  // (image vision). Finds what's wrong per the research and writes the fixed prompt.
  async function cloudCheck() {
    if (!canCloud) { setAnalyseState('nokey'); return; }
    if (!analyseImg && !analyseDesc.trim()) { setAnalyseState('needinput'); return; }
    setAnalyseState('loading'); setFeedback([]); setAnalyseSummary('');
    try {
      const userText = (analyseDesc.trim()
        ? 'Thumbnail description from the creator:\n' + analyseDesc.trim()
        : 'Analyse the attached thumbnail image.')
        + (headline.trim() ? '\nKnown headline text: "' + headline.trim() + '"' : '')
        + '\n\nReturn the JSON now.';
      // Only send the image to the vision model when the user has their own key;
      // the free Claude cloud is text-only, so it reads the description instead.
      const images = (hasKey && analyseImg) ? [analyseImg] : [];
      const { text } = await window.callClaude({ system: thumbSystem(), userText, images, maxTokens: 1600 });
      const parsed = JSON.parse((String(text).match(/\{[\s\S]*\}/) || ['null'])[0]);
      if (!parsed) { setAnalyseState('error'); return; }
      // Replace fields unconditionally so a new thumbnail fully overwrites the
      // last one (empty values clear the old text instead of leaving it behind).
      setHeadline(parsed.headline || '');
      setSubline(parsed.subline || '');
      setPeople(Array.isArray(parsed.people) ? parsed.people.slice(0, 10).map(p => ({
        photo: null,
        expression: BUILDER_EXPRESSIONS.find(e => e.id === p.expression) ? p.expression : 'none',
        desc: p.desc || '',
      })) : []);
      setElements(Array.isArray(parsed.elements) ? parsed.elements.filter(e => BUILDER_ELEMENTS.includes(e)) : []);
      setFeedback(Array.isArray(parsed.whatsWrong) ? parsed.whatsWrong.filter(Boolean).slice(0, 6) : []);
      // Three tiers (basic / mild / full). Fall back to a single improvedPrompt if present.
      let ups = Array.isArray(parsed.upgrades) ? parsed.upgrades.filter(u => u && u.prompt).slice(0, 3) : [];
      if (!ups.length && parsed.improvedPrompt) ups = [{ tier: 'Improved version', prompt: String(parsed.improvedPrompt) }];
      setUpgrades(ups);
      if (ups.length) { setPrompt(ups[0].prompt); setBuilt(true); }
      setAnalyseSummary(hasKey && analyseImg ? 'Checked your image with the research.' : 'Checked your description with the research (free cloud).');
      setAnalyseState('done');
      setTimeout(() => document.getElementById('builder-output')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 140);
    } catch (e) {
      setAnalyseState(String(e && e.message) === 'NO_KEY' ? 'nokey' : 'error');
    }
  }

  async function analyzeRef() {
    if (!refImg) return;
    setRefState('loading');
    try {
      const { text: raw } = await window.callClaude({
        system: 'Extract visual design properties from this thumbnail image. Return ONLY a JSON object, no markdown.',
        userText: 'Analyse this thumbnail. Return JSON: { "layout": "...", "colors": "...", "textStyle": "...", "mood": "...", "keyElements": "..." }',
        image: refImg,
        maxTokens: 350,
        temperature: 0.2,
      });
      let parsed = null;
      try { parsed = JSON.parse((raw || '').match(/\{[\s\S]*\}/)?.[0] || 'null'); } catch (pe) {}
      if (parsed && typeof parsed === 'object') {
        setRefAnalysis(Object.entries(parsed).map(([k, v]) => `${k}: ${v}`).join('\n'));
      } else {
        // Model returned prose instead of JSON — use it verbatim as style notes.
        const prose = (raw || '').trim().slice(0, 500);
        if (prose) setRefAnalysis(prose);
      }
      setRefState('done');
    } catch (e) {
      if (String(e?.message) === 'NO_KEY') setRefState('idle');
      else setRefState('error');
    }
  }

  function buildPrompt() {
    const lines = [];
    lines.push(`Create a thumbnail image (${currentRatio.label} aspect ratio, ${currentRatio.w}x${currentRatio.h}px).`);
    lines.push('');
    if (people.length > 0) {
      lines.push(`PEOPLE: ${people.length} person${people.length > 1 ? 's' : ''}.`);
      people.forEach((p, i) => {
        const ex = BUILDER_EXPRESSIONS.find(e => e.id === p.expression);
        const exText = ex && ex.id !== 'none' ? `expression: ${ex.label}` : 'natural expression';
        lines.push(`- Person ${i + 1}${p.photo ? ` (see photo ${i + 1})` : ''} -- ${exText}${p.desc.trim() ? `, looks like: ${p.desc.trim()}` : ''}.`);
      });
      lines.push('');
    }
    if (headline.trim() || subline.trim()) {
      lines.push('TEXT ON THUMBNAIL:');
      if (headline.trim()) lines.push(`- Main headline: "${headline.trim()}" -- large, bold, dominant.`);
      if (subline.trim()) lines.push(`- Sub-text: "${subline.trim()}" -- smaller, secondary.`);
      lines.push('');
    }
    if (elements.length > 0) { lines.push(`VISUAL ELEMENTS: ${elements.join('. ')}.`); lines.push(''); }
    // Colour is only added when the user actually set brand colours (or notes).
    // No auto-filled/random palette -- that caused unwanted, off-brand colours.
    if (hasBrand && (refOverride || !refImg)) {
      const colorRoles = brandColors.map((c, i) => {
        const role = i === 0 ? 'Primary/background' : i === 1 ? 'Accent/text' : i === 2 ? 'Secondary accent' : 'Highlight';
        return `${role}: ${c}`;
      });
      const cp = [colorRoles.length ? `MANDATORY palette -- ${colorRoles.join('; ')}.` : '', brand.note ? `Brand notes: ${brand.note}.` : ''].filter(Boolean).join(' ');
      lines.push(`COLOUR (use these exact colours): ${cp} Do not substitute or ignore these.`); lines.push('');
    }
    if (refImg) {
      if (refAnalysis) {
        const al = refOverride && hasBrand ? refAnalysis.split('\n').filter(l => !l.startsWith('colors')).join('\n') : refAnalysis;
        lines.push('STYLE REFERENCE (match this image visual DNA):'); lines.push(al);
        if (refOverride && hasBrand) lines.push('Apply brand colours above instead of reference colours.');
      } else {
        lines.push(`STYLE: Match layout and energy of the attached reference image.${refOverride && hasBrand ? ' Use brand colours above instead.' : ''}`);
      }
      lines.push('');
    }
    if (extraNote.trim()) { lines.push(`ADDITIONAL DIRECTION: ${extraNote.trim()}`); lines.push(''); }
    lines.push('Make it bold, high-contrast, impossible to ignore at small thumbnail size. Professional photography and design quality.');
    const brief = lines.join('\n');
    // Route the brief through Claude (art director) so the prompt actually applies
    // the researched layouts/colour-schemes/principles. Fall back to the raw brief.
    // setBuilt(true) is intentionally in .finally() so the output section only
    // reveals after grounding completes — not mid-request with the raw prompt.
    if (window.canRun && window.canRun() && window.groundThumbPrompt) {
      setPrompt(brief); setBuilding(true);
      window.groundThumbPrompt(brief, { ratio: currentRatio })
        .then(g => { setPrompt((g && g.length > 40) ? g : brief); })
        .catch(() => { setPrompt(brief); setGroundingFailed(true); })
        .finally(() => { setBuilding(false); setBuilt(true); setTimeout(() => document.getElementById('builder-output')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 80); });
    } else {
      setPrompt(brief);
      setBuilt(true);
      setTimeout(() => document.getElementById('builder-output')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 80);
    }
  }

  function openIn(tool) {
    // Route through the shared handoffs (ChatGPT pre-fills via URL; Gemini copies
    // synchronously so the paste actually works).
    if (tool.id === 'chatgpt' && window.openInChatGPT) return window.openInChatGPT(prompt);
    if (tool.id === 'gemini' && window.openInGemini) return window.openInGemini(prompt);
    try { window.copyText && window.copyText(prompt); } catch (e) {}
    if (tool.useQ) window.open(tool.url + '?q=' + encodeURIComponent(prompt.slice(0, 6000)), '_blank', 'noopener,noreferrer');
    else window.open(tool.url, '_blank', 'noopener,noreferrer');
  }

  async function copyPhoto(person, idx) {
    if (!person.photo) return;
    try { await bCopyImageToClipboard(person.photo.preview, person.photo.mime); setCopyFeedback('ok-' + idx); }
    catch (e) { setCopyFeedback('fail-' + idx); }
    setTimeout(() => setCopyFeedback(''), 2200);
  }

  async function copyRefImgFn() {
    try { await bCopyImageToClipboard(refImg.preview, refImg.mime); setCopyFeedback('ref-ok'); }
    catch (e) { setCopyFeedback('ref-fail'); }
    setTimeout(() => setCopyFeedback(''), 2200);
  }

  const photoPeople = people.filter(p => p.photo);

  return (
    <div className="ci-work" style={{ '--ci-accent': m.accentFrom, '--ci-glow': m.accentGlow }}>
      <BWH mood={mood} eyebrow="Prompt Studio" title="Build your thumbnail prompt"
        sub="Check your current thumbnail free (it tells you what's wrong and writes the fix), or build one from scratch -- then send it to ChatGPT or Gemini." />

      {/* CLOUD CHECK -- free, no API key */}
      <BB mood={mood} title="Check & fix my thumbnail" desc="Runs free inside Claude -- no API key. Describe your current thumbnail (or upload it if you have an API key for image vision). It finds what's wrong using the research and writes the fixed prompt below.">
        {analyseImg && (
          <div style={{ marginBottom: 12 }}>
            <div style={{ display: 'flex', gap: 12, alignItems: 'center' }}>
              <img src={analyseImg.preview} alt="" style={{ width: 120, borderRadius: 9, border: '1px solid var(--stroke-1)', flexShrink: 0 }} />
              <div>
                <button className="ci-copybtn" style={{ height: 30, fontSize: 11.5 }}
                  onClick={() => { setAnalyseImg(null); clearForm(); setAnalyseState('idle'); }}>Remove image</button>
                {colorPalette.length > 0 && (
                  <div style={{ marginTop: 10 }}>
                    <div style={{ fontSize: 10, fontWeight: 700, color: 'var(--text-4)', textTransform: 'uppercase', letterSpacing: '.06em', marginBottom: 5 }}>Color palette</div>
                    <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap' }}>
                      {colorPalette.map((c, i) => (
                        <div key={i} title={`${c.hex} — click to copy`}
                          style={{ width: 24, height: 24, borderRadius: 6, background: c.rgb, border: '1px solid rgba(255,255,255,0.12)', cursor: 'pointer', flexShrink: 0, transition: 'transform .1s' }}
                          onClick={() => window.copyText && window.copyText(c.hex)}
                          onMouseEnter={e => e.currentTarget.style.transform = 'scale(1.15)'}
                          onMouseLeave={e => e.currentTarget.style.transform = ''} />
                      ))}
                    </div>
                    <div style={{ fontSize: 10, color: 'var(--text-5)', marginTop: 4 }}>Click a swatch to copy its hex</div>
                  </div>
                )}
                {imageQuality && (
                  <div style={{ marginTop: 10 }}>
                    <div style={{ fontSize: 10, fontWeight: 700, color: 'var(--text-4)', textTransform: 'uppercase', letterSpacing: '.06em', marginBottom: 5 }}>Visual quality</div>
                    <div style={{ display: 'flex', gap: 5, flexWrap: 'wrap' }}>
                      {[
                        { label: 'Brightness', val: imageQuality.brightness + '%', lvl: imageQuality.brightScore },
                        { label: 'Contrast', val: imageQuality.contrast + '%', lvl: imageQuality.contrastScore },
                        { label: 'Saturation', val: imageQuality.saturation + '%', lvl: imageQuality.satScore },
                      ].map(q => {
                        const col = q.lvl === 'green' ? '#8FD86A' : q.lvl === 'yellow' ? '#F0C85A' : '#F06A7E';
                        return (
                          <div key={q.label} style={{ padding: '4px 8px', borderRadius: 7, background: col + '18', border: `1px solid ${col}33`, textAlign: 'center' }}>
                            <div style={{ fontSize: 12, fontWeight: 800, color: col }}>{q.val}</div>
                            <div style={{ fontSize: 9, color: 'var(--text-4)', textTransform: 'uppercase', letterSpacing: '.04em' }}>{q.label}</div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
                {(faceState === 'detecting' || faceInfo) && (
                  <div style={{ marginTop: 10 }}>
                    <div style={{ fontSize: 10, fontWeight: 700, color: 'var(--text-4)', textTransform: 'uppercase', letterSpacing: '.06em', marginBottom: 5 }}>Face detection</div>
                    {faceState === 'detecting' && (
                      <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 11.5, color: 'var(--text-4)' }}>
                        <span style={{ display: 'inline-block', width: 11, height: 11, border: '2px solid currentColor', borderRightColor: 'transparent', borderRadius: '50%', animation: 'spin 0.8s linear infinite' }} />
                        Scanning for faces…
                      </div>
                    )}
                    {faceInfo && (() => {
                      const col = faceInfo.score === 'green' ? '#8FD86A' : faceInfo.score === 'yellow' ? '#F0C85A' : '#F06A7E';
                      return (
                        <div style={{ padding: '7px 10px', borderRadius: 8, background: col + '15', border: `1px solid ${col}33` }}>
                          <div style={{ fontSize: 12, fontWeight: 800, color: col }}>
                            {faceInfo.count === 0 ? 'No face' : `${faceInfo.count} face${faceInfo.count > 1 ? 's' : ''}`}{faceInfo.count > 0 ? ` · biggest fills ~${faceInfo.largestPct}%` : ''}
                          </div>
                          <div style={{ fontSize: 11, color: 'var(--text-3)', lineHeight: 1.45, marginTop: 3 }}>{faceInfo.advice}</div>
                        </div>
                      );
                    })()}
                  </div>
                )}
              </div>
            </div>
          </div>
        )}
        {!analyseImg && (
          <label className="ci-drop" style={{ minHeight: 72, flexDirection: 'row', gap: 8, cursor: 'pointer', padding: 12, marginBottom: 10 }}>
            <input type="file" accept="image/*" style={{ display: 'none' }}
              onChange={e => e.target.files[0] && bReadImage(e.target.files[0], img => { clearForm(); setAnalyseState('idle'); setAnalyseImg(img); })} />
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.4"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M3 16l5-5 4 4 3-3 6 6"/></svg>
            <span style={{ fontSize: 12.5 }}>Upload your thumbnail <span style={{ color: 'var(--text-5)' }}>(optional -- only read with an API key)</span></span>
          </label>
        )}
        <label className="ci-label">Describe your current thumbnail</label>
        <textarea className="ci-textarea" style={{ minHeight: 80 }} value={analyseDesc} onChange={e => setAnalyseDesc(e.target.value)}
          placeholder="e.g. My face on the right looking normal, big white text 'NEW PHONE' on a grey background, phone in my hand on the left." />
        <div style={{ display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap', marginTop: 12 }}>
          <window.GlowButton mood={mood} onClick={cloudCheck} style={{ opacity: analyseState === 'loading' ? 0.65 : 1 }}>
            {analyseState === 'loading' ? 'Checking...' : analyseState === 'done' ? 'Check again' : (hasKey && analyseImg ? 'Check my image (free)' : 'Check & fix it (free)')}
          </window.GlowButton>
          {analyseState === 'loading' && <span style={{ fontSize: 12, color: 'var(--text-4)' }}>Reading the research...</span>}
          {analyseState === 'done' && <span style={{ fontSize: 12, color: '#8FD86A' }}>{analyseSummary}</span>}
          {analyseState === 'error' && <span style={{ fontSize: 12, color: '#f5788c' }}>Couldn't read the result -- try again.</span>}
          {analyseState === 'needinput' && <span style={{ fontSize: 12, color: '#F0C85A' }}>Describe or upload your thumbnail first.</span>}
        </div>
        {analyseState === 'nokey' && (
          <div style={{ fontSize: 12.5, color: 'var(--text-3)', marginTop: 10, padding: '10px 12px', borderRadius: 9, background: 'rgba(240,200,90,0.08)', border: '1px solid rgba(240,200,90,0.2)', lineHeight: 1.5 }}>

                  <span>{f}</span>
                </div>
              ))}
            </div>
            <div style={{ fontSize: 12, color: 'var(--text-4)', marginTop: 10 }}>The fixed prompt is ready below -- send it to ChatGPT or Gemini.</div>
          </div>
        )}
      </BB>

      {/* ASPECT RATIO */}
      <BB mood={mood}>
        <div style={{ fontSize: 11.5, fontWeight: 700, color: 'var(--text-4)', textTransform: 'uppercase', letterSpacing: '0.07em', marginBottom: 10 }}>Aspect ratio</div>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>

              style={{ height: 36, padding: '0 18px', fontFamily: 'var(--font-mono)', fontSize: 13.5, fontWeight: 700,

        <div style={{ marginTop: 7, fontSize: 11.5, color: 'var(--text-5)' }}>{currentRatio.w} x {currentRatio.h} px</div>

      {/* PEOPLE */}
      <BB mood={mood} title="People" desc="Add up to 10 subjects. Describe appearance -- it goes into the prompt. Upload a photo only to paste manually into ChatGPT.">
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {people.map((p, i) => (
            <div key={i} style={{ display: 'flex', gap: 10, alignItems: 'flex-start', padding: '10px 12px', borderRadius: 10, background: 'var(--inset)', border: '1px solid var(--stroke-1)' }}>
              <div style={{ flexShrink: 0 }}>
                {p.photo ? (
                  <div style={{ position: 'relative', width: 58 }}>
                    <img src={p.photo.preview} alt="" style={{ width: 58, height: 58, objectFit: 'cover', borderRadius: 8, display: 'block', border: '1px solid var(--stroke-1)' }} />
                    <button onClick={() => clearPersonPhoto(i)}
                      style={{ position: 'absolute', top: -5, right: -5, width: 16, height: 16, borderRadius: '50%', border: 'none', background: 'var(--inset)', color: '#fff', fontSize: 8, cursor: 'pointer', lineHeight: '16px', textAlign: 'center', padding: 0 }}>x</button>
                  </div>
                ) : (

<script type="text/babel" data-presets="react">
/* ===== ci-playbook.jsx ===== */
// ContentIntel — Thumbnail Playbook (public page).
// Renders the thumbnail research library (design principles, layout archetypes,
// colour schemes, per-niche proven patterns, example regen prompts, A/B tests)
// as a browsable, on-brand guide. Data comes from research.js, so it stays in
// sync with whatever the owner trains.

// Map a colour-scheme name to a representative CSS swatch.
function schemeSwatch(name) {
  const M = {
    'Sky-blue growth': 'linear-gradient(135deg,#7cc6ff,#1e6fd6)',
    'Navy grid + growth graph': 'linear-gradient(135deg,#0b1f3a,#1f9d6b)',
    'Stock-chart green/red': 'linear-gradient(135deg,#19c37d,#e23b3b)',
    'Brand-matched': 'conic-gradient(from 210deg,#ff5e3a,#ffd400,#19c37d,#2bd2ff,#7b61ff,#ff5e3a)',
    'High-contrast complementary': 'linear-gradient(135deg,#ff7a3c,#1fb6c9)',
    'Bold saturated primary': 'linear-gradient(135deg,#ff3b30,#ffd400 55%,#2b6cff)',
    'Dark + neon accent': 'linear-gradient(135deg,#0a0a12,#39ff14)',
    'Bright + white space': 'linear-gradient(135deg,#ffffff,#dfe7f5)',
    'Warm dramatic': 'linear-gradient(135deg,#ff5e3a,#b3001b)',
    'Cool / tech': 'linear-gradient(135deg,#2bd2ff,#1455c4)',
    'Monochrome + single accent': 'linear-gradient(135deg,#2a2a2a,#9aa0a6 70%,#ff3b30)',
    'Dark premium / photographic': 'linear-gradient(135deg,#0c0f16,#3a4356)',
  };
  return M[name] || 'linear-gradient(135deg,#3a3f4a,#8a93a6)';
}

// Split provenPatterns (one string, blocks separated by blank lines) into
// { title, body } cards. First line = heading.
function splitPlaybook(text) {
  return String(text || '').split(/\n\s*\n/).map(b => b.trim()).filter(Boolean).map(block => {
    const nl = block.indexOf('\n');
    return nl === -1 ? { title: block, body: '' } : { title: block.slice(0, nl).trim(), body: block.slice(nl + 1).trim() };
  });
}

const PLAYBOOK_REGEN_EXAMPLES = [
  {
    label: 'Business case-study',
    text: "Improve THIS thumbnail: keep the founder photo, cut them out cleanly on the right third with rim light, smiling at camera. Background: the company's real storefront on a bright sky-blue sky with a faint upward green growth line. Bottom-left, two lines: '₹900 Crore' in big serif-italic white + 'Cloud Kitchen Factory' in bold sans. Draw a hand-drawn curved white arrow from the number to the founder. Add a small black '100K+ VIEWS' pill top-right. Keep the real brand logo as a tilted badge near the subject.",
  },
  {
    label: 'Personal-finance interview',
    text: "Improve THIS thumbnail: expert guest cut out on the left, host on the right, podcast mics in front, dark navy background with a faint market chart. Centre-top: 'You Only Need This' in white, then '1 FUND!' in a yellow highlight pill (black text), then 'To Retire Early'. Add a small 'HOW?' reaction box beside the host and a curved arrow. Keep both real faces and the real claim.",
  },
  {
    label: 'On-brand (your colours)',
    text: "Improve THIS thumbnail using my brand colours #0A2540 (background) and #FFE14D (highlight). Keep the subject and topic. Put the key number in a #FFE14D rounded box with black text; use #0A2540 for the backdrop with a subtle grid; white body text with a soft shadow; add my logo bottom-right. Maintain strong contrast and a single clear focal point.",
  },
];

// Schematic wireframe of a layout archetype — shows where the subject, text,
// arrow, chart etc. sit. Pure SVG so it stays in the single-file app.
function LayoutDiagram({ name }) {
  const A = '#FF6B4A', A2 = '#FFB07A', TX = '#454b5a', HL = '#cfd5e2', BG = '#0f131b';
  const n = (name || '').toLowerCase();
  const W = 320, H = 180;
  const face = (x, y, w, h) => (<g><rect x={x} y={y + h * 0.44} width={w} height={h * 0.56} rx={6} fill={A} opacity="0.85" /><circle cx={x + w / 2} cy={y + h * 0.32} r={h * 0.26} fill={A2} /></g>);
  const bars = (x, y, w, arr) => arr.map((bw, i) => <rect key={i} x={x} y={y + i * 13} width={w * bw} height={i === 0 ? 10 : 6} rx={3} fill={i === 0 ? HL : TX} />);
  const arrow = (d) => <path d={d} fill="none" stroke="#fff" strokeWidth="3" strokeLinecap="round" markerEnd="url(#ah)" />;
  const chart = (c) => <polyline points="20,150 65,122 105,134 150,92 200,108 250,64 300,84" fill="none" stroke={c || A} strokeWidth="3" strokeLinejoin="round" />;
  const panel = (x, w, c) => <rect x={x} y={18} width={w} height={144} rx={6} fill={c} />;
  const badge = (x, y) => <rect x={x} y={y} width={34} height={16} rx={4} fill={A} />;

  let body;
  if (n.includes('versus') || n.includes('duel'))
    body = <>{face(18, 38, 96, 116)}{face(206, 38, 96, 116)}<text x={160} y={104} fill="#fff" fontFamily="var(--font-display)" fontWeight="800" fontSize="26" textAnchor="middle">VS</text></>;
  else if (n.includes('full-bleed')) body = <>{face(92, 12, 136, 172)}{bars(118, 150, 90, [0.8])}</>;
  else if (n.includes('chart') || n.includes('data-viz')) body = <>{chart()}{face(220, 60, 84, 110)}{bars(20, 30, 120, [0.9, 0.6])}</>;
  else if (n.includes('triptych') || n.includes('3-panel')) body = <>{panel(14, 92, '#22405f')}{panel(114, 92, '#3a2a55')}{panel(214, 92, '#5a2a2a')}<text x={160} y={170} fill={TX} fontFamily="var(--font-mono)" fontSize="11" textAnchor="middle">A · B · C</text></>;
  else if (n.includes('before') || n.includes('after')) body = <><rect x={14} y={18} width={142} height={144} rx={6} fill="#23303f" /><rect x={164} y={18} width={142} height={144} rx={6} fill="#5a2a2a" />{bars(28, 130, 70, [0.7])}{bars(178, 130, 70, [0.7])}</>;
  else if (n.includes('text-dominant')) body = <>{bars(40, 56, 240, [1, 0.85, 0.6])}</>;
  else if (n.includes('product') || n.includes('object hero')) body = <><circle cx={160} cy={86} r={48} fill={A2} /><rect x={132} y={140} width={56} height={10} rx={3} fill={HL} /></>;
  else if (n.includes('number') || n.includes('list')) body = <><text x={70} y={120} fill={A} fontFamily="var(--font-display)" fontWeight="800" fontSize="96" textAnchor="middle">7</text>{bars(140, 70, 150, [0.9, 0.7])}</>;
  else if (n.includes('annotated') || n.includes('arrow')) body = <>{face(196, 36, 100, 120)}<circle cx={120} cy={70} r={28} fill="none" stroke={A} strokeWidth="3" />{arrow('M120,98 C130,130 160,130 188,108')}</>;
  else if (n.includes('scene') || n.includes('establishing')) body = <><rect x={14} y={18} width={292} height={92} rx={6} fill="#2a3a4f" /><rect x={14} y={110} width={292} height={52} rx={6} fill="#1b2735" />{bars(28, 128, 90, [0.7])}</>;
  else if (n.includes('map') || n.includes('geo') || n.includes('series')) body = <><polygon points="40,40 90,30 110,70 95,120 55,135 30,90" fill="#2a405f" stroke={A} strokeWidth="2" />{face(210, 44, 92, 112)}{bars(150, 30, 120, [0.9])}</>;
  else if (n.includes('interview') || n.includes('host')) body = <>{face(40, 36, 96, 110)}{face(186, 36, 96, 110)}<rect x={78} y={150} width={6} height={22} rx={3} fill={TX} /><rect x={232} y={150} width={6} height={22} rx={3} fill={TX} />{bars(120, 26, 80, [0.8])}</>;
  else if (n.includes('cinematic') || n.includes('editorial')) body = <><rect x={14} y={18} width={292} height={144} rx={8} fill="#0b0e14" />{face(120, 22, 80, 150)}{bars(120, 150, 80, [0.6])}</>;
  else if (n.includes('founder') || n.includes('brand scene')) body = <><rect x={14} y={18} width={292} height={144} rx={6} fill="#1d2a3d" />{chart('#9fb4d8')}{face(206, 40, 96, 116)}{badge(150, 70)}{arrow('M70,150 C100,140 140,135 168,118')}{bars(24, 120, 110, [1, 0.7])}</>;
  else // Face + Text split (default)
    body = <>{face(196, 22, 110, 150)}{bars(28, 60, 140, [1, 0.8, 0.55])}</>;

  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ display: 'block', borderRadius: 10, border: '1px solid var(--stroke-1)' }}>
      <defs><marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fff" /></marker></defs>
      <rect x="0" y="0" width={W} height={H} rx="12" fill={BG} />
      {body}
    </svg>
  );
}

<script type="text/babel" data-presets="react">
/* ===== ci-research.jsx ===== */
// ContentIntel — Research editor (admin-only). Edits the in-memory research,
// previews it live, and exports an updated research.js to commit.
//
// HONEST NOTE: on a static site this gate is obscurity-level — anyone can read
// the source. The REAL protection is that the live site only changes when YOU
// commit research.js. The editor here just hides the UI from normal visitors
// and lets you produce the file without hand-editing JSON.

const LS_ADMIN = "ci_admin";
function isAdmin() {

    if (sessionStorage.getItem(LS_ADMIN) === "1") return true;
  } catch (e) {}
  return false;
}
async function promptAdmin() {
  const p = window.prompt("Research editor passphrase:");

}
function exitAdmin() { try { sessionStorage.removeItem(LS_ADMIN); } catch (e) {} }

// current research = override (edited) or the file's window.CI_RESEARCH
function currentResearch() {
  return window.__CI_RESEARCH_OVERRIDE || window.CI_RESEARCH || {};
}
function serializeResearch(obj) {
  return "/* ContentIntel research data — generated by the in-app Research editor.\n" +

  const [data, setData] = React.useState(() => JSON.parse(JSON.stringify(currentResearch())));

  function addRubric(type) {
    setData(d => ({ ...d, [type]: { ...(d[type] || {}), rubric: [...((d[type] || {}).rubric || []), { name: "New dimension", what: "" }] } }));

  function delRubric(type, idx) {

  function savePrivate() {
    let next = data;

  }
  function download() {
    const obj = raw ? safeParse(rawText) : data;

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = "research.js"; a.click();
    URL.revokeObjectURL(url);
    setMsg("Downloaded research.js — commit it to your repo and redeploy.");
    setTimeout(() => setMsg(""), 4000);
  }
  function safeParse(t) { try { return JSON.parse(t); } catch (e) { return null; } }
  function toggleRaw() {
    if (!raw) setRawText(JSON.stringify(data, null, 2));
    else { const o = safeParse(rawText); if (o) setData(o); }
    setRaw(r => !r);
  }

  return (
    <div className="ci-work wide" style={{ "--ci-accent": m.accentFrom, "--ci-glow": m.accentGlow }}>
      <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", marginBottom: 18, flexWrap: "wrap", gap: 12 }}>
        <div>
          <Eyebrow mood={mood} glow>Admin · research {priv && "· private draft active"}</Eyebrow>
          <h2 className="ci-h2">Improve the research</h2>
          <p className="ci-sub" style={{ marginTop: 8 }}>
            Your private editing surface — invisible to anyone you share the link with. Add findings anytime; <b>Save (private)</b> keeps them in your browser and uses them in your own analyses straight away. When you want everyone to benefit, <b>Download research.js</b>, commit it and redeploy. The app code never changes.
          </p>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          {onNav && <button className="ci-copybtn" style={{ height: 34 }} onClick={() => onNav("train")}>🧠 Train from thumbnails →</button>}
          <button className="ci-copybtn" style={{ height: 34 }} onClick={toggleRaw}>{raw ? "Form view" : "Raw JSON"}</button>
          <button className="ci-copybtn" style={{ height: 34 }} onClick={() => { exitAdmin(); onClose(); }}>Lock & exit</button>
        </div>
      </div>

      <div className="ci-block" style={{ display: "flex", alignItems: "flex-start", gap: 12, marginBottom: 14, padding: "12px 16px" }}>
        <span className="ci-dot yellow" style={{ marginTop: 4 }} />
        <span style={{ fontSize: 12.5, color: "var(--text-3)", lineHeight: 1.5 }}>
          <b>How privacy works:</b> the Research tab + lock icon are hidden from normal visitors (they appear only after you unlock via <code>?admin=…</code> on your own browser). Drafts you <b>Save (private)</b> live only in your browser and never reach other users. Only <b>Download research.js → commit</b> publishes to everyone. Note: once published, research.js ships to the browser, so don't store secrets here — it's evaluation methodology, not credentials.
        </span>
      </div>

      {!raw ? (
        <>
          <div className="ci-chiprow" style={{ marginBottom: 14 }}>
            {SECTIONS.map(t => (
              <button key={t} className={"pill" + (active === t ? " active" : "")} onClick={() => setActive(t)} style={{ height: 32 }}>{LABELS[t]}</button>
            ))}
          </div>

          {active === "core" ? (
            <Block title="Global research context" desc="Shared by EVERY check — the universal attention/virality science + how to adapt to any language, region and niche. This is prepended to every analysis." mood={mood}>
              <textarea className="ci-textarea" style={{ minHeight: 380, fontFamily: "var(--font-mono)", fontSize: 12.5, lineHeight: 1.6 }}
                value={data.core || ""} onChange={e => setData(d => ({ ...d, core: e.target.value }))}
                placeholder="Paste the research that should inform all four checks…" />
            </Block>
          ) : (
          <>
          <Block title={`${LABELS[active]} · methodology`} desc="This becomes Claude's evaluation framework for this specific check." mood={mood}>
            <textarea className="ci-textarea" style={{ minHeight: 260, fontFamily: "var(--font-mono)", fontSize: 12.5, lineHeight: 1.6 }}
              value={seg.systemGuidance || ""} onChange={e => setField(active, "systemGuidance", e.target.value)}
              placeholder="Frameworks, data points, do's and don'ts, examples…" />
          </Block>

          <Block title={`${LABELS[active]} · scoring rubric`} desc="The dimensions Claude grades 0–100" mood={mood}
            right={<button className="ci-copybtn" style={{ height: 28 }} onClick={() => addRubric(active)}>+ Add</button>}>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {(seg.rubric || []).map((r, i) => (
                <div key={i} style={{ display: "grid", gridTemplateColumns: "180px 1fr 30px", gap: 10, alignItems: "start" }}>
                  <input className="ci-input" value={r.name || ""} onChange={e => setRubric(active, i, "name", e.target.value)} placeholder="Dimension" />
                  <input className="ci-input" value={r.what || ""} onChange={e => setRubric(active, i, "what", e.target.value)} placeholder="What it measures" />
                  <button className="ci-copybtn" style={{ height: 44, padding: "0 9px" }} onClick={() => delRubric(active, i)}>✕</button>
                </div>
              ))}

          </Block>

          <Block title={`${LABELS[active]} · extra notes`} mood={mood}>
            <input className="ci-input" value={seg.notes || ""} onChange={e => setField(active, "notes", e.target.value)} placeholder="Optional extra instruction appended to the prompt" />
          </Block>
          </>
          )}
        </>
      ) : (
        <Block title="Raw research JSON" desc="Edit the whole object directly" mood={mood}>
          <textarea className="ci-textarea" style={{ minHeight: 460, fontFamily: "var(--font-mono)", fontSize: 12, lineHeight: 1.55 }}
            value={rawText} onChange={e => setRawText(e.target.value)} spellCheck={false} />
        </Block>
      )}

      <div style={{ display: "flex", alignItems: "center", gap: 14, marginTop: 16, flexWrap: "wrap" }}>
        <GlowButton mood={mood} onClick={savePrivate}>Save (private to this browser)</GlowButton>
        <GlowButton mood="burgundy" onClick={download}>↓ Download research.js (publish to all)</GlowButton>
        {priv && <button className="ci-copybtn" style={{ height: 38 }} onClick={clearPrivate}>Clear private draft</button>}
        {msg && <span style={{ fontSize: 12.5, color: "var(--text-2)", maxWidth: 360, lineHeight: 1.4 }}>{msg}</span>}
      </div>
    </div>
  );
}

Object.assign(window, { isAdmin, promptAdmin, exitAdmin, ResearchTab });
</script>
<script type="text/babel" data-presets="react">
/* ===== ci-train.jsx ===== */
// ContentIntel — Train from thumbnails (admin-only).
// Drop up to 500 reference thumbnails → batched vision analysis → aggregate the
// design patterns → synthesize an updated playbook → merge into the research
// library (private draft). The owner then Downloads research.js to publish.
//
// Requires an Anthropic API key (vision). The free preview AI cannot see images.

const TRAIN_MAX = 500;
const TRAIN_DOWNSCALE_W = 640; // thumbnails are judged small; downscale to cut tokens/cost/memory

// Read a file → downscaled JPEG { mime, data(base64), preview, name }
function trainReadImage(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("read failed"));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("decode failed"));
      img.onload = () => {
        const scale = Math.min(1, TRAIN_DOWNSCALE_W / (img.width || TRAIN_DOWNSCALE_W));
        const w = Math.max(1, Math.round((img.width || TRAIN_DOWNSCALE_W) * scale));
        const h = Math.max(1, Math.round((img.height || TRAIN_DOWNSCALE_W) * scale));
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        const url = c.toDataURL("image/jpeg", 0.82);
        resolve({ mime: "image/jpeg", data: url.split(",")[1] || "", preview: url, name: file.name });
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

// Limited-concurrency pool. Errors are captured per item, never thrown.
async function trainPool(items, worker, concurrency, onProgress) {
  let idx = 0, done = 0;
  const results = new Array(items.length);
  async function next() {
    const i = idx++;
    if (i >= items.length) return;
    try { results[i] = await worker(items[i], i); }
    catch (e) { results[i] = { __error: String(e && e.message || e) }; }
    onProgress(++done, items.length);
    return next();
  }
  await Promise.all(Array.from({ length: Math.min(concurrency, items.length) }, next));
  return results;
}

function trainParseLoose(text) {
  let t = (text || "").trim();
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i); if (fence) t = fence[1].trim();
  const s = Math.min(...["[", "{"].map(c => { const k = t.indexOf(c); return k < 0 ? 1e9 : k; }));
  const e = Math.max(t.lastIndexOf("]"), t.lastIndexOf("}"));
  if (s < 1e9 && e !== -1) t = t.slice(s, e + 1);
  try { return JSON.parse(t); } catch (e1) {
    try { return JSON.parse(t.replace(/,\s*([}\]])/g, "$1")); } catch (e2) { return null; }
  }
}

// ── Aggregate per-image records into frequency stats ─────────────────────────
function trainAggregate(records, niche) {
  const ok = records.filter(r => r && !r.__error && typeof r === "object");
  const tally = {};
  const bump = (k, v) => { if (v == null || v === "") return; (tally[k] = tally[k] || {})[v] = (tally[k][v] || 0) + 1; };
  let faces = 0, arrows = 0, numHooks = 0, wordSum = 0, wordN = 0;
  const powerWords = {}, badges = {}, hooks = [];
  ok.forEach(r => {
    bump("layout", r.layout); bump("colorScheme", r.colorScheme); bump("faceExpression", r.faceExpression);
    if (r.hasFace) faces++; if (r.hasArrow) arrows++;
    if (r.numberHook && String(r.numberHook).toLowerCase() !== "none") numHooks++;
    if (typeof r.wordCount === "number") { wordSum += r.wordCount; wordN++; }
    (r.powerWords || []).forEach(w => { if (w) powerWords[w] = (powerWords[w] || 0) + 1; });
    (r.badges || []).forEach(b => { if (b) badges[b] = (badges[b] || 0) + 1; });
    if (r.textHook) hooks.push(r.textHook);
  });
  const n = ok.length || 1;
  const top = (obj, k = 8) => Object.entries(obj).sort((a, b) => b[1] - a[1]).slice(0, k);
  return {
    niche, n: ok.length, errors: records.length - ok.length,
    layouts: top(tally.layout || {}), colorSchemes: top(tally.colorScheme || {}),
    faceExpressions: top(tally.faceExpression || {}),
    withFacePct: Math.round((faces / n) * 100), withArrowPct: Math.round((arrows / n) * 100),
    numberHookPct: Math.round((numHooks / n) * 100), avgWordCount: wordN ? +(wordSum / wordN).toFixed(1) : null,
    powerWords: top(powerWords, 12), badges: top(badges, 6), sampleHooks: hooks.slice(0, 24),
  };
}

// ── Component ────────────────────────────────────────────────────────────────
function TrainTab({ onClose, onNav, onOpenKey }) {
  const mood = "violet";
  const m = window.MOODS[mood];
  const TLib = window.getResearch("thumbnail") || {};
  const layoutNames = (TLib.layouts || []).map(x => x.name);
  const schemeNames = (TLib.colorSchemes || []).map(x => x.name);

  const [files, setFiles] = React.useState([]);     // {mime,data,preview,name}
  const [niche, setNiche] = React.useState("Business / startup case-study (Indian)");
  const [notes, setNotes] = React.useState("");
  const [batch, setBatch] = React.useState(6);
  const [phase, setPhase] = React.useState("idle"); // idle|reading|running|synth|done|error
  const [prog, setProg] = React.useState({ done: 0, total: 0 });
  const [stats, setStats] = React.useState(null);
  const [synth, setSynth] = React.useState(null);   // {summary, provenPatterns, designPrinciples, layoutsToAdd, colorSchemesToAdd}
  const [append, setAppend] = React.useState(true);
  const [err, setErr] = React.useState("");
  const [msg, setMsg] = React.useState("");

  const hasKey = !!window.getKey();
  const estCost = window.estCost(files.length * 1300 + 1200, files.length * 40 + 1500, window.getModel());

  async function onPick(fileList) {
    const arr = Array.from(fileList || []).slice(0, TRAIN_MAX);
    setErr(""); setPhase("reading"); setProg({ done: 0, total: arr.length });
    const out = [];
    for (let i = 0; i < arr.length; i++) {
      try { out.push(await trainReadImage(arr[i])); } catch (e) {}
      setProg({ done: i + 1, total: arr.length });
    }
    setFiles(out); setPhase("idle");
  }

  function classifySystem() {
    return [
      "You are a precise thumbnail DESIGN ANALYST. You receive one or more images labelled Image 1, Image 2, …",
      "For EACH image, extract its design features. Classify `layout` and `colorScheme` using ONLY one of the allowed names below, or \"other\" if none fit.",
      "ALLOWED LAYOUTS: " + (layoutNames.join(" | ") || "(none)"),
      "ALLOWED COLOUR SCHEMES: " + (schemeNames.join(" | ") || "(none)"),
      'Return ONLY a JSON array (no markdown, no prose), one object per image in order:',
      '[{"i":1,"layout":"<name|other>","colorScheme":"<name|other>","textHook":"<main on-image text, verbatim, or empty>","wordCount":<int>,"hasFace":true,"faceCount":<int>,"faceExpression":"<smiling|shock|serious|neutral|none>","hasArrow":true,"badges":["100K+ VIEWS"],"powerWords":["King"],"numberHook":"<e.g. 900 Crore | $10,000 | none>","notes":"<one short phrase>"}]',
      "Be literal about what is visible. Do not invent text that is not there.",
    ].join("\n");
  }

  async function start() {
    if (!hasKey) { setErr("Bulk training needs your own Anthropic API key (the free preview AI can't see images). Add it in Settings."); return; }
    if (!files.length) { setErr("Add some thumbnails first."); return; }
    setErr(""); setStats(null); setSynth(null); setPhase("running");
    // chunk into groups
    const chunks = [];
    for (let i = 0; i < files.length; i += batch) chunks.push(files.slice(i, i + batch));
    let imagesDone = 0; setProg({ done: 0, total: files.length });
    const sys = classifySystem();
    const chunkResults = await trainPool(chunks, async (chunk) => {
      const { text } = await window.callClaude({
        system: sys,
        userText: `Analyze these ${chunk.length} thumbnail(s). Niche/context: ${niche || "(unspecified)"}. Return the JSON array.`,
        images: chunk, maxTokens: 220 * chunk.length + 400,
      });
      const arr = trainParseLoose(text);
      return Array.isArray(arr) ? arr : (arr ? [arr] : []);
    }, 2, (d) => { /* per-chunk */ });
    // flatten, tracking progress by images
    const records = [];
    chunkResults.forEach((res, ci) => {
      const chunk = chunks[ci];
      if (res && res.__error) { chunk.forEach(() => records.push({ __error: res.__error })); }
      else { const a = res || []; chunk.forEach((f, k) => records.push(Object.assign({ name: f.name }, a[k] || { __error: "no record" }))); }
      imagesDone += chunk.length; setProg({ done: imagesDone, total: files.length });
    });
    const agg = trainAggregate(records, niche);
    setStats(agg);
    // synthesize
    setPhase("synth");
    try {
      const synthSys = [
        "You are a thumbnail STRATEGIST. From aggregated feature statistics of analyzed TOP-PERFORMING thumbnails in a niche, write updated research that another AI will use to score and regenerate thumbnails in that niche.",
        "Base everything ONLY on the stats provided; cite the key frequencies (e.g. 'face in 80%'). Be concrete and directly actionable.",
        'Return ONLY JSON: {"summary":"2-3 sentences","provenPatterns":"a niche-scoped playbook: layout, colours, text/number formula, power words, badges, tone — numbered, directly usable","designPrinciples":"6-10 bullet lines","layoutsToAdd":[{"name":"","what":""}],"colorSchemesToAdd":[{"name":"","what":""}]}',
        "layoutsToAdd / colorSchemesToAdd: ONLY archetypes/schemes that recur in the stats but are NOT already in this list — else return empty arrays. Existing layouts: " + (layoutNames.join(" | ")) + ". Existing schemes: " + (schemeNames.join(" | ")) + ".",
      ].join("\n");
      const { text } = await window.callClaude({
        system: synthSys,
        userText: "Niche: " + niche + "\nOwner notes (e.g. which were winners): " + (notes || "(none)") + "\n\nAGGREGATED STATS (JSON):\n" + JSON.stringify(agg, null, 2),
        maxTokens: 1600,
      });
      const obj = trainParseLoose(text) || {};
      setSynth({
        summary: obj.summary || "",
        provenPatterns: obj.provenPatterns || "",
        designPrinciples: obj.designPrinciples || "",
        layoutsToAdd: Array.isArray(obj.layoutsToAdd) ? obj.layoutsToAdd : [],
        colorSchemesToAdd: Array.isArray(obj.colorSchemesToAdd) ? obj.colorSchemesToAdd : [],
      });
      setPhase("done");
    } catch (e) { setErr("Synthesis failed: " + (e.message || e)); setPhase("error"); }
  }

  function mergeByName(existing, additions) {
    const out = [...(existing || [])];
    (additions || []).forEach(a => { if (a && a.name && !out.some(x => x.name === a.name)) out.push({ name: a.name, what: a.what || "" }); });
    return out;
  }
  function saveToResearch() {
    if (!synth) return;
    const cur = JSON.parse(JSON.stringify(window.__CI_RESEARCH_OVERRIDE || window.CI_RESEARCH || {}));
    cur.thumbnail = cur.thumbnail || {};
    const stamp = `\n\n— ${niche} (n=${stats ? stats.n : files.length}, trained ${new Date().toISOString().slice(0, 10)}) —\n`;
    cur.thumbnail.provenPatterns = append && cur.thumbnail.provenPatterns
      ? (cur.thumbnail.provenPatterns + "\n" + stamp + synth.provenPatterns)
      : (stamp.trim() + "\n" + synth.provenPatterns);
    if (synth.designPrinciples) cur.thumbnail.designPrinciples = synth.designPrinciples;
    cur.thumbnail.layouts = mergeByName(cur.thumbnail.layouts, synth.layoutsToAdd);
    cur.thumbnail.colorSchemes = mergeByName(cur.thumbnail.colorSchemes, synth.colorSchemesToAdd);
    window.saveLocalResearch(cur);
    setMsg("Merged into your private research draft — your thumbnail analyses use it now. Open Research → Download research.js to publish to everyone.");
    setTimeout(() => setMsg(""), 7000);
  }

  const busy = phase === "reading" || phase === "running" || phase === "synth";
  const pct = prog.total ? Math.round((prog.done / prog.total) * 100) : 0;

  return (
    <div className="ci-work wide" style={{ "--ci-accent": m.accentFrom, "--ci-glow": m.accentGlow }}>
      <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", marginBottom: 18, flexWrap: "wrap", gap: 12 }}>
        <div>
          <Eyebrow mood={mood} glow>Admin · train</Eyebrow>
          <h2 className="ci-h2">Train from thumbnails</h2>
          <p className="ci-sub" style={{ marginTop: 8, maxWidth: 680 }}>
            Drop up to {TRAIN_MAX} reference thumbnails (ideally proven top-performers in one niche). The app analyses them in batches with image vision, aggregates the design patterns, and writes an updated playbook into your research library.
          </p>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          {onNav && <button className="ci-copybtn" style={{ height: 34 }} onClick={() => onNav("research")}>Open Research →</button>}

        </div>
      </div>

      {!hasKey && (
        <div className="ci-block" style={{ marginBottom: 14, border: "1px solid rgba(240,200,90,0.3)", background: "rgba(240,200,90,0.07)" }}>

          <div style={{ fontSize: 13, color: "var(--text-2)", marginTop: 6, lineHeight: 1.5 }}>
            Image vision only works on your own Anthropic key (the free preview AI is text-only). <button className="ci-copybtn" style={{ height: 30, marginLeft: 6 }} onClick={onOpenKey}>Open Settings</button>
          </div>
        </div>
      )}

            </div>
          </div>
        </Block>
      )}

      {synth && (
        <>
          {synth.summary && (
            <Block mood={mood} style={{ background: `linear-gradient(135deg, ${m.orbC}55, var(--surface-1))`, border: `1px solid ${m.accentGlow}` }}>

            <textarea className="ci-textarea" style={{ minHeight: 200, fontFamily: "var(--font-mono)", fontSize: 12.5, lineHeight: 1.6 }}
              value={synth.provenPatterns} onChange={e => setSynth(s => ({ ...s, provenPatterns: e.target.value }))} />
          </Block>
          <Block title="Design principles (editable)" desc="Replaces thumbnail.designPrinciples." mood={mood}>
            <textarea className="ci-textarea" style={{ minHeight: 150, fontFamily: "var(--font-mono)", fontSize: 12.5, lineHeight: 1.6 }}
              value={synth.designPrinciples} onChange={e => setSynth(s => ({ ...s, designPrinciples: e.target.value }))} />
          </Block>
          {(synth.layoutsToAdd.length > 0 || synth.colorSchemesToAdd.length > 0) && (
            <Block title="New library entries to add" mood={mood}>
              {synth.layoutsToAdd.map((x, i) => <div key={"l" + i} style={{ fontSize: 13, color: "var(--text-2)", padding: "4px 0" }}><b>Layout · {x.name}</b> — {x.what}</div>)}
              {synth.colorSchemesToAdd.map((x, i) => <div key={"c" + i} style={{ fontSize: 13, color: "var(--text-2)", padding: "4px 0" }}><b>Colour · {x.name}</b> — {x.what}</div>)}
            </Block>
          )}
          <div style={{ display: "flex", alignItems: "center", gap: 14, marginTop: 6, flexWrap: "wrap" }}>
            <label style={{ display: "flex", alignItems: "center", gap: 7, fontSize: 13, color: "var(--text-2)" }}>
              <input type="checkbox" checked={append} onChange={e => setAppend(e.target.checked)} /> Append to existing patterns (keep other niches)
            </label>
            <GlowButton mood={mood} onClick={saveToResearch}>Save to research (private)</GlowButton>
            {onNav && <button className="ci-copybtn" style={{ height: 38 }} onClick={() => onNav("research")}>Open Research to publish →</button>}
          </div>
          {msg && <div style={{ fontSize: 12.5, color: "var(--text-2)", marginTop: 10, maxWidth: 560, lineHeight: 1.5 }}>{msg}</div>}
        </>
      )}
    </div>
  );
}

function StatList({ title, items, n }) {
  if (!items || !items.length) return null;
  return (
    <div>
      <div style={{ fontWeight: 600, color: "var(--text-2)", marginBottom: 6 }}>{title}</div>
      {items.map(([k, c], i) => (
        <div key={i} style={{ display: "flex", justifyContent: "space-between", gap: 10, color: "var(--text-3)", padding: "2px 0" }}>

          <b style={{ color: "var(--text-1)" }}>{Math.round((c / (n || 1)) * 100)}%</b>
        </div>
      ))}
    </div>
  );
}

<script type="text/babel" data-presets="react">
/* ===== ci-account.jsx ===== */
// ContentIntel — Accounts (Supabase): sign up w/ email confirmation, sign in,
// profile + plan + usage bar, sign out. Activates ONLY when window.CI_SAAS is
// configured (see saas/SETUP.md) — otherwise the app stays BYO-key, unchanged.

const SAAS = (typeof window !== 'undefined' && window.CI_SAAS) || {};
const saasOn = !!(SAAS.supabaseUrl && SAAS.supabaseAnonKey);

// Lazy-load supabase-js only when configured (zero weight otherwise).
let __sb = null;
function getSupabase() {
  return new Promise((resolve, reject) => {
    if (__sb) return resolve(__sb);
    if (!saasOn) return reject(new Error('SaaS not configured'));
    const make = () => {
      __sb = window.supabase.createClient(SAAS.supabaseUrl, SAAS.supabaseAnonKey, {
        auth: { flowType: 'implicit', detectSessionInUrl: true, persistSession: true, autoRefreshToken: true },
      });
      resolve(__sb);
    };
    if (window.supabase) return make();
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
    sc.onload = make;
    sc.onerror = () => reject(new Error('Could not load the sign-in library.'));
    document.head.appendChild(sc);
  });
}

// Keep the session token globally so the engine can route through the worker.
async function refreshSession() {
  try {
    const sb = await getSupabase();
    const { data } = await sb.auth.getSession();
    window.CI_SESSION = data.session ? data.session.access_token : null;
    window.CI_USER = data.session ? data.session.user : null;
    window.dispatchEvent(new Event('ci-auth'));
    return data.session;
  } catch (e) { return null; }
}
// After an OAuth (Google) redirect, apply the invite code the user typed
// before they were sent to Google, so the Worker can auto-approve them.
async function applyPendingInvite(sb, session) {
  try {
    if (!session || !session.user) return;
    const code = localStorage.getItem('ci_pending_invite');
    if (!code) return;
    const existing = session.user.user_metadata && session.user.user_metadata.invite_code;
    if (!existing) await sb.auth.updateUser({ data: { invite_code: code } });
    localStorage.removeItem('ci_pending_invite');
  } catch (e) {}
}
if (saasOn) {
  getSupabase().then(sb => {
    sb.auth.onAuthStateChange((_evt, session) => {
      window.CI_SESSION = session ? session.access_token : null;
      window.CI_USER = session ? session.user : null;
      applyPendingInvite(sb, session);
      try { window.dispatchEvent(new Event('ci-auth')); } catch (e) {}
      try {
        if (session && (location.hash.includes('access_token') || location.search.includes('code='))) {
          history.replaceState(null, '', location.origin + location.pathname);
        }
      } catch (e) {}
    });
  }).catch(() => {});
  refreshSession();
}
window.refreshSession = refreshSession;
window.ciGetSupabase = getSupabase;  // let the onboarding gate reuse the client
async function ciGetMyPlan() {
  try {
    const sb = await getSupabase();
    const { data: { user } } = await sb.auth.getUser();
    if (!user) return null;
    const { data } = await sb.from('profiles').select('plan').eq('id', user.id).single();
    return data ? data.plan : null;
  } catch (e) { return null; }
}
async function ciRedeemInvite(code) {
  if (!SAAS.workerUrl || !window.CI_SESSION) throw new Error('Please sign in first.');
  const res = await fetch(SAAS.workerUrl, {
    method: 'POST',
    headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + window.CI_SESSION },
    body: JSON.stringify({ redeem: true, code: String(code || '') }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'That code is not valid.');
  return data;
}
async function ciSignOut() {
  try { const sb = await getSupabase(); await sb.auth.signOut(); } catch (e) {}
  window.CI_SESSION = null; window.CI_USER = null;
  try { window.dispatchEvent(new Event('ci-auth')); } catch (e) {}
}
let __researchLoaded = false, __researchPromise = null;
async function ciEnsureResearch() {
  if (__researchLoaded) return true;
  if (!SAAS.workerUrl || !window.CI_SESSION) return false; // no worker/session -> client uses built-in defaults
  if (!__researchPromise) __researchPromise = (async () => {
    try {
      const res = await fetch(SAAS.workerUrl, {
        method: 'POST',
        headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + window.CI_SESSION },
        body: JSON.stringify({ research: true }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.research) { window.CI_RESEARCH = data.research; __researchLoaded = true; }
    } catch (e) {}
  })();
  await __researchPromise;
  return __researchLoaded;
}
window.ciEnsureResearch = ciEnsureResearch;
window.ciGetMyPlan = ciGetMyPlan;
window.ciRedeemInvite = ciRedeemInvite;
window.ciSignOut = ciSignOut;

const PLAN_LABEL = { free: 'Free — 15 credits', starter: 'Starter — 150 credits/mo', pro: 'Creator Pro — 750 credits/mo', agency: 'Agency — 3,000 credits/mo' };
const PLAN_LIMIT = { free: 15, starter: 150, pro: 750, agency: 3000 };
// Engines: pick power vs credits. Saved locally; sent with every check.
const ENGINES_UI = [
  { tier: 'quick', label: 'Quick', model: 'Haiku',  credits: 1, minPlan: 'free',    desc: 'Fast checks, light edits' },
  { tier: 'smart', label: 'Smart', model: 'Sonnet', credits: 3, minPlan: 'starter', desc: 'The standard — deep, reliable' },
  { tier: 'max',   label: 'Max',   model: 'Opus',   credits: 5, minPlan: 'pro',     desc: 'Hardest scripts, best rewrites' },
];
const PLAN_RANK = { free: 0, starter: 1, pro: 2, agency: 2 };
function getEngine() { try { return localStorage.getItem('ci_engine') || 'smart'; } catch (e) { return 'smart'; } }
function setEngine(t) { try { localStorage.setItem('ci_engine', t); } catch (e) {} }
window.getEngine = getEngine;

function AccountModal({ open, onClose, onNav }) {
  const [mode, setMode] = React.useState('signin'); // signin | signup | profile
  const [email, setEmail] = React.useState('');
  const [pass, setPass] = React.useState('');
  const [msg, setMsg] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const [profile, setProfile] = React.useState(null);

  React.useEffect(() => {
    if (!open) return;
    setMsg('');
    refreshSession().then(sess => {
      if (sess) { setMode('profile'); loadProfile(); }
      else setMode('signin');
    });
  }, [open]);

  async function loadProfile() {
    try {
      const sb = await getSupabase();
      const { data: { user } } = await sb.auth.getUser();
      if (!user) return;
      const { data } = await sb.from('profiles').select('plan, checks_used, email, full_name, usd_limit').eq('id', user.id).single();
      setProfile({ ...(data || { plan: 'free', checks_used: 0 }), email: user.email });
    } catch (e) {}
  }

  async function submit() {
    if (!email.trim() || pass.length < 8) { setMsg('Enter your email and a password of 8+ characters.'); return; }
    setBusy(true); setMsg('');
    try {
      const sb = await getSupabase();
      if (mode === 'signup') {
        const { error } = await sb.auth.signUp({ email: email.trim(), password: pass });
        if (error) throw error;
        setMsg('✓ Account created — check your inbox and click the confirmation link, then sign in.');
        setMode('signin');
      } else {
        const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pass });
        if (error) throw error;
        await refreshSession();
        setMode('profile'); loadProfile();
      }
    } catch (e) {
      setMsg(e.message === 'Email not confirmed' ? 'Confirm your email first — check your inbox (and spam).' : (e.message || 'Something went wrong.'));
    }
    setBusy(false);
  }

  async function signOut() {
    try { const sb = await getSupabase(); await sb.auth.signOut(); } catch (e) {}
    window.CI_SESSION = null; window.CI_USER = null;
    window.dispatchEvent(new Event('ci-auth'));
    onClose();
  }

  if (!open) return null;
  const limit = profile ? (profile.usd_limit != null ? Math.round(Number(profile.usd_limit) * 130) : (PLAN_LIMIT[profile.plan] || 15)) : 15;
  const used = profile ? (profile.checks_used || 0) : 0;
  const pct = Math.min(100, Math.round(used / limit * 100));

  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 200, display: 'grid', placeItems: 'center', background: 'rgba(4,6,12,0.6)', backdropFilter: 'blur(6px)' }} onClick={onClose}>

            <div style={{ fontSize: 13, color: 'var(--text-3)', marginTop: 6, lineHeight: 1.55 }}>
