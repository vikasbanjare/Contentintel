}

// Repair truncated/unbalanced JSON: close any open string and brackets so a
// cut-off model response still parses (we lose only the incomplete tail).
function repairJson(s) {
  const stack = [];
  let inStr = false, esc = false;
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (inStr) {
      if (esc) esc = false;
      else if (c === "\\") esc = true;
      else if (c === '"') inStr = false;
    } else {
      if (c === '"') inStr = true;
      else if (c === "{") stack.push("}");
      else if (c === "[") stack.push("]");
      else if (c === "}" || c === "]") stack.pop();
    }
  }
  let out = s;
  if (inStr) out += '"';           // close a dangling string
  out = out.replace(/,\s*$/, "");  // drop a dangling comma
  for (let i = stack.length - 1; i >= 0; i--) out += stack[i];
  return out;
}

// Robust: tolerate code fences, surrounding prose, trailing commas AND
// truncated responses. Returns null (never throws) when nothing is usable.
// Remove leaked tool-call / function-call XML the model sometimes emits as text
// (when it wrongly thinks it has a web_search tool). Keeps the real prose/JSON.
function stripToolNoise(s) {
  return String(s || "")
    .replace(/<function_calls>[\s\S]*?<\/function_calls>/gi, "")
    .replace(/<function_results>[\s\S]*?<\/function_results>/gi, "")
    .replace(/<invoke\b[\s\S]*?<\/invoke>/gi, "")
    .replace(/<\/?(?:function_calls|function_results|invoke|parameter)\b[^>]*>/gi, "")
    .trim();
}

function parseReport(text) {
  let t = stripToolNoise(text);
  // Prefer fenced blocks that actually contain an object; if several, take the LAST
  // (the model's final answer comes after any preamble/reasoning).
  const fences = Array.from(t.matchAll(/```(?:json)?\s*([\s\S]*?)```/gi)).map(m => m[1].trim()).filter(b => b.includes("{"));
  if (fences.length) t = fences[fences.length - 1];
  const s = t.indexOf("{");
  if (s === -1) return null;
  t = t.slice(s); // from first "{" to the end -- don't trim the tail (handle cut-offs)
  const tryParse = (x) => { try { return JSON.parse(x); } catch (e) { return undefined; } };
  let r = tryParse(t);
  if (r !== undefined) return r;
  r = tryParse(t.replace(/,\s*([}\]])/g, "$1")); // drop trailing commas
  if (r !== undefined) return r;
  r = tryParse(repairJson(t));                   // close a truncated tail
  if (r !== undefined) return r;
  // Last resort: walk back to earlier "}" boundaries, repairing each time, so a
  // long report that was cut mid-section still renders everything that completed.
  let idx = t.length;
  for (let n = 0; n < 50 && idx > 0; n++) {
    idx = t.lastIndexOf("}", idx - 1);
    if (idx === -1) break;
    r = tryParse(repairJson(t.slice(0, idx + 1)));
    if (r !== undefined) return r;
  }
  return null;
}

// Weight a dimension by what it is (creators control hook/retention/value/CTA the
// most, so those move the headline score the most). Unknown names get a mid weight,
// so non-script reports effectively become an equal-weight average.
function dimWeight(name) {
  const n = String(name || "").toLowerCase();
  if (/hook/.test(n)) return 3;
  if (/reten|loop/.test(n)) return 2.5;
  if (/value|payoff/.test(n)) return 2;
  if (/cta|call to action/.test(n)) return 1.5;
  if (/pacing|deliver/.test(n)) return 1;
  if (/emotion|arc/.test(n)) return 1;
  if (/share|stepps/.test(n)) return 1;
  return 1.5;
}
// Derive the headline "overall" from the per-dimension scores (weighted), so that
// fixing a weak dimension MECHANICALLY raises the overall instead of leaving it to
// the model's gut number (which clustered in the low 60s and never moved).
function computeOverall(json) {
  const scores = json && Array.isArray(json.scores) ? json.scores.filter(s => s && typeof s.score === "number") : [];
  if (!scores.length) return typeof (json && json.overall) === "number" ? Math.round(json.overall) : null;
  let wsum = 0, w = 0;
  for (const s of scores) { const k = dimWeight(s.name); wsum += k * s.score; w += k; }
  return Math.max(0, Math.min(100, Math.round(wsum / w)));
}

// ── useAnalysis -- shared runner for every checker tab ────────────────────────
// state: idle | loading | done | error
// when done with report=null → the tab shows its built-in SAMPLE (no key path)
function useAnalysis(type, opts = {}) {
  const pk = opts.persistKey;   // when set, the last result survives tab switches
  const boot = (() => { if (!pk) return null; try { return JSON.parse(sessionStorage.getItem(pk) || "null"); } catch (e) { return null; } })();
  const [state, setState] = React.useState(boot && boot.report ? "done" : "idle");
  const [report, setReport] = React.useState((boot && boot.report) || null);
  const [usage, setUsage] = React.useState((boot && boot.usage) || null);
  const [sources, setSources] = React.useState((boot && boot.sources) || null);
  const [err, setErr] = React.useState("");
  const mountedRef = React.useRef(true);
  React.useEffect(() => { return () => { mountedRef.current = false; }; }, []);
  React.useEffect(() => {
    if (!pk) return;
    try {
      if (state === "done" && report) sessionStorage.setItem(pk, JSON.stringify({ report, usage, sources }));
    } catch (e) {}
  }, [pk, state, report, usage, sources]);

  async function run({ userText, image, images, maxTokens, system }) {
    setErr(""); setReport(null); setUsage(null); setSources(null); setState("loading");
    const prov = getProvider();
    if (!canRunAnalysis()) {
      if (hasSandbox() && !['groq', 'openrouter'].includes(prov)) {
        // Inside a Claude artifact — show placeholder after brief delay
        const tid = setTimeout(() => { if (mountedRef.current) setState("done"); }, 850);
        return () => clearTimeout(tid);
      }
      setErr(prov === 'groq'
        ? "Add a Groq API key in Settings → Platform Data to use free AI analysis."
        : prov === 'openrouter'
          ? "Add an OpenRouter API key in Settings → Platform Data to use this provider."
          : "No API key found. Open Settings (the key icon) and add your Claude API key to use this tool.");
      setState("error");
      return;
    }
    try {
      const { text, usage, sources: rawSources } = prov === 'groq'
        ? await callGroqAnalysis({ system: system || buildSystem(type), userText, maxTokens })
        : prov === 'openrouter'
          ? await callOpenRouterAnalysis({ system: system || buildSystem(type), userText, maxTokens })
          : await callClaude({ system: system || buildSystem(type), userText, image, images, maxTokens, temperature: 0.4, forceJson: true });
      let json = parseReport(text);
      if (!json || typeof json !== "object") {
        const body = (text || "").trim();
        if (!body) throw new Error("The AI returned an empty response. Try again.");
        // If the model clearly tried to return the JSON report but it failed to
        // parse (truncated / malformed), do NOT dump raw JSON at the user -- ask
        // for a re-run. Only show plain text when the reply was genuinely prose.
        const looksLikeJson = /^[\s`]*[{[]/.test(body) || /"(verdict|scores|sections|bottomLine)"\s*:/.test(body);
        if (looksLikeJson) throw new Error("The analysis came back malformed — tap Re-analyze to try again.");
        json = { sections: [{ type: "text", title: "Analysis", body }] };
      }
      // Recompute the headline score from the dimensions (weighted) so it tracks
      // the actual per-dimension grades rather than the model's free-form number.
      const co = computeOverall(json);
      if (co != null) json.overall = co;
      setSources(Array.isArray(rawSources) && rawSources.length > 0 ? rawSources : null);
      setReport(json); setUsage(usage); setState("done");
      try {
        const vd = json.verdict || {};
        saveHistory({ type, t: Date.now(), level: vd.level || "yellow",
          score: typeof json.overall === "number" ? Math.round(json.overall) : null,
          title: vd.title || (json.winner && json.winner.label) || "Analysis",
          input: (() => {
            // Strip metadata preamble and hookUpgradeAsk boilerplate so history shows
            // the actual script/content, not headers. For all tab types.
            let s = String(userText || "");
            const scriptBody = s.match(/SCRIPT \(Version [AB]\):\n([\s\S]*?)(?:\n\nALSO:|$)/);
            if (scriptBody) s = scriptBody[1].trim();
            return s.slice(0, 2000);
          })(),
          report: json });
      } catch (e) {}
    } catch (e) {
      if (["NO_KEY", "NO_GROQ_KEY", "NO_OPENROUTER_KEY"].includes(String(e.message))) { setTimeout(() => { if (mountedRef.current) setState("done"); }, 600); return; }
      setErr(e.message || "Something went wrong."); setState("error");
    }
  }
  return { state, report, usage, sources, err, run,
    reset: () => { setState("idle"); setReport(null); setUsage(null); setSources(null); setErr(""); if (pk) try { sessionStorage.removeItem(pk); } catch (e) {} } };
}

// Convert a structured report object to clean Markdown (for download).
function reportToMarkdown(report) {
  if (!report || typeof report !== "object") return "";
  const lines = [];
  const v = report.verdict || {};
  lines.push("# ContentIntel Analysis Report");
  if (typeof report.overall === "number") lines.push(`**Overall Score: ${Math.round(report.overall)}/100**`);
  lines.push("");
  if (v.title) { lines.push(`## ${v.title}`); if (v.text) lines.push(v.text); lines.push(""); }
  if (Array.isArray(report.scores) && report.scores.length) {
    lines.push("## Scores");
    for (const s of report.scores) lines.push(`- **${s.name}**: ${Math.round(s.score)}/100 — ${s.why || ""}`);
    lines.push("");
  }
  for (const sec of (report.sections || [])) {
    if (!sec) continue;
    if (sec.title) lines.push(`## ${sec.title}`);
    if (sec.desc) lines.push(`*${sec.desc}*`);
    if (sec.type === "text" && sec.body) { lines.push(sec.body); }
    else if (sec.type === "copy") { for (const b of (sec.blocks || [])) { if (b.label) lines.push(`### ${b.label}`); if (b.text) lines.push(b.text); } }
    else if (sec.type === "checklist") { for (const it of (sec.items || [])) { const icon = it.state === "yes" ? "✅" : it.state === "no" ? "❌" : "⚡"; lines.push(`${icon} ${it.text || ""}`); } }
    else if (sec.type === "kv") { for (const r of (sec.rows || [])) lines.push(`- **${r.k}**: ${r.v}`); }
    else if (sec.type === "issues") { for (const it of (sec.items || [])) { const icon = it.level === "red" ? "🔴" : "🟡"; lines.push(`${icon} ${it.text || ""}`); } }
    else if (sec.type === "beats") { for (const it of (sec.items || [])) lines.push(`- **${it.label || it.beat || ""}**: ${it.desc || it.text || ""}`); }
    lines.push("");
  }
  if (report.bottomLine) { lines.push("## Biggest Fix"); lines.push(report.bottomLine); lines.push(""); }
  if (report.winner && report.winner.pick) {
    lines.push("## Winner"); lines.push(`**${report.winner.label || report.winner.pick}** — ${report.winner.why || ""}`); lines.push("");
  }
  lines.push("---"); lines.push("*Generated by ContentIntel — https://contentintel.in*");
  return lines.join("\n");
}

// Lazy-load a script once, resolving when its global is ready.
function loadScriptOnce(src, globalName) {
  return new Promise((resolve, reject) => {
    if (globalName && window[globalName]) return resolve(window[globalName]);
    const existing = document.querySelector(`script[data-cdn="${src}"]`);
    if (existing) { existing.addEventListener('load', () => resolve(globalName ? window[globalName] : true)); existing.addEventListener('error', reject); return; }
    const s = document.createElement('script');
    s.src = src; s.async = true; s.dataset.cdn = src;
    s.onload = () => resolve(globalName ? window[globalName] : true);
    s.onerror = () => reject(new Error('Failed to load ' + src));
    document.head.appendChild(s);
  });
}
window.loadScriptOnce = loadScriptOnce;

// Export a DOM element to a multi-page A4 PDF via html2canvas + jsPDF (lazy CDN).
async function exportElementToPDF(el, filename) {
  if (!el) throw new Error('Nothing to export.');
  await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', 'html2canvas');
  await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', 'jspdf');
  const jsPDFctor = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
  if (!jsPDFctor) throw new Error('PDF engine unavailable.');
  const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
  const canvas = await window.html2canvas(el, { scale: 2, useCORS: true, backgroundColor: isDark ? '#0d0d0f' : '#ffffff', logging: false });
  const pdf = new jsPDFctor({ unit: 'pt', format: 'a4', compress: true });
  const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
  const margin = 24;
  const imgW = pw - margin * 2;
  const imgH = (canvas.height * imgW) / canvas.width;
  const img = canvas.toDataURL('image/jpeg', 0.92);
  let remaining = imgH, posY = margin;
  if (imgH <= ph - margin * 2) {
    pdf.addImage(img, 'JPEG', margin, posY, imgW, imgH);
  } else {
    // Slice the tall capture across pages.
    let srcY = 0;
    const pageContentH = ph - margin * 2;
    const pxPerPt = canvas.width / imgW;
    while (srcY < canvas.height) {
      const sliceH = Math.min(pageContentH * pxPerPt, canvas.height - srcY);
      const part = document.createElement('canvas');
      part.width = canvas.width; part.height = sliceH;
      part.getContext('2d').drawImage(canvas, 0, srcY, canvas.width, sliceH, 0, 0, canvas.width, sliceH);
      const partImg = part.toDataURL('image/jpeg', 0.92);
      pdf.addImage(partImg, 'JPEG', margin, margin, imgW, sliceH / pxPerPt);
      srcY += sliceH;
      if (srcY < canvas.height) pdf.addPage();
    }
  }
  pdf.save(filename);
}
window.exportElementToPDF = exportElementToPDF;

        </Block>
      ))}

      {/* Scores */}
      {Array.isArray(report.scores) && report.scores.length > 0 && (
        <Block title="Scores" mood={mood}>
          {report.scores.map((s, i) => <ScoreBar key={i} name={s.name} score={s.score} why={s.why} />)}

      {/* Beat sheet -- the script broken down */}
      {beats.map((s, i) => (
        <Block key={"b" + i} title={s.title || "Script breakdown"} desc={s.desc} mood={mood}>

        </Block>

      {/* Fix these */}
      {issues.map((s, i) => (
        <Block key={"i" + i} title={s.title || "Fix these"} mood={mood}>{(s.items || []).map((it, j) => <Issue key={j} level={it.level || "yellow"}>{it.text}</Issue>)}</Block>
      ))}

      {/* Biggest fix -- the one action */}
      {report.bottomLine && (
        <Block mood={mood} style={{ background: `linear-gradient(135deg, ${m.orbC}55, var(--surface-1))`, border: `1px solid ${m.accentGlow}` }}>

          <div style={{ fontSize: 16, lineHeight: 1.55, marginTop: 10, color: "var(--text-1)" }}>{report.bottomLine}</div>
        </Block>
      )}

      {/* Everything else -- collapsible to keep it scannable */}
      {rest.map((sec, i) => {
        if (sec.type === "copy") {
          // Thumbnail upgrade prompts: show them OPEN and prominent, each with a

            return (
              <Block key={"r" + i} title={sec.title || "Ways to upgrade it"} mood={mood}>
                {sec.desc && <div style={{ fontSize: 12.5, color: "var(--text-3)", margin: "0 0 12px", lineHeight: 1.5 }}>{sec.desc}</div>}

            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>

                  onApply={isHookSection ? () => onApplyText(b.text) : undefined} />

        }
        if (sec.type === "checklist")
          return <Collapsible key={"r" + i} title={sec.title || "Checklist"}>{(sec.items || []).map((it, j) => <Check key={j} state={it.state || "mid"}>{it.text}</Check>)}</Collapsible>;
        if (sec.type === "kv")
          return <Collapsible key={"r" + i} title={sec.title || "Details"}>
            {(sec.rows || []).map((r, j) => (
              <div key={j} style={{ display: "grid", gridTemplateColumns: r.level ? "20px 150px 1fr" : "150px 1fr", gap: 12, alignItems: "center", padding: "11px 0", borderTop: j ? "1px solid var(--stroke-1)" : "none", fontSize: 13 }}>
                {r.level && <span className={"ci-dot " + r.level} />}
                <span style={{ color: "var(--text-3)", fontWeight: 500 }}>{r.k}</span>
                <span style={{ color: "var(--text-1)", lineHeight: 1.5 }}>{r.v}</span>
              </div>

        if (sec.type === "text")
          return <Collapsible key={"r" + i} title={sec.title || "More"}><div style={{ fontSize: 13.5, color: "var(--text-2)", lineHeight: 1.6, whiteSpace: "pre-wrap" }}>{sec.body}</div></Collapsible>;
        return null;
      })}

      {/* Shareable, branded summary -- every share markets the tool */}
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginTop: 4 }}>
        <button className="ci-copybtn" style={{ height: 34 }} onClick={() => {
          const sc = typeof report.overall === "number" ? Math.round(report.overall) + "/100" : "";
          const v = report.verdict || {};
          const lines = [
            "ContentIntel report" + (sc ? " — " + sc : ""),
            v.title ? "Verdict: " + v.title + (v.text ? " — " + v.text : "") : "",
            ...(Array.isArray(report.scores) ? report.scores.map(x => "• " + x.name + ": " + Math.round(x.score)) : []),
            report.bottomLine ? "Biggest fix: " + report.bottomLine : "",
            "",
            "Checked with ContentIntel · https://contentintel.in",
          ].filter(Boolean);
          window.copyText(lines.join("\n"));
        }}>⧉ Copy shareable summary</button>
        <button className="ci-copybtn" style={{ height: 34 }} onClick={() => {
          const md = reportToMarkdown(report);
          const v = report.verdict || {};
          const slug = (v.title || "report").toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 40);
          window.downloadText ? window.downloadText(md, `contentintel-${slug}.md`) : downloadText(md, `contentintel-${slug}.md`);
        }}>⬇ Download .md</button>
        <button className="ci-copybtn" style={{ height: 34 }} onClick={downloadPDF} disabled={pdfState === "working"}>
          {pdfState === "working" ? "⏳ Building PDF…" : pdfState === "error" ? "✗ PDF failed" : "⬇ Download PDF"}
        </button>
        <span style={{ fontSize: 11.5, color: "var(--text-5)" }}>Includes a contentintel.in credit — share your wins.</span>
      </div>
    </div>
  );
}

// ── YouTube Data API v3 helpers ───────────────────────────────────────────────
// Parse a channel handle from various formats: @handle, youtube.com/@handle, etc.
function parseYTHandle(input) {
  const s = (input || '').trim();
  const m = s.match(/(?:youtube\.com\/@?|^@?)([A-Za-z0-9_.-]{3,})/);
  return m ? m[1].replace(/^@/, '') : s.replace(/^@/, '');
}

async function fetchYTChannel(handleOrUrl, key) {
  const handle = parseYTHandle(handleOrUrl);
  if (!handle) throw new Error('Need a channel handle.');
  let url;
  if (key === '__proxy__') {
    // SaaS mode: route through Cloudflare Worker (key stays server-side)
    const workerUrl = ((window.CI_SAAS || {}).workerUrl || '').replace(/\/$/, '');
    if (!workerUrl) throw new Error('Worker URL not configured.');
    url = `${workerUrl}/yt?action=channel&handle=${encodeURIComponent(handle)}`;
  } else {
    if (!key) throw new Error('Need a YouTube API key. Add it in Settings → Platform Data.');
    url = `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&forHandle=${encodeURIComponent(handle)}&key=${encodeURIComponent(key)}`;
  }
  const res = await fetch(url);
  const data = await res.json();
  if (data.error) throw new Error('YouTube API: ' + (data.error.message || (typeof data.error === 'string' ? data.error : 'request failed')));
  if (!data.items || !data.items.length) throw new Error(`Channel "@${handle}" not found. Check the handle and try again.`);
  return data.items[0];
}

// Extract a YouTube video ID from a full URL or bare ID
function parseYTVideoId(input) {
  const s = (input || '').trim();
  const m1 = s.match(/youtu\.be\/([A-Za-z0-9_-]{11})/);
  if (m1) return m1[1];
  const m2 = s.match(/[?&]v=([A-Za-z0-9_-]{11})/);
  if (m2) return m2[1];
  const m3 = s.match(/\/shorts\/([A-Za-z0-9_-]{11})/);
  if (m3) return m3[1];
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  return null;
}

async function fetchYTComments(videoId, key, maxResults = 50) {
  const workerUrl = ((window.CI_SAAS || {}).workerUrl || '').replace(/\/$/, '');
  let url;
  if (key === '__proxy__') {
    if (!workerUrl) throw new Error('Worker URL not configured.');
    url = `${workerUrl}/yt?action=comments&videoId=${encodeURIComponent(videoId)}&maxResults=${maxResults}`;
  } else {
    if (!key) throw new Error('Need a YouTube API key.');
    url = `https://www.googleapis.com/youtube/v3/commentThreads?part=snippet&videoId=${encodeURIComponent(videoId)}&maxResults=${maxResults}&order=relevance&key=${encodeURIComponent(key)}`;
  }
  const res = await fetch(url);
  const data = await res.json();
  if (data.error) throw new Error('YouTube API: ' + (data.error.message || (typeof data.error === 'string' ? data.error : 'request failed')));
  return (data.items || []).map(item => {
    const s = item.snippet.topLevelComment.snippet;
    return {
      author: s.authorDisplayName || 'Anonymous',
      text: s.textDisplay || '',
      likes: s.likeCount || 0,
      published: s.publishedAt || '',
    };
  });
}

async function fetchYTVideos(channelId, key, maxResults = 25) {
  const workerUrl = ((window.CI_SAAS || {}).workerUrl || '').replace(/\/$/, '');
  // Step 1: search for recent videos
  let searchUrl;
  if (key === '__proxy__') {
    if (!workerUrl) throw new Error('Worker URL not configured.');
    searchUrl = `${workerUrl}/yt?action=videos&channelId=${encodeURIComponent(channelId)}&maxResults=${maxResults}`;
  } else {
    if (!key) throw new Error('Need a YouTube API key.');
    searchUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${encodeURIComponent(channelId)}&maxResults=${maxResults}&order=date&type=video&key=${encodeURIComponent(key)}`;
  }
  const searchRes = await fetch(searchUrl);
  const searchData = await searchRes.json();
  if (searchData.error) throw new Error('YouTube API: ' + (searchData.error.message || (typeof searchData.error === 'string' ? searchData.error : 'request failed')));
  const items = searchData.items || [];
  const videoIds = items.map(v => v.id?.videoId || v.id).filter(Boolean).join(',');
  // Step 2: fetch statistics + duration for those videos
  let statsMap = {};
  if (videoIds) {
    try {
      let statsUrl;
      if (key === '__proxy__') {
        statsUrl = `${workerUrl}/yt?action=videostats&ids=${encodeURIComponent(videoIds)}`;
      } else {
        statsUrl = `https://www.googleapis.com/youtube/v3/videos?part=statistics,contentDetails&id=${encodeURIComponent(videoIds)}&key=${encodeURIComponent(key)}`;
      }
      const statsRes = await fetch(statsUrl);
      const statsData = await statsRes.json();
      for (const v of (statsData.items || [])) {
        statsMap[v.id] = {
          viewCount:    v.statistics?.viewCount    || '0',
          likeCount:    v.statistics?.likeCount    || '0',
          commentCount: v.statistics?.commentCount || '0',
          duration:     v.contentDetails?.duration || '',
        };
      }
    } catch (e) { /* stats are bonus — don't fail if this step errors */ }
  }
  return items.map(v => {
    const id = v.id?.videoId || v.id;
    const st = statsMap[id] || {};
    return {
      title:        v.snippet.title,
      videoId:      id,
      description:  v.snippet.description,
      published:    v.snippet.publishedAt,
      viewCount:    st.viewCount    || '0',
      likeCount:    st.likeCount    || '0',
      commentCount: st.commentCount || '0',
      duration:     st.duration     || '',
    };
  });
}

// Format rich video data for Claude prompts
function formatVideoStats(videos) {
  function fmt(n) { const v = parseInt(n||0); return v>=1e6?(v/1e6).toFixed(1)+'M':v>=1000?(v/1000).toFixed(0)+'K':String(v); }
  function age(pub) {
    if (!pub) return '';
    const d = Math.floor((Date.now()-new Date(pub))/(86400000));
    return d<7?`${d}d`:d<30?`${Math.floor(d/7)}w`:d<365?`${Math.floor(d/30)}mo`:`${Math.floor(d/365)}y`;
  }
  function dur(iso) {
    if (!iso) return '';
    const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
    if (!m) return '';
    const h=parseInt(m[1]||0),mn=parseInt(m[2]||0),s=parseInt(m[3]||0);
    return h?`${h}:${String(mn).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${mn}:${String(s).padStart(2,'0')}`;
  }
  const hasStats = videos.some(v => parseInt(v.viewCount||0) > 0);
  return videos.map((v,i) => {
    const parts = [`${i+1}. "${v.title}"`];
    if (hasStats) {
      parts.push(`${fmt(v.viewCount)} views`);
      parts.push(`${fmt(v.likeCount)} likes`);
      parts.push(`${fmt(v.commentCount)} comments`);
      const views = parseInt(v.viewCount||0);
      if (views > 0) {
        const eng = (((parseInt(v.likeCount||0)+parseInt(v.commentCount||0))/views)*100).toFixed(2);
        parts.push(`${eng}% engagement`);
      }
    }
    const d = dur(v.duration); if (d) parts.push(d);
    const a = age(v.published); if (a) parts.push(a+' ago');
    return parts.join(' | ');
  }).join('\n');
}

// Compute deep channel analytics from video array
function analyzeChannelMetrics(videos) {
  if (!videos || !videos.length) return null;
  function durSecs(iso) {
    if (!iso) return 0;
    const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
    if (!m) return 0;
    return (parseInt(m[1]||0)*3600)+(parseInt(m[2]||0)*60)+parseInt(m[3]||0);
  }
  const DAY = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const sorted = [...videos].sort((a,b) => new Date(b.published)-new Date(a.published));
  const dates = sorted.map(v => new Date(v.published)).filter(d => !isNaN(d.getTime()));
  // Posting frequency
  let avgGapDays = null, postsPerMonth = null, postsPerWeek = null;
  if (dates.length >= 2) {
    const spanDays = (dates[0]-dates[dates.length-1])/86400000;
    avgGapDays = Math.round(spanDays/(dates.length-1));
    postsPerMonth = spanDays > 0 ? Math.round((dates.length/spanDays)*30*10)/10 : null;
    postsPerWeek  = spanDays > 0 ? Math.round((dates.length/spanDays)*7*10)/10 : null;
  }
  // Day of week
  const dayCounts = Array(7).fill(0);
  dates.forEach(d => dayCounts[d.getDay()]++);
  const topDayIdx = dayCounts.indexOf(Math.max(...dayCounts));
  const topDay = DAY[topDayIdx];
  const dayDist = DAY.map((name,i) => dayCounts[i] > 0 ? `${name}(${dayCounts[i]})` : null).filter(Boolean).join(', ');
  // Hour of day
  const hourCounts = Array(24).fill(0);
  dates.forEach(d => hourCounts[d.getHours()]++);
  const topHour = hourCounts.indexOf(Math.max(...hourCounts));
  const timeSlot = topHour<6?'Late night (12–6am)':topHour<12?'Morning (6am–12pm)':topHour<18?'Afternoon (12–6pm)':'Evening (6pm–12am)';
  // Performance
  const withStats = videos.filter(v => parseInt(v.viewCount||0)>0);
  let avgViews=0,avgLikes=0,avgComments=0,avgEngRate=0,maxViews=0,minViews=Infinity;
  let topVideo=null,bottomVideo=null;
  if (withStats.length) {
    const byV = [...withStats].sort((a,b)=>parseInt(b.viewCount)-parseInt(a.viewCount));
    topVideo = byV[0]; bottomVideo = byV[byV.length-1];
    avgViews = Math.round(withStats.reduce((s,v)=>s+parseInt(v.viewCount||0),0)/withStats.length);
    avgLikes = Math.round(withStats.reduce((s,v)=>s+parseInt(v.likeCount||0),0)/withStats.length);
    avgComments = Math.round(withStats.reduce((s,v)=>s+parseInt(v.commentCount||0),0)/withStats.length);
    const rates = withStats.map(v=>{ const vv=parseInt(v.viewCount||0); return vv?((parseInt(v.likeCount||0)+parseInt(v.commentCount||0))/vv)*100:0; });
    avgEngRate = Math.round(rates.reduce((s,r)=>s+r,0)/rates.length*100)/100;
  }
  // Duration
  const durs = videos.map(v=>durSecs(v.duration)).filter(d=>d>0);
  const avgDurSecs = durs.length ? Math.round(durs.reduce((s,d)=>s+d,0)/durs.length) : 0;
  const shorts = durs.filter(d=>d<=60).length;
  const mids   = durs.filter(d=>d>60&&d<=600).length;
  const longs  = durs.filter(d=>d>600).length;
  return { avgGapDays, postsPerMonth, postsPerWeek, topDay, dayDist, timeSlot, topHour,
    avgViews, avgLikes, avgComments, avgEngRate, avgDurSecs, shorts, mids, longs,
    totalVideos: videos.length, withStats: withStats.length, topVideo, bottomVideo };
}

// Full competitor analytics block for Claude prompt
function formatCompetitorAnalytics(videos, channelInfo) {
  function fmt(n) { const v=parseInt(n||0); return v>=1e6?(v/1e6).toFixed(1)+'M':v>=1000?(v/1000).toFixed(0)+'K':String(v); }
  function fmtDur(s) { if(!s)return'?'; const m=Math.floor(s/60),sec=s%60; return `${m}m ${sec}s`; }
  const mx = analyzeChannelMetrics(videos);
  const lines = [];
  if (channelInfo) {
    lines.push(`Channel: ${channelInfo.name}`);
    lines.push(`Subscribers: ${fmt(channelInfo.subs)} | Total channel videos: ${channelInfo.videoCount}`);
  }
  if (mx) {
    lines.push('\n=== POSTING BEHAVIOUR ===');
    if (mx.postsPerMonth !== null) {
      lines.push(`Frequency: ~${mx.postsPerMonth} videos/month (~${mx.postsPerWeek}/week)`);
      lines.push(`Avg gap between posts: ${mx.avgGapDays} days`);
    }
    lines.push(`Most active day: ${mx.topDay}`);
    lines.push(`Day distribution: ${mx.dayDist}`);
    lines.push(`Typical posting time: ${mx.timeSlot}`);
    lines.push('\n=== PERFORMANCE METRICS ===');
    if (mx.avgViews > 0) {
      lines.push(`Avg views/video: ${fmt(mx.avgViews)}`);
      lines.push(`Avg likes/video: ${fmt(mx.avgLikes)}`);
      lines.push(`Avg comments/video: ${fmt(mx.avgComments)}`);
      lines.push(`Avg engagement rate: ${mx.avgEngRate}% (likes+comments/views)`);
    }
    if (mx.topVideo) lines.push(`Top performer: "${mx.topVideo.title}" — ${fmt(mx.topVideo.viewCount)} views (${((parseInt(mx.topVideo.likeCount||0)+parseInt(mx.topVideo.commentCount||0))/Math.max(1,parseInt(mx.topVideo.viewCount||1))*100).toFixed(2)}% eng)`);
    if (mx.bottomVideo) lines.push(`Weakest performer: "${mx.bottomVideo.title}" — ${fmt(mx.bottomVideo.viewCount)} views`);
    lines.push('\n=== CONTENT FORMAT ===');
    lines.push(`Avg video length: ${fmtDur(mx.avgDurSecs)}`);
    if (mx.shorts > 0) lines.push(`Shorts (≤60s): ${mx.shorts}/${mx.totalVideos} videos`);
    if (mx.mids   > 0) lines.push(`Mid-length (1–10min): ${mx.mids}/${mx.totalVideos} videos`);
    if (mx.longs  > 0) lines.push(`Long-form (>10min): ${mx.longs}/${mx.totalVideos} videos`);
  }
  lines.push('\n=== RECENT VIDEOS (newest first, with per-video metrics) ===');
  lines.push(formatVideoStats(videos));
  return lines.join('\n');
}

// Transcribe audio/video using Groq Whisper (free tier: 2000 min/day, 25MB max file).
// Returns SRT-formatted transcript string.
async function transcribeWithGroq(file, groqKey) {
  if (!groqKey) throw new Error("NO_GROQ_KEY");
  const formData = new FormData();
  formData.append('file', file);
  formData.append('model', 'whisper-large-v3-turbo');
  formData.append('response_format', 'verbose_json');
  formData.append('timestamp_granularities[]', 'segment');
  const res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + groqKey },
    body: formData,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    if (res.status === 401 || res.status === 403) throw new Error("Groq key rejected — check it in Settings → Platform Data.");
    if (res.status === 413) throw new Error("File too large — Groq Whisper accepts up to 25 MB.");
    throw new Error((err.error && err.error.message) || ("Transcription failed (" + res.status + ")."));
  }
  const data = await res.json();
  const segments = data.segments || [];
  if (!segments.length) return data.text || "";
  function fmtSrt(secs) {
    const h = Math.floor(secs / 3600), mn = Math.floor((secs % 3600) / 60), s = Math.floor(secs % 60), ms = Math.round((secs % 1) * 1000);
    return `${String(h).padStart(2,'0')}:${String(mn).padStart(2,'0')}:${String(s).padStart(2,'00')},${String(ms).padStart(3,'0')}`;
  }
  return segments.map((seg, i) => `${i+1}\n${fmtSrt(seg.start)} --> ${fmtSrt(seg.end)}\n${seg.text.trim()}`).join('\n\n');
}

// Analysis via Groq (free tier — Llama 3.3 70B, OpenAI-compatible).
// Returns { text, usage } in the same shape as callClaudeOnce so useAnalysis can swap providers.
async function callGroqAnalysis({ system, userText, maxTokens = 1800 }) {
  const groqKey = getGroqKey();
  if (!groqKey) throw new Error("NO_GROQ_KEY");
  const groqTool = {
    type: "function",
    function: { name: REPORT_TOOL.name, description: REPORT_TOOL.description, parameters: REPORT_TOOL.input_schema },
  };
  const messages = [
    ...(system ? [{ role: "system", content: system }] : []),
    { role: "user", content: userText },
  ];
  let lastErr;
  for (let attempt = 0; attempt < 3; attempt++) {
    if (attempt > 0) await new Promise(r => setTimeout(r, 900 * Math.pow(2, attempt - 1) + Math.random() * 400));
    let res;
    try {
      res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: { "content-type": "application/json", "Authorization": "Bearer " + groqKey },
        body: JSON.stringify({ model: "llama-3.3-70b-versatile", max_tokens: maxTokens, messages, tools: [groqTool], tool_choice: { type: "function", function: { name: "submit_report" } } }),
      });
    } catch (e) { throw new Error("Couldn't reach Groq (network error). Check your connection."); }
    if (res.status === 429) {
      lastErr = new Error("Groq rate limit hit (30 req/min on free tier). Wait a moment and try again.");
      continue;
    }
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      if (res.status === 401 || res.status === 403) throw new Error("Groq key rejected — add it in Settings → Platform Data.");
      throw new Error((err.error && err.error.message) || ("Groq request failed (" + res.status + ")."));
    }
    const data = await res.json();
    const choice = (data.choices || [])[0] || {};
    const msg = choice.message || {};
    const toolCall = (msg.tool_calls || [])[0];
    const text = toolCall ? toolCall.function.arguments : (msg.content || "");
    const gu = data.usage || {};
    const usage = gu.prompt_tokens ? { input_tokens: gu.prompt_tokens, output_tokens: gu.completion_tokens || 0 } : null;
    if (usage) {
      window.CI_SESSION_USAGE.in  += usage.input_tokens;
      window.CI_SESSION_USAGE.out += usage.output_tokens;
      try { window.dispatchEvent(new Event('ci-usage-update')); } catch (e) {}
    }
    return { text, usage };
  }
  throw lastErr || new Error("Groq request failed after retries.");
}

// Analysis via OpenRouter (400+ models, many completely free).
// Returns { text, usage } in the same shape as callClaudeOnce so useAnalysis can swap providers.
async function callOpenRouterAnalysis({ system, userText, maxTokens = 1800 }) {
  const key = getOpenRouterKey();
  if (!key) throw new Error("NO_OPENROUTER_KEY");
  const orTool = {
    type: "function",
    function: { name: REPORT_TOOL.name, description: REPORT_TOOL.description, parameters: REPORT_TOOL.input_schema },
  };
  const messages = [
    { role: "system", content: system || "" },
    { role: "user", content: userText },
  ];
  const model = getOpenRouterModel();
  let lastErr = null;
  for (let attempt = 0; attempt < 3; attempt++) {
    let res;
    try {
      res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "Authorization": "Bearer " + key,
          "HTTP-Referer": typeof window !== "undefined" ? window.location.origin : "",
          "X-Title": "ContentIntel",
        },
        body: JSON.stringify({ model, max_tokens: maxTokens, messages, tools: [orTool], tool_choice: { type: "function", function: { name: "submit_report" } } }),
      });
    } catch (e) { throw new Error("Couldn't reach OpenRouter (network error). Check your connection."); }
    if (res.status === 429) {
      lastErr = new Error("OpenRouter rate limit hit. Wait a moment and try again.");
      await new Promise(r => setTimeout(r, 1000 * (attempt + 1)));
      continue;
    }
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      if (res.status === 401 || res.status === 403) throw new Error("OpenRouter key rejected — check it in Settings → Platform Data.");
      throw new Error((err.error && err.error.message) || ("OpenRouter request failed (" + res.status + ")."));
    }
    const data = await res.json();
    const choice = (data.choices || [])[0];
    let text = "";
    if (choice?.message?.tool_calls?.length > 0) {
      const tc = choice.message.tool_calls[0];
      const args = tc?.function?.arguments;
      text = typeof args === "string" ? args : JSON.stringify(args || {});
    } else {
      text = choice?.message?.content || "";
    }
    const usage = data.usage ? { input_tokens: data.usage.prompt_tokens || 0, output_tokens: data.usage.completion_tokens || 0 } : null;
    return { text, usage };
  }
  throw lastErr || new Error("OpenRouter request failed after retries.");
}

// Light / dark theme toggle (persists in localStorage; applied to <html data-theme>).
function ThemeToggle() {
  const [light, setLight] = React.useState(() => {
    try { return localStorage.getItem('ci_theme') === 'light'; } catch (e) { return false; }
  });
  React.useEffect(() => {
    const root = document.documentElement;
    if (light) root.setAttribute('data-theme', 'light'); else root.removeAttribute('data-theme');
    try { localStorage.setItem('ci_theme', light ? 'light' : 'dark'); } catch (e) {}
    try { window.dispatchEvent(new Event('ci-theme')); } catch (e) {}
  }, [light]);
  return (
    <button className={'ci-themeswitch' + (light ? ' light' : '')} title={light ? 'Switch to dark mode' : 'Switch to light mode'}
      onClick={() => setLight(v => !v)} aria-label="Toggle theme">
      <span className="ci-themeswitch-icon sun">
        <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.8"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.5 3.5l1.4 1.4M11.1 11.1l1.4 1.4M12.5 3.5l-1.4 1.4M4.9 11.1l-1.4 1.4"/></svg>
      </span>
      <span className="ci-themeswitch-icon moon">
        <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M13 9.5A5.5 5.5 0 016.5 3a5.5 5.5 0 106.5 6.5z"/></svg>
      </span>
      <span className="ci-themeswitch-knob" />
    </button>
  );
}

// Copy-to-clipboard block
// Robust copy — clipboard API with an execCommand fallback for sandbox / file://
// / non-HTTPS contexts where navigator.clipboard is blocked. Resolves true/false.
function copyText(text) {
  const t = typeof text === 'string' ? text : String(text == null ? '' : text);
  return new Promise((resolve) => {
    const fallback = () => {
      try {
        const ta = document.createElement('textarea');
        ta.value = t; ta.setAttribute('readonly', '');
        ta.style.position = 'fixed'; ta.style.top = '-9999px'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.focus(); ta.select();
        try { ta.setSelectionRange(0, t.length); } catch (e) {}
        const ok = document.execCommand('copy');
        document.body.removeChild(ta); resolve(!!ok);
      } catch (e) { resolve(false); }
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(t).then(() => resolve(true), fallback);
      } else fallback();
    } catch (e) { fallback(); }
  });
}
function downloadText(text, filename) {
  try {
    const blob = new Blob([text || ''], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename || 'report.txt'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (e) {}
}

function QualityGraph({ points = [], mood = 'navy' }) {

  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${xs(i).toFixed(1)},${ys(p.value).toFixed(1)}`).join(' ');
  const area = `${line} L${xs(pts.length - 1).toFixed(1)},${base} L${xs(0).toFixed(1)},${base} Z`;

                ))}
              </div>
              {pkg.data.thumbnailBrief && (
                <div style={{ marginTop: 10, padding: '11px 13px', borderRadius: 10, background: `${m.orbB || m.accentFrom}14`, border: `1px solid ${m.accentGlow}40` }}>
                  <div style={{ fontSize: 11, fontWeight: 700, color: m.accentFrom, textTransform: 'uppercase', letterSpacing: '.05em', marginBottom: 4 }}>Thumbnail image brief — visual context for a pro look</div>
                  <div style={{ fontSize: 13, color: 'var(--text-2)', lineHeight: 1.55 }}>{pkg.data.thumbnailBrief}</div>
                  <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
                    {onNav && <SRB mood={mood} onClick={() => sendToBuilder()}>🎨 Build this thumbnail →</SRB>}
                    <button className="ci-copybtn" style={{ height: 38, padding: '0 12px', fontSize: 12 }} onClick={() => window.copyText(pkg.data.thumbnailBrief)}>⧉ Copy brief</button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      )}
    </SB>
  );

  return (
    <div className="ci-work" style={{ '--ci-accent': m.accentFrom, '--ci-glow': m.accentGlow }}>
      <SWH mood={mood} eyebrow="Script" title={scrMode === 'create' ? 'Create a script' : 'Check your script'}
        sub={scrMode === 'create' ? 'Start from a topic — get a ready-to-record script and hook options, then check & refine it.' : "Paste your video script. We'll tell you what's working, what's not, and how to fix it — line by line."} />

      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12, flexWrap: 'wrap', marginBottom: 18 }}>
        <div style={{ display: 'inline-flex', gap: 4, padding: 5, borderRadius: 999, border: '1px solid var(--stroke-2)', background: 'var(--surface-2)' }}>
          {['create', 'check'].map(mode => (
            <button key={mode} className="pill" onClick={() => setScrMode(mode)}
              style={{ height: 34, border: 'none', textTransform: 'capitalize', background: scrMode === mode ? 'var(--surface-3)' : 'transparent', fontWeight: scrMode === mode ? 700 : 500 }}>
              {mode === 'create' ? '✦ Create' : '✓ Check'}
            </button>
          ))}
        </div>
        {(text.trim() || topic.trim() || (cgen && cgen.script) || report || (pkg && pkg.data) || (fc && fc.data)) && (
          <button className="ci-copybtn" style={{ height: 34, padding: '0 14px', fontSize: 12.5 }} onClick={resetAll} title="Clear the script, analysis, fact-check and packaging">↺ New / Reset</button>
        )}
      </div>

      {scrMode === 'create' && (
        <SB mood={mood} style={{ padding: 22 }}>
          <label className="ci-label">What's your video about?</label>
          <textarea className="ci-textarea" style={{ minHeight: 64 }} value={topic} onChange={e => setTopic(e.target.value)}
            placeholder="e.g. How beginners should start SIP investing · Why most reels flop" />
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginTop: 14 }}>
            <SCG label="Content" options={['Education', 'Entertainment', 'Tech', 'Fitness', 'Comedy', 'Vlog', 'Finance', 'Ad', 'Other']} value={kind} onChange={setKind} />
            <SCG label="Going to" options={['Reels', 'TikTok', 'Shorts', 'YouTube', 'Other']} value={where} onChange={setWhere} />
            <SCG label="Language" options={['Auto-detect', 'English', 'Hindi', 'Hinglish', 'Spanish', 'Other']} value={lang} onChange={setLang} />
          </div>
          <div style={{ marginTop: 16 }}>
            <SRB mood={mood} onClick={genScript} loading={cgen.loading}>✦ Generate script</SRB>
            {topic.trim().length < 3 && <span style={{ fontSize: 12, color: 'var(--text-4)', marginLeft: 12 }}>Enter a topic first.</span>}
          </div>
          {cgen.err && <div style={{ fontSize: 13, color: '#f5788c', marginTop: 12 }}>{cgen.err}</div>}
          {cgen.hooks && cgen.hooks.length > 0 && (
            <div style={{ marginTop: 18 }}>
              <Eyebrow mood={mood} glow>Hook options</Eyebrow>
              <div style={{ fontSize: 12, color: 'var(--text-4)', marginTop: 4, marginBottom: 6 }}>Tap a hook to drop it into the draft script below as the opening line.</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 0, marginTop: 4 }}>
                {cgen.hooks.map((h, i) => {
                  const on = cgen.sel === i;
                  return (
                    <button key={i} type="button" onClick={() => applyCreateHook(i, h.text)}
                      style={{ display: 'flex', gap: 10, alignItems: 'flex-start', textAlign: 'left', width: '100%', cursor: 'pointer',
                        padding: '10px 10px', borderTop: i ? '1px solid var(--stroke-1)' : 'none', border: 'none', borderRadius: 8,
                        background: on ? 'var(--surface-2)' : 'transparent', outline: on ? '1px solid ' + ((m && m.accentFrom) || 'var(--stroke-2)') : 'none' }}>
                      <span style={{ fontFamily: 'var(--font-display)', fontWeight: 800, color: (h.score >= 75 ? '#8FD86A' : h.score >= 55 ? '#F0C85A' : '#F06A7E'), width: 30 }}>{h.score != null ? Math.round(h.score) : '–'}</span>
                      <span style={{ flex: 1, fontSize: 13.5, color: 'var(--text-1)' }}>{h.text} <span style={{ fontSize: 10.5, color: 'var(--text-5)', textTransform: 'uppercase' }}>{h.type}</span></span>
                      <span style={{ fontSize: 11, color: on ? 'var(--text-2)' : 'var(--text-5)', flexShrink: 0, alignSelf: 'center' }}>{on ? '✓ in script' : 'Use →'}</span>
                    </button>
                  );
                })}
              </div>
            </div>
          )}
          {cgen.script && (
            <div style={{ marginTop: 18 }}>
              <Eyebrow mood={mood} glow>Draft script</Eyebrow>
              {cgen.warnRaw && (
                <div style={{ fontSize: 12, color: '#F0C85A', marginTop: 6, marginBottom: 4 }}>
                  Script returned as plain text (JSON parse failed) — content is intact but hook scores are unavailable.
                </div>
              )}
              <div style={{ marginTop: 8 }}><SCB text={cgen.script} label="Copy script" /></div>
              {cgen.sources && cgen.sources.length > 0 && (
                <div style={{ marginTop: 14 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 11.5, color: 'var(--text-4)', textTransform: 'uppercase', letterSpacing: '.06em', marginBottom: 8 }}>
                    <span aria-hidden style={{ opacity: .8 }}>🔗</span>
                    Verified from {cgen.sources.length} {cgen.sources.length === 1 ? 'source' : 'sources'} — click to check
                  </div>
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
                    {cgen.sources.map((s, i) => {
                      let host = ''; try { host = new URL(s.url).hostname.replace(/^www\./, ''); } catch (e) { host = s.url; }
                      return (
                        <a key={i} href={s.url} target="_blank" rel="noopener noreferrer nofollow" title={s.title}
                          style={{ display: 'inline-flex', alignItems: 'center', gap: 6, maxWidth: 260, padding: '6px 10px', borderRadius: 999, border: '1px solid var(--stroke-1)', background: 'var(--surface-1)', color: 'var(--text-2)', fontSize: 12, textDecoration: 'none' }}>
                          <span aria-hidden style={{ fontSize: 11, opacity: .7 }}>↗</span>
                          <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{s.title || host}</span>
                          {s.date && <span style={{ color: 'var(--text-5)', fontSize: 10.5, flexShrink: 0 }}>· {s.date}</span>}
                        </a>
                      );
                    })}
                  </div>
                </div>
              )}
              <div style={{ marginTop: 12 }}><SRB mood={mood} onClick={() => useGenerated(cgen.script)}>Use this + check it →</SRB></div>
            </div>
          )}
        </SB>
      )}

      {scrMode === 'check' && (
      <SB mood={mood} style={{ padding: 22 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 }}>
          <STg on={compare} onChange={setCompare} mood={mood}>Compare two versions</STg>
          <input ref={fileRef} type="file" accept=".txt,.md,.text,.docx,.doc,text/plain" style={{ display: 'none' }} onChange={onFile} />
          <button type="button" className="ci-drop" style={{ minHeight: 40, padding: '8px 14px', width: 'auto', border: '1px solid var(--stroke-1)' }}
            onClick={() => fileRef.current && fileRef.current.click()}>
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M8 10.5V3M5 6l3-3 3 3M3 11.5v1a1 1 0 001 1h8a1 1 0 001-1v-1"/></svg>
            Upload (.txt, .md, .docx)
          </button>
        </div>

        <div style={{ display: 'grid', gridTemplateColumns: compare ? '1fr 1fr' : '1fr', gap: 12 }}>
          <div>
            {compare && <label className="ci-label">Version A</label>}
            <textarea className="ci-textarea" value={text} onChange={e => setText(e.target.value)} placeholder="Type or paste your script here…" />
          </div>
          {compare && (
            <div>
              <label className="ci-label">Version B</label>
              <textarea className="ci-textarea" value={textB} onChange={e => setTextB(e.target.value)} placeholder="Paste the second version here..." />
            </div>
          )}
        </div>

        <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginTop: 16 }}>
          <SCG label="Language" options={['Auto-detect', 'English', 'Hindi', 'Hinglish', 'Spanish', 'Other']} value={lang} onChange={setLang} />
          <SCG label="Content" options={['Education', 'Entertainment', 'Tech', 'Fitness', 'Comedy', 'Vlog', 'Finance', 'Ad', 'Other']} value={kind} onChange={setKind} />
          <SCG label="Audience" options={['General', 'Gen Z', 'Millennials', 'Professionals', 'Beginners']} value={who} onChange={setWho} />
          <SCG label="Going to" options={['Reels', 'TikTok', 'Shorts', 'YouTube', 'Other']} value={where} onChange={setWhere} />
        </div>

        <div className="ci-wpm" style={{ marginTop: 16 }}>
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="var(--text-3)" strokeWidth="1.6"><path d="M2.5 13V3M2.5 13h11M5 11V8M8 11V5.5M11 11V7"/></svg>
          <span>Word count: <b>{words}</b></span>
          <span style={{ color: 'var(--text-5)' }}>·</span>
          <span>Video length: <b>~{seconds}s</b></span>
          <span style={{ color: 'var(--text-5)' }}>·</span>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, color: lengthOk ? '#8FD86A' : '#F0C85A' }}>
            <span className={'ci-dot ' + (lengthOk ? 'green' : 'yellow')} /> {lengthOk ? `Good length for ${where}` : `A bit long for ${where} — consider trimming`}
            {!lengthOk && (
              <button className="ci-copybtn" style={{ height: 22, padding: '0 9px', fontSize: 11, marginLeft: 4 }}
                onClick={() => { setRewrite(r => ({ ...r, dir: `Trim to under ${where === 'Reels' || where === 'Shorts' ? '35' : '60'} seconds` })); document.querySelector('.ci-scroll')?.scrollTo({ top: 9999, behavior: 'smooth' }); }}>
                Trim it →
              </button>
            )}
          </span>
        </div>

        <div style={{ marginTop: 16 }}>
          <window.AnalyzeButton mood={mood} onClick={check} loading={state === 'loading'} estIn={estIn} estOut={8000} label="Check my script"
            disabled={!ready} disabledHint={text.trim() ? 'Script is too short to analyze — paste the full script (10+ words).' : 'Paste your script first — nothing to check yet.'} />
        </div>
      </SB>
      )}

      {state === 'loading' && <div style={{ marginTop: 14 }}><SLR rows={3} /></div>}
      {state === 'error' && <window.ErrorCard msg={err} onOpenKey={onOpenKey} />}

      {state === 'done' && report && (
        <div className="ci-results" style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          <window.UsageBadge usage={usage} />
          <window.ReportView report={report} mood={mood} onApplyText={applyHook} sources={sources} />
          {rewritePanel}
          {!!text.trim() && factCheckPanel}
          {!!text.trim() && packagingPanel}
        </div>
      )}

      {state === 'done' && !report && (
        <div className="ci-results" style={{ marginTop: 16, display: 'flex', flexDirection: 'column', gap: 14 }}>
          <div className="ci-sample-note" onClick={onOpenKey}>
            <span className="ci-dot yellow" /> This is a <b>sample report</b>. Add your Anthropic API key to analyze <i>your</i> script for real → <span style={{ textDecoration: 'underline' }}>Connect key</span>
          </div>
          <TrafficLight level="yellow" title="Needs work"
            text="Fix the issues marked in red before posting. Your topic is strong — the opening and middle need attention." />
          <SB title="Fix these first" desc="These 3 things will make the biggest difference" mood={mood}
            right={<span className="pill" style={{ height: 26 }}>🎯 Priority</span>}>
            <SSI mood={mood} name="Opening hook" score={62} why="Your first line doesn't give the viewer a reason to stay. It starts too slow — the question is good but the delivery buries it." />
            <SSI mood={mood} name="Will they stay" score={71} why="Good flow in the middle, but energy drops around line 8–10. Viewers may swipe before the payoff." />
            <SSI mood={mood} name="Will they engage" score={55} why="Missing a clear call-to-action. Viewers won't know what to do next — no follow, comment, or save prompt." />
          </SB>
          <SB title="Your hook" desc="Hook type: Question hook" mood={mood}>
            <div style={{ fontSize: 13.5, color: 'var(--text-2)', marginBottom: 12, lineHeight: 1.5 }}>A question hook works, but yours asks then stalls. Lead with the stakes, then the question.</div>
            <SCB text={`90% log SIP mein paisa ganwa dete hain — aur galti sirf ek hoti hai. Aaj woh galti main aapko dikhata hoon.`} label="Copy hook" />
          </SB>
          <SB title="What we found" mood={mood}>
            <SIs level="red">No pattern interrupt for 6 lines straight. Viewer will get bored around line 5.</SIs>
            <SIs level="yellow">Your main point doesn't land until 50% through. Move it earlier.</SIs>
            <SIs level="green">Good use of Hinglish — feels natural and relatable for working people.</SIs>
          </SB>
          <SB title="Your ending is weak" desc="Here's a stronger close" mood={mood}>
            <SCB text={`Agar yeh kaam aaya, toh save kar lo — next video mein woh 3 funds bataunga jo main khud use karta hoon.`} label="Copy CTA" />
          </SB>
          <SB mood={mood} style={{ background: `linear-gradient(135deg, ${m.orbC}55, var(--surface-1))`, border: `1px solid ${m.accentGlow}` }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 12 }}>
              <div style={{ width: 30, height: 30, borderRadius: 9, background: `linear-gradient(135deg, ${m.accentFrom}, ${m.accentTo})`, display: 'grid', placeItems: 'center', color: '#07090E', fontWeight: 700 }}>✦</div>
              <Eyebrow mood={mood} glow>Bottom line</Eyebrow>
            </div>
            <div style={{ fontSize: 16, lineHeight: 1.55, color: 'var(--text-1)' }}>
              Your hook is weak and the middle drags, but the topic is strong. Fix the opening 2 lines and add a pattern break around line 6 — <span style={{ color: m.accentFrom, fontWeight: 600 }}>that alone will significantly improve retention.</span>
            </div>
            <div style={{ display: 'flex', gap: 8, marginTop: 18 }}>
              <button className="ci-copybtn" style={{ height: 34 }} onClick={() => window.copyText(SAMPLE_REPORT_TEXT)}>📋 Copy full report</button>
              <button className="ci-copybtn" style={{ height: 34 }} onClick={() => window.downloadText(SAMPLE_REPORT_TEXT, 'script-report.txt')}>↓ Download as text file</button>
            </div>
          </SB>
          {rewritePanel}
        </div>
      )}
    </div>
  );
}
window.ScriptTab = ScriptTab;
</script>
<script type="text/babel" data-presets="react">
/* ===== ci-ask.jsx ===== */
// ContentIntel — Ask tab: research-grounded growth Q&A (Instagram / YouTube / any platform)

const { MOODS: AM, Block: AB, RunButton: ARB, WorkHead: AWH, LoadingResults: ALR } = window;

const ASK_SUGGESTIONS = [
  'Why are my Reels stuck at 200 views?',
  'Best time to post on Instagram?',
  'How many hashtags should I actually use?',
  'How do I get more saves and shares?',
  'Reels vs carousels — what grows faster?',
  'How do I do Instagram SEO for my page?',
  "My followers grow but views don't. Why?",
  'How much should I charge for a brand deal?',
  'What should I post on each day of the week?',
  'How do trial reels work?',
];

function buildAskSystem() {
  const live = window.liveResearch();
  const core = live.core || '';
  const askR = window.getResearch('ask') || {};
  const scriptR = window.getResearch('script') || {};
  const thumbR = window.getResearch('thumbnail') || {};
  return [
    `You are ContentIntel's growth strategist. Answer the user's question directly, specifically and practically — cite numbers, thresholds, and tactics, not vague tips.`,
    `WEB VERIFICATION: you have a live web_search tool. When the answer depends on current facts, platform features, algorithm changes, numbers, pricing, tools or anything time-sensitive, search and cross-check multiple real sources FIRST, then answer from what you actually find -- never guess or rely on stale memory, and never ask the user to provide sources. Skip searching only for timeless, opinion-based questions.`,
    `LANGUAGE LAW: answer in the same language as the question (Hindi -> Hindi, Hinglish -> Hinglish, English -> English).`,
    core ? `PLATFORM & ALGORITHM RESEARCH (ground your answer in this):\n"""\n${core}\n"""` : '',
    scriptR.systemGuidance ? `HOOK & SCRIPT SCIENCE:\n${String(scriptR.systemGuidance).slice(0, 900)}` : '',
    thumbR.systemGuidance ? `THUMBNAIL SCIENCE:\n${String(thumbR.systemGuidance).slice(0, 600)}` : '',
    askR.systemGuidance || '',
    askR.notes || 'Output JSON: {"answer":"2-5 short paragraphs with specific numbers/thresholds","steps":["3-6 concrete do-today actions"],"related":["2-3 follow-up questions"]}. Return ONLY the JSON object.',
  ].filter(Boolean).join('\n\n');
}

function AskTab({ onOpenKey }) {
  const mood = 'violet';
  const m = AM[mood];
  const [q, setQ] = React.useState('');
  const [state, setState] = React.useState('idle'); // idle | loading | done | error
  const [err, setErr] = React.useState('');
  // Thread: array of { q, out } — newest last. Displayed newest-first.
  const [thread, setThread] = React.useState([]);
  const inputRef = React.useRef(null);
  const SS_ASK = 'ci_ask_session';

  // Rehydrate thread from sessionStorage on mount so it survives tab switches.
  React.useEffect(() => {
    try {
      const saved = JSON.parse(sessionStorage.getItem(SS_ASK) || 'null');
      if (Array.isArray(saved) && saved.length > 0) setThread(saved);
    } catch (e) {}
  }, []);

  // Persist thread to sessionStorage on every change.
  React.useEffect(() => {
    try {
      if (thread.length > 0) sessionStorage.setItem(SS_ASK, JSON.stringify(thread));
      else sessionStorage.removeItem(SS_ASK);
    } catch (e) {}
  }, [thread]);

  const currentOut = thread.length > 0 ? thread[thread.length - 1] : null;
  const pastThread = thread.slice(0, -1).reverse(); // older items, newest-first

  async function ask(question) {
    const text = String(question || q).trim();
    if (!text || state === 'loading') return;
    setQ(''); setErr(''); setState('loading');
    try {
      // Prepend up to 4 prior Q/A turns as context for follow-up questions.
      const ctx = thread.slice(-4).map(t => `Q: ${t.q}\nA: ${typeof t.out.answer === 'string' ? t.out.answer.slice(0, 700) : ''}...`).join('\n\n');
      const userText = ctx ? `PREVIOUS CONTEXT:\n${ctx}\n\nQUESTION: ${text}` : `QUESTION: ${text}`;
      const { text: raw } = await window.callClaude({
        system: buildAskSystem(),
        userText,
        maxTokens: 1600,
        temperature: 0.5,
      });
      let json = window.parseReport(raw);
      if (!json || (!json.answer && !json.steps)) {
        const body = (raw || '').trim();
        if (!body) throw new Error('Empty response — try again.');
        json = { answer: body, steps: [], related: [] };
      }
      setThread(prev => [...prev.slice(-4), { q: text, out: json }]);
      setState('done');
      try { window.saveHistory({ type: 'ask', t: Date.now(), level: 'green', score: null, title: text.slice(0, 80) }); } catch (e) {}
      document.querySelector('.ci-scroll')?.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) {
      if (String(e.message) === 'NO_KEY') {
        setErr('Add your Anthropic API key (top-right) to ask live questions — it takes 30 seconds.');
      } else {
        setErr(e.message || 'Something went wrong — try again.');
      }
      setState('error');
    }
  }

  function startFresh() {
    setThread([]); setQ(''); setErr(''); setState('idle');
    try { sessionStorage.removeItem('ci_ask_session'); } catch (e) {}
    document.querySelector('.ci-scroll')?.scrollTo({ top: 0, behavior: 'smooth' });
  }

  return (
    <div className="ci-work" style={{ '--ci-accent': m.accentFrom, '--ci-glow': m.accentGlow }}>
      <AWH mood={mood} eyebrow="Ask anything" title="Your growth questions, answered"
        sub="Instagram, YouTube, Reels, SEO, brand deals — ask in any language. Answers come from real platform research, not generic advice." />

      <AB mood={mood} style={{ padding: 22 }}>
        <div style={{ display: 'flex', gap: 10 }}>
          <input ref={inputRef} className="ci-input" style={{ fontSize: 15.5, height: 52 }}
            value={q} onChange={e => setQ(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') ask(); }}
            placeholder={thread.length > 0 ? 'Ask a follow-up...' : 'e.g. Why are my Reels stuck at 200 views?'} />
          <ARB mood={mood} onClick={() => ask()} loading={state === 'loading'}>Ask →</ARB>
        </div>
        {thread.length === 0 && (
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginTop: 14 }}>
            {ASK_SUGGESTIONS.map(s => (
              <button key={s} className="pill" style={{ height: 32, fontSize: 12.5 }} onClick={() => ask(s)}>{s}</button>
            ))}
          </div>
        )}
        {thread.length > 0 && (
          <div style={{ marginTop: 12, display: 'flex', alignItems: 'center', gap: 10 }}>
            <span style={{ fontSize: 12, color: 'var(--text-4)' }}>{thread.length} question{thread.length !== 1 ? 's' : ''} in this conversation</span>
            <button className="ci-copybtn" style={{ height: 26, padding: '0 10px', fontSize: 11 }} onClick={startFresh}>Start fresh</button>
          </div>
        )}
      </AB>

      {state === 'loading' && <div style={{ marginTop: 14 }}><ALR rows={3} /></div>}
      {state === 'error' && (
        <div className="ci-block" style={{ marginTop: 14, border: '1px solid rgba(245,120,140,0.3)' }}>
          <div style={{ fontSize: 13.5, color: 'var(--text-2)', lineHeight: 1.6 }}>{err}</div>
          <button className="ci-copybtn" style={{ height: 32, marginTop: 12 }} onClick={onOpenKey}>Open Settings</button>
          <div style={{ marginTop: 14, fontSize: 12, color: 'var(--text-4)' }}>Or try one of these:</div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginTop: 8 }}>
            {ASK_SUGGESTIONS.slice(0, 4).map(s => (
              <button key={s} className="pill" style={{ height: 30, fontSize: 12 }} onClick={() => { setState('idle'); setErr(''); ask(s); }}>{s}</button>
            ))}
          </div>
        </div>
      )}

      {(state === 'done' || state === 'idle') && currentOut && (
        <div className="ci-results" style={{ marginTop: 16, display: 'flex', flexDirection: 'column', gap: 14 }}>
          {/* Current answer */}
          <AB mood={mood}>
            <div style={{ fontSize: 12.5, color: 'var(--text-4)', marginBottom: 10 }}>You asked: <i>{currentOut.q}</i></div>
            <div style={{ fontSize: 15, lineHeight: 1.7, color: 'var(--text-1)', whiteSpace: 'pre-wrap' }}>{currentOut.out.answer}</div>
          </AB>

          {Array.isArray(currentOut.out.steps) && currentOut.out.steps.length > 0 && (
            <AB title="Do this today" mood={mood}>

// Read an uploaded image file → { mime, data(base64, no prefix), preview }
function readImage(file, cb) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const url = reader.result;
    const img = new Image();
    img.onload = () => {
      const MAX = 1568;
      const scale = Math.min(1, MAX / Math.max(img.width, img.height));
      if (scale >= 1 && String(url).length < 2.5e6) {
        cb({ mime: file.type || 'image/png', data: String(url).split(',')[1] || '', preview: url, name: file.name });
        return;
      }
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const out = canvas.toDataURL('image/jpeg', 0.88);
      cb({ mime: 'image/jpeg', data: out.split(',')[1] || '', preview: out, name: file.name });
    };
    img.onerror = () => cb({ mime: file.type || 'image/png', data: String(url).split(',')[1] || '', preview: url, name: file.name });
    img.src = url;
  };
  reader.readAsDataURL(file);
}

    "HOW TO HANDLE FACTS: you have a live web_search tool. If the topic involves real people, products, events, brands or current trends, search to ground the concepts in what actually looks right and is currently working. BUT if you cannot verify it, do NOT refuse or ask the user -- treat the idea as the creator's premise and write the concepts anyway. Research silently; just produce the concepts.",
    core ? 'CLICK SCIENCE:\n"""\n' + core.slice(0, 1500) + '\n"""' : '',

    hasPhoto

function chatgptPrompt(base, hasImage, strict, guidance) {

    : `Create a bold, high click-through 16:9 YouTube thumbnail.`;

// Image generation has two routes: (1) in-app via the user's own Google
// (Gemini/Imagen) or OpenAI image key -- creates the picture right here; and
// (2) a handoff (window.openInChatGPT / window.openInGemini) that opens those

// Generate-and-show card: an in-app "⚡ Generate" button (when an image key is

function ThumbGenCard({ prompt, source, m }) {
  const [genState, setGenState] = React.useState('idle');

  const [genErr, setGenErr] = React.useState('');

  async function generate() {

    setGenState('loading'); setGenImg(null); setGenErr('');

      let url;
      if (source && window.editThumbnailInApp) url = await window.editThumbnailInApp(prompt, source, '16:9');
      else if (window.generateImageInApp) url = await window.generateImageInApp(prompt, '16:9');

            onClick={generate} disabled={genState === 'loading'}>

// ── THUMBNAIL ────────────────────────────────────────────────────────────────
function ThumbnailTab({ onOpenKey }) {
  const mood = 'ember';
  const m = TM[mood];
  const [mode, setMode] = React.useState('Check');
  const [cmpMode, setCmpMode] = React.useState('Single');
  const count = cmpMode === 'A/B/C' ? 3 : cmpMode === 'A/B' ? 2 : 1;
  const compare = count > 1;
  const [title, setTitle] = React.useState('');
  const [showTitle, setShowTitle] = React.useState(true);
  const [kind, setKind] = React.useState('Auto-detect');
  const [layout, setLayout] = React.useState('Auto-detect');
  const [scheme, setScheme] = React.useState('Auto-detect');
  const [nicheSel, setNicheSel] = React.useState('Auto-detect');
  const [strict, setStrict] = React.useState(true);
  const [imgA, setImgA] = React.useState(null);
  const [imgB, setImgB] = React.useState(null);
  const [imgC, setImgC] = React.useState(null);
  const [descA, setDescA] = React.useState('');
  const [descB, setDescB] = React.useState('');
  const [descC, setDescC] = React.useState('');
  const LBL = ['A', 'B', 'C'];
  const imgsAll = [imgA, imgB, imgC], setImgs = [setImgA, setImgB, setImgC];
  const descsAll = [descA, descB, descC], setDescs = [setDescA, setDescB, setDescC];
  // Brand kit + regeneration guidance
  const [brand, setBrand] = React.useState(loadBrandKit);
  const [emphasis, setEmphasis] = React.useState([]);
  const [addNote, setAddNote] = React.useState('');
  React.useEffect(() => { saveBrandKit(brand); }, [brand]);
  const setColor = (i, v) => setBrand(b => ({ ...b, colors: b.colors.map((c, j) => j === i ? v : c) }));
  const addColor = () => setBrand(b => b.colors.length >= 5 ? b : ({ ...b, colors: [...b.colors, '#FFE14D'] }));
  const delColor = (i) => setBrand(b => ({ ...b, colors: b.colors.filter((_, j) => j !== i) }));
  const toggleEmph = (c) => setEmphasis(e => e.includes(c) ? e.filter(x => x !== c) : [...e, c]);
  const { state, report, usage, sources, err, run } = window.useAnalysis('thumbnail');

  // Layout + colour options come straight from the research design library (single source of truth).
  const TLib = window.getResearch('thumbnail') || {};
  const layoutOpts = ['Auto-detect', ...((TLib.layouts || []).map(x => x.name))];
  const schemeOpts = ['Auto-detect', ...((TLib.colorSchemes || []).map(x => x.name))];
  const nicheOpts = ['Auto-detect', ...((window.nicheNames && window.nicheNames('thumbnail')) || []), 'None (universal)'];

  // Vision works with a personal key OR when signed in through the Worker (owner key).
  const hasVision = !!window.getKey() || !!(typeof window !== 'undefined' && window.CI_SESSION && (window.CI_SAAS || {}).workerUrl);
  const targetLine =
    (layout !== 'Auto-detect' ? `Target layout archetype: ${layout}\n` : '') +
    (scheme !== 'Auto-detect' ? `Target colour scheme: ${scheme}\n` : '') +
    ((layout === 'Auto-detect' && scheme === 'Auto-detect') ? 'Auto-detect the layout archetype and colour scheme and judge their fit.\n' : '');
  const brandColors = (brand.colors || []).filter(Boolean);
  const guidance = [
    brandColors.length ? `Brand colours: ${brandColors.join(', ')} -- build the regenerated thumbnail's palette around these (background / highlight box / number / accents) so it is on-brand, keeping strong contrast.` : '',
    brand.note ? `Brand notes: ${brand.note}` : '',
    emphasis.length ? `What to add / emphasise in the regeneration: ${emphasis.join('; ')}.` : '',
    addNote.trim() ? `Also for the regeneration: ${addNote.trim()}` : '',
  ].filter(Boolean).join('\n');
  const guidanceBlock = guidance ? `\nREGENERATION GUIDANCE:\n${guidance}\n` : '';
  const head = `Video title: ${(showTitle && title.trim()) ? title.trim() : '(none given)'}\nContent type: ${kind === 'Auto-detect' ? '(detect it from the thumbnail/title)' : kind}\n${targetLine}\n`;
  // No API key => the free AI is TEXT-ONLY and cannot see the uploaded images.
  // It must NOT fabricate scores or a winner it can't actually see.
  const noVision = !hasVision;
  const blindNote = noVision
    ? `IMPORTANT: Image vision is OFF (no API key connected). You CANNOT see the actual images -- judge ONLY from any text descriptions below. For ANY thumbnail with no description, you genuinely cannot evaluate it: do NOT guess, do NOT score it, and do NOT pick it as the winner. If you do not have enough described thumbnails to compare fairly, say so plainly and tell the user to connect an API key (for real image vision) or describe each thumbnail in words -- and in that case DO NOT output a winner.\n\n`
    : '';
  const cell = (i) => descsAll[i].trim() || (noVision ? '(no description given -- and the image cannot be seen)' : `(see attached Image ${i + 1})`);
  const userText = (compare
    ? head + blindNote +
      Array.from({ length: count }, (_, i) => `THUMBNAIL ${LBL[i]}${noVision ? '' : ` (= Image ${i + 1})`}: ${cell(i)}`).join('\n') + '\n\n' +
      `Compare these ${count} thumbnails for the SAME video and, ONLY if you can actually evaluate them, declare a single winner: fill the "winner" field with pick = A, B${count === 3 ? ' or C' : ''}, rank them and give the one specific reason it wins. Judge the ACTUAL execution you can see (text legibility, face/expression, contrast, focal clarity) -- a worse-executed "improved" version can legitimately lose to a cleaner original; never favour a version just because it is labelled the upgrade.`
    : head + blindNote +
      `THUMBNAIL: ${descA.trim() || (noVision ? '(no description given -- and the image cannot be seen)' : '(judge from the attached image)')}\n\n` +
      `Judge whether this thumbnail will earn the click.`) + guidanceBlock;
  // Vision works for single AND multi-image (A/B/C) when a key is present.
  const imgs = hasVision ? (compare ? imgsAll.slice(0, count).filter(Boolean) : (imgA ? [imgA] : [])) : [];
  // Ask for 3 ranked, ready-to-generate upgrade prompts (basic -> mild -> bold).
  const upgradeAsk = compare ? '' :
    '\n\nALSO: end the report with a "copy" section titled "3 ways to upgrade this thumbnail" containing EXACTLY 3 blocks, each a complete, ready-to-paste, DETAILED image prompt for ChatGPT/Gemini. The three MUST differ sharply in scope -- do NOT write three similar prompts; each must clearly change MORE than the one before, and read very differently:\n' +

    '- block 2 label "2 - Mild redesign (same person & text, new design)": keep the same person, topic and EXACT text, but do NOT keep the existing layout -- redesign creatively: different composition and background, reposition/relight the subject, change or add visual elements, a bolder colour scheme.\n' +
    '- block 3 label "3 - Full reimagining (change everything)": reimagine the whole thumbnail -- you MAY change the expression, pose, composition, background, elements, colour and layout; keep ONLY the topic and exact text. The boldest, most scroll-stopping concept.';
  // Niche routing + edit mode are baked into the system prompt (one source of truth).

  const estIn = window.estTokens(system, fullUserText) + imgs.length * 1400;

  const slotsReady = Array.from({ length: count }).every((_, i) => imgsAll[i] || descsAll[i].trim().length >= 12);

      if (j && Array.isArray(j.concepts) && j.concepts.length) setGenIdeas({ loading: false, items: j.concepts, err: '' });
      else setGenIdeas({ loading: false, items: null, err: 'Could not generate concepts -- try again.' });
    } catch (e) {
      setGenIdeas({ loading: false, items: null, err: String(e.message) === 'NO_KEY' ? 'Add your Anthropic (Claude) API key in Settings to write concepts.' : (e.message || 'Could not generate.') });

  }
  return (
    <div className="ci-work" style={{ '--ci-accent': m.accentFrom, '--ci-glow': m.accentGlow }}>

        sub={mode === 'Generate' ? 'Describe what you want (and optionally upload one to remix) -- generate straight away, no analysis.' : "Upload your thumbnail. We'll check if it'll get clicks -- based on what actually works, not how pretty it looks."} />

      <div style={{ marginBottom: 16 }}>
        <TCG label="Mode" options={['Check', 'Generate']} value={mode} onChange={setMode} />
      </div>

      {mode === 'Generate' && (<>
        <TB mood={mood}>
          <label className="ci-label">Upload your photo <span style={{ fontWeight: 400, color: 'var(--text-4)' }}>-- optional, but keeps your real face in the thumbnail</span></label>
          <ImageDrop image={imgA} onPick={setImgA} label="Drop your photo -- JPG or PNG (optional)" />
          <label className="ci-label" style={{ marginTop: 16 }}>What's the thumbnail for? <span style={{ fontWeight: 400, color: 'var(--text-4)' }}>-- a topic or a rough idea</span></label>
          <textarea className="ci-textarea" style={{ minHeight: 80 }} value={genPrompt} onChange={e => setGenPrompt(e.target.value)}
            placeholder="e.g. 'My video on how beginners should start SIP investing' or 'Shocked reaction to a ₹500 Cr story'" />
          <div style={{ marginTop: 14 }}>
            <window.GlowButton mood={mood} size="lg" onClick={genConcepts}>{genIdeas.loading ? 'Designing…' : '✦ Suggest 3 concepts'}</window.GlowButton>
            <span style={{ fontSize: 12, color: 'var(--text-4)', marginLeft: 12 }}>Uses your research + your photo to write ready prompts.</span>
          </div>
          {genIdeas.err && <div style={{ fontSize: 13, color: '#f5788c', marginTop: 12 }}>{genIdeas.err}</div>}
        </TB>

        {genIdeas.items && genIdeas.items.length > 0 && (
          <TB title="Thumbnail concepts" desc={imgA ? 'Built around your photo — attach it again when generating' : 'Upload your photo above for an accurate likeness'} mood={mood}>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
              {genIdeas.items.map((t, i) => (
                <div key={i} style={{ padding: 14, borderRadius: 12, border: '1px solid var(--stroke-1)', background: 'var(--surface-1)' }}>
